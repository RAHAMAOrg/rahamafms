<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHAMA Project Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="RAHAMA Empowerment Logo Design (3).png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Archivo:wght@600;700&display=swap');

        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #10b981;
            --danger: #D32F2F;
            --warning: #F57C00;
            --success: #059669;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --text: #1A1A1A;
            --text-muted: #616161;
            --border: #E0E0E0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --dark: #1E4D2B;
            --mid: #2E7D47;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            padding: 0 24px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            text-align: center;
        }

        .logo img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 8px; }
        .logo h1 { font-family: 'Archivo', sans-serif; font-size: 16px; font-weight: 700; color: var(--primary); }
        .logo p { font-size: 11px; color: var(--text-muted); }

        .user-card {
            margin: 0 16px 20px;
            padding: 12px 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
        }
        .user-card .name { font-weight: 700; color: var(--text); }
        .role-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .role-editor { background: #E8F5E9; color: var(--success); }
        .role-viewer { background: #E3F2FD; color: #1976D2; }

        .nav { list-style: none; }
        .nav button {
            width: 100%;
            padding: 11px 24px;
            text-align: left;
            background: none;
            border: none;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text);
            transition: all 0.2s;
            position: relative;
            font-family: 'DM Sans', sans-serif;
        }
        .nav button:hover { background: var(--bg); color: var(--primary); }
        .nav button.active {
            background: linear-gradient(90deg, rgba(5,150,105,0.1) 0%, transparent 100%);
            color: var(--primary);
            font-weight: 600;
        }
        .nav button.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--primary);
        }

        .portal-link {
            margin: 20px 16px 0;
            padding: 11px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            display: block;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }
        .portal-link:hover { background: linear-gradient(135deg, #047857, #065f46); transform: translateY(-1px); }

        .main {
            padding: 32px 40px;
            max-width: 1400px;
            overflow-x: auto;
        }

        .page-header { margin-bottom: 28px; }
        .page-header h2 { font-family: 'Archivo', sans-serif; font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .page-header p { color: var(--text-muted); font-size: 14px; }

        .alert-banner {
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .alert-banner.critical { background: #FFEBEE; border: 1px solid #FFCDD2; color: var(--danger); }
        .alert-banner.warning  { background: #FFF3E0; border: 1px solid #FFE0B2; color: var(--warning); }

        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .metric-card { padding: 20px; border-radius: 12px; color: white; }
        .metric-card .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.8; margin-bottom: 6px; }
        .metric-card .value { font-size: 22px; font-weight: 800; font-family: 'Archivo', sans-serif; line-height: 1.2; }
        .metric-card.green { background: var(--dark); }
        .metric-card.mid   { background: var(--mid); }
        .metric-card.red   { background: #8B1A1A; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--dark);
        }

        .table-wrap {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            overflow-x: auto;
            margin-bottom: 28px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        thead tr { background: var(--mid); }
        th { color: white; padding: 10px 12px; text-align: left; font-weight: 700; font-size: 11px; white-space: nowrap; }
        td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: top; }
        tr:nth-child(even) td { background: #f9fdf9; }
        tr:hover td { background: #f0faf4; }
        tfoot tr { background: var(--dark); }
        tfoot td { color: white; font-weight: 700; padding: 10px 12px; border-top: none; background: transparent; }

        .td-project { max-width: 260px; line-height: 1.4; }
        .td-note { max-width: 200px; font-size: 11px; color: var(--text-muted); line-height: 1.4; }
        .td-warn { background: #FFEBEE !important; color: #721C24; font-weight: 700; }

        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
        }
        .modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0,0,0,0.25);
        }
        .modal-header {
            background: var(--dark);
            padding: 16px 24px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .modal-header span { color: white; font-weight: 700; font-size: 15px; font-family: 'Archivo', sans-serif; }
        .modal-header button { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; line-height: 1; }
        .modal-body { padding: 24px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-full { grid-column: 1 / -1; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px 12px;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            background: white;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .form-group textarea { min-height: 72px; resize: vertical; }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        .btn { padding: 8px 20px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
        .btn-primary { background: var(--dark); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; color: var(--text); border: 1.5px solid #ccc; }
        .btn-secondary:hover { background: var(--bg); }
        .btn-add { background: var(--dark); color: white; padding: 7px 16px; font-size: 12px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; }
        .btn-edit { background: transparent; border: none; color: var(--mid); cursor: pointer; font-size: 12px; font-weight: 600; padding: 2px 6px; }
        .btn-del  { background: transparent; border: none; color: #8B1A1A; cursor: pointer; font-size: 12px; font-weight: 600; padding: 2px 6px; }
        .btn-edit:hover, .btn-del:hover { text-decoration: underline; }

        .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }

        .access-denied {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 60vh; text-align: center; color: var(--text-muted);
        }
        .access-denied .icon { font-size: 64px; margin-bottom: 16px; }
        .access-denied h2 { font-family: 'Archivo', sans-serif; color: var(--text); margin-bottom: 8px; }

        .loading { text-align: center; padding: 64px; }
        .spinner { font-size: 32px; color: var(--primary); display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .rcv-critical td { background: #FFF0F0 !important; }
        .rcv-pending  td { background: #FFFBEA !important; }

        .chip { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin: 2px; }

        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { height: auto; position: relative; }
            .main { padding: 16px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <img src="RAHAMA Empowerment Logo Design (3).png" alt="RAHAMA" onerror="this.style.display='none'">
            <h1>Project Tracker</h1>
            <p id="yearCaption">Grants Register</p>
        </div>
        <div class="user-card" id="userCard">
            <div class="name" id="userName">Loading…</div>
            <span class="role-badge" id="userRoleBadge">–</span>
        </div>

        <div style="padding:0 16px 14px">
            <label style="display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:6px">Year</label>
            <div style="display:flex;gap:6px">
                <select id="yearSelect" onchange="setYear(this.value)"
                        style="flex:1;padding:7px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-size:13px;font-weight:700"></select>
                <button onclick="addYear()" title="Add a year"
                        style="width:32px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer;font-family:inherit">+</button>
            </div>
        </div>

        <ul class="nav">
            <li><button onclick="showTab('dashboard')"    data-tab="dashboard" class="active">📊 Dashboard</button></li>
            <li><button onclick="showTab('pipeline')"     data-tab="pipeline">🔭 Pipeline</button></li>
            <li><button onclick="showTab('active')"       data-tab="active">✅ Active Grants</button></li>
            <li><button onclick="showTab('unsuccessful')" data-tab="unsuccessful">❌ Unsuccessful</button></li>
            <li><button onclick="showTab('receivables')"  data-tab="receivables">⚠ Receivables</button></li>
            <li><button onclick="showTab('audit')"        data-tab="audit">🕘 Change Log</button></li>
        </ul>
        <a href="index.html" class="portal-link">← Back to Portal</a>
    </aside>

    <main class="main" id="mainContent">
        <div class="loading"><span class="spinner">⟳</span><p style="margin-top:16px;color:var(--text-muted)">Loading tracker…</p></div>
    </main>
</div>

<div id="modalContainer"></div>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const SUPABASE_URL = 'https://sqygmoxpegbfxddglhbx.supabase.co';
const SUPABASE_KEY = 'sb_publishable__nPBgo9IeeU4Mrk_ggEeTg_YEkWrB24';

// NOTE: this check runs in the browser and can be bypassed by anyone who
// edits localStorage. It controls what the UI shows, NOT what the database
// permits. Real enforcement must live in Supabase RLS policies.
const AUTHORIZED_EMPLOYEE_EMAILS = [
    'salahuddeen.sambo@rgcweinigeria.org',
    'sani.hamisu@rgcweinigeria.org',
    'aisha.abdulrahman@rgcweinigeria.org',
    'maryam.tijjani@rgcweinigeria.org',
    'amina.yusuf@rgcweinigeria.org',
];

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let STATE = {
    user: null,
    canEdit: false,
    tab: 'dashboard',
    year: null,
    data: { grants: [], receivables: [], audit: [] }
};

const YEARS_KEY = 'tracker_extra_years';
const getExtraYears = () => {
    try { return JSON.parse(localStorage.getItem(YEARS_KEY)) || []; }
    catch (e) { return []; }
};
const saveExtraYears = ys => localStorage.setItem(YEARS_KEY, JSON.stringify(ys));

function allYears() {
    const fromData = STATE.data.grants.map(g => Number(g.year)).filter(Boolean);
    const set = new Set([...fromData, ...getExtraYears().map(Number)]);
    if (set.size === 0) set.add(new Date().getFullYear());
    return [...set].sort((a, b) => b - a);
}

const yearGrants = () => STATE.data.grants.filter(g => Number(g.year) === Number(STATE.year));
const byStage    = st => yearGrants().filter(g => g.stage === st);

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init() {
    const raw = localStorage.getItem('pms_user');
    if (!raw) { showAccessDenied('no-session'); return; }

    let session;
    try { session = JSON.parse(raw); }
    catch (e) { showAccessDenied('no-session'); return; }

    const name  = (session.name  || '').trim();
    const email = (session.email || '').toLowerCase().trim();
    const role  = (session.role  || '').toLowerCase().trim();

    if (role !== 'supervisor' && !AUTHORIZED_EMPLOYEE_EMAILS.includes(email)) {
        showAccessDenied('no-access');
        return;
    }

    STATE.user    = session;
    STATE.canEdit = true;

    document.getElementById('userName').textContent = name || email || 'User';
    const badge = document.getElementById('userRoleBadge');
    badge.textContent = 'Editor';
    badge.className = 'role-badge role-editor';

    try {
        await loadAllData();
    } catch (err) {
        console.error('Data load error:', err);
        document.getElementById('mainContent').innerHTML = `
            <div class="access-denied">
                <div class="icon">⚠️</div>
                <h2>Could not load tracker data</h2>
                <p style="margin-top:8px;max-width:400px">${esc(err.message) || 'A network or database error occurred.'}</p>
                <br>
                <button onclick="init()" class="btn btn-primary" style="margin-top:8px">Retry</button>
            </div>`;
        return;
    }

    const years = allYears();
    STATE.year = years.includes(new Date().getFullYear()) ? new Date().getFullYear() : years[0];
    refreshYearSelect();
    showTab('dashboard');
}

// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════
async function loadAllData() {
    const [g, r, a] = await Promise.all([
        db.from('grants_register').select('*').order('id', { ascending: true }),
        db.from('receivables').select('*').order('id', { ascending: true }),
        db.from('grants_audit').select('*').order('changed_at', { ascending: false }).limit(200)
    ]);

    if (g.error) throw new Error('grants_register: ' + g.error.message);
    STATE.data.grants = g.data || [];

    if (r.error) console.warn('receivables:', r.error.message);
    STATE.data.receivables = r.data || [];

    if (a.error) console.warn('grants_audit:', a.error.message);
    STATE.data.audit = a.data || [];
}

async function upsertRow(table, id, row) {
    row.updated_by = (STATE.user && (STATE.user.email || STATE.user.name)) || 'unknown';
    const res = id
        ? await db.from(table).update(row).eq('id', id)
        : await db.from(table).insert([row]);
    if (res.error) { alert('Error saving: ' + res.error.message); throw res.error; }
}

async function deleteRow(table, id) {
    if (!confirm('Delete this entry?\n\nIt will be removed from the tracker but retained in the Change Log.')) return;
    const { error } = await db.from(table).delete().eq('id', id);
    if (error) { alert('Error deleting: ' + error.message); return; }
    await reload();
}

async function reload() { await loadAllData(); refreshYearSelect(); showTab(STATE.tab); }

// ═══════════════════════════════════════════════════════
// YEARS
// ═══════════════════════════════════════════════════════
function refreshYearSelect() {
    const sel = document.getElementById('yearSelect');
    const years = allYears();
    if (!years.includes(Number(STATE.year))) STATE.year = years[0];
    sel.innerHTML = years.map(y =>
        `<option value="${y}"${Number(y) === Number(STATE.year) ? ' selected' : ''}>${y}</option>`).join('');
    document.getElementById('yearCaption').textContent = years.length > 1
        ? years[years.length - 1] + ' – ' + years[0]
        : String(years[0]);
}

function setYear(y) { STATE.year = Number(y); showTab(STATE.tab); }

function addYear() {
    const input = prompt('Add a year to the tracker (e.g. 2027):');
    if (!input) return;
    const y = parseInt(String(input).trim(), 10);
    if (isNaN(y) || y < 2000 || y > 2100) { alert('Please enter a valid four-digit year.'); return; }
    if (allYears().includes(y)) { alert(y + ' is already in the tracker.'); return; }
    const extra = getExtraYears();
    extra.push(y);
    saveExtraYears(extra);
    STATE.year = y;
    refreshYearSelect();
    showTab(STATE.tab);
}

// ═══════════════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════════════
function showTab(tab) {
    STATE.tab = tab;
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const main = document.getElementById('mainContent');
    switch (tab) {
        case 'dashboard':    renderDashboard(main);    break;
        case 'pipeline':     renderPipeline(main);     break;
        case 'active':       renderActive(main);       break;
        case 'unsuccessful': renderUnsuccessful(main); break;
        case 'receivables':  renderReceivables(main);  break;
        case 'audit':        renderAudit(main);        break;
    }
}

function showAccessDenied(reason) {
    document.getElementById('userName').textContent = 'Not signed in';
    const badge = document.getElementById('userRoleBadge');
    badge.textContent = 'No Access';
    badge.className = 'role-badge role-viewer';
    const main = document.getElementById('mainContent');
    main.innerHTML = reason === 'no-session' ? `
        <div class="access-denied">
            <div class="icon">🔐</div><h2>Please sign in first</h2>
            <p>You need to log in through the FMS portal to access this tracker.</p><br>
            <a href="index.html" style="background:var(--dark);color:white;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:700;">Go to Portal</a>
        </div>` : `
        <div class="access-denied">
            <div class="icon">🚫</div><h2>Access Restricted</h2>
            <p>The Project Tracker is only available to authorised staff.</p>
            <p style="margin-top:8px;">Please contact the Executive Director if you need access.</p><br>
            <a href="index.html" style="background:var(--dark);color:white;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:700;">← Back to Portal</a>
        </div>`;
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
const fmtUSD = n => n != null ? '$' + Number(n).toLocaleString('en-NG', {minimumFractionDigits:2, maximumFractionDigits:2}) : '–';
const fmtNGN = n => n != null ? '₦' + Number(n).toLocaleString('en-NG', {minimumFractionDigits:2, maximumFractionDigits:2}) : '–';
const pct    = n => (n != null ? (n * 100).toFixed(0) + '%' : '–');
const symOf  = c => c === 'EUR' ? '€' : c === 'NGN' ? '₦' : c === 'GBP' ? '£' : '$';
const esc    = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const STATUS_META = {
    'Awarded':            { bg: '#D4EDDA', fg: '#155724' },
    'Active':             { bg: '#D4EDDA', fg: '#1E4D2B' },
    'Awaiting Outcome':   { bg: '#FFF3CD', fg: '#856404' },
    'Not Awarded':        { bg: '#F8D7DA', fg: '#721C24' },
    'Not Submitted':      { bg: '#E8F4F8', fg: '#0C5460' },
    'Submitted':          { bg: '#E8F0FE', fg: '#1a3c8f' },
    'Closed':             { bg: '#E2E3E5', fg: '#383D41' },
    'On Hold':            { bg: '#E2E3E5', fg: '#555555' },
    'Overdue / Pending':  { bg: '#FFF3CD', fg: '#856404' },
    'Overdue / CRITICAL': { bg: '#F8D7DA', fg: '#8B1A1A' },
};

function badge(status) {
    const m = STATUS_META[status] || { bg: '#eee', fg: '#333' };
    return `<span class="badge" style="background:${m.bg};color:${m.fg}">${esc(status)}</span>`;
}
const editBtn = oc => STATE.canEdit ? `<button class="btn-edit" onclick="${oc}">✏</button>` : '';
const delBtn  = oc => STATE.canEdit ? `<button class="btn-del" onclick="${oc}">✕</button>` : '';
const addBtn  = (l, oc) => STATE.canEdit ? `<button class="btn-add" onclick="${oc}">${l}</button>` : '';

// Status drives stage. Mirrors the database trigger exactly.
const STAGE_OF = s => s === 'Awarded' || s === 'Active' ? 'active'
                    : s === 'Not Awarded' ? 'unsuccessful'
                    : s === 'Closed' ? 'closed'
                    : 'pipeline';

const ALL_STATUSES   = ['Not Submitted','Submitted','Awaiting Outcome','On Hold','Awarded','Active','Not Awarded','Closed'];
const RCVBL_STATUSES = ['Overdue / Pending','Overdue / CRITICAL','Paid','Partially Paid'];

const emptyBlock = msg =>
    `<div style="padding:48px 24px;text-align:center;color:var(--text-muted);background:white;border-radius:12px;border:1px solid var(--border)">${esc(msg)}</div>`;

// ═══════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════
function renderDashboard(el) {
    const y    = STATE.year;
    const pipe = byStage('pipeline');
    const act  = byStage('active');
    const uns  = byStage('unsuccessful');
    const rcv  = STATE.data.receivables;

    const pipeTotal    = pipe.reduce((s, p) => s + (p.amount || 0), 0);
    const pipeWeighted = pipe.reduce((s, p) => s + (p.amount || 0) * (p.prob || 0), 0);
    const actUsd       = act.reduce((s, g) => s + (g.total_usd || 0), 0);
    const actNgn       = act.reduce((s, g) => s + (g.total_ngn || 0), 0);
    const outUsd       = rcv.reduce((s, r) => s + (r.amount_usd || 0), 0);
    const outNgn       = rcv.reduce((s, r) => s + (r.amount_ngn || 0), 0);
    const hasCritical  = rcv.some(r => r.priority === 'CRITICAL');

    // Awarded but not yet costed — the records that need attention after a win
    const incomplete = act.filter(g => !g.total_usd && !g.total_ngn);

    const statusChips = arr => {
        const counts = {};
        arr.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
        return Object.entries(counts).map(([st, n]) => {
            const m = STATUS_META[st] || { bg: '#eee', fg: '#333' };
            return `<span class="chip" style="background:${m.bg};color:${m.fg}">${esc(st)}: ${n}</span>`;
        }).join('');
    };

    let html = '';

    if (hasCritical) {
        const crit = rcv.filter(r => r.priority === 'CRITICAL');
        html += `
        <div class="alert-banner critical">
            <span style="font-size:20px">⚠️</span>
            <div>
                <div>CRITICAL: Outstanding Receivables Require Immediate Action</div>
                <div style="font-weight:400;margin-top:2px">${crit.length} critical item${crit.length === 1 ? '' : 's'} · See Receivables tab</div>
            </div>
        </div>`;
    }

    if (incomplete.length) {
        html += `
        <div class="alert-banner" style="background:#FFF3CD;color:#856404;border-left:4px solid #856404">
            <span style="font-size:20px">📝</span>
            <div>
                <div>${incomplete.length} awarded grant${incomplete.length === 1 ? '' : 's'} still without budget figures</div>
                <div style="font-weight:400;margin-top:2px">${incomplete.map(g => esc(g.project)).join(' · ')}</div>
            </div>
        </div>`;
    }

    html += `
        <div class="section-title">${y} Overview</div>
        <div class="metrics-grid">
            <div class="metric-card green"><div class="label">Pipeline Projects</div><div class="value">${pipe.length}</div></div>
            <div class="metric-card mid"><div class="label">Pipeline Value</div><div class="value">${fmtUSD(pipeTotal)}</div></div>
            <div class="metric-card mid"><div class="label">Weighted Value</div><div class="value">${fmtUSD(Math.round(pipeWeighted))}</div></div>
            <div class="metric-card green"><div class="label">Active Grants</div><div class="value">${act.length}</div></div>
            <div class="metric-card green"><div class="label">Active Budget (USD)</div><div class="value">${fmtUSD(actUsd)}</div></div>
            <div class="metric-card green"><div class="label">Active Budget (NGN)</div><div class="value">₦${Math.round(actNgn / 1000000)}M</div></div>
            <div class="metric-card red"><div class="label">⚠ Overdue (USD)</div><div class="value">${fmtUSD(outUsd)}</div></div>
            <div class="metric-card red"><div class="label">⚠ Overdue (NGN)</div><div class="value">${fmtNGN(outNgn)}</div></div>
        </div>

        <div style="margin-bottom:16px">${statusChips(yearGrants())}</div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px">
            <div style="flex:1;min-width:200px;background:#f0faf4;border-radius:8px;padding:12px 16px;font-size:13px">
                <strong style="color:var(--dark)">${y} Weighted Pipeline:</strong> ~${fmtUSD(Math.round(pipeWeighted))}
            </div>
            <div style="flex:1;min-width:200px;background:#fdf2f2;border-radius:8px;padding:12px 16px;font-size:13px">
                <strong style="color:#721C24">${y} Unsuccessful:</strong> ${uns.length} application${uns.length === 1 ? '' : 's'}
            </div>
        </div>

        <div style="padding:20px 24px;background:white;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <div>
                <div style="font-weight:700;font-size:14px;color:var(--dark)">⬇ Export Full Tracker Report</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:2px">Colour-coded Excel workbook — one sheet per year, plus receivables</div>
            </div>
            <button onclick="exportToExcel()" style="background:linear-gradient(135deg,#1E4D2B,#2E7D47);color:white;border:none;border-radius:8px;padding:12px 24px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">
                Download Excel Report
            </button>
        </div>`;

    el.innerHTML = html;
}

function renderAudit(el) {
    const data = STATE.data.audit;

    const describe = a => {
        if (a.action === 'insert') return 'Created “' + esc((a.after_data || {}).project) + '”';
        if (a.action === 'delete') return 'Deleted “' + esc((a.before_data || {}).project) + '”';
        const b = a.before_data || {}, n = a.after_data || {};
        const changed = Object.keys(n).filter(k =>
            !['updated_at','updated_by'].includes(k) && JSON.stringify(b[k]) !== JSON.stringify(n[k]));
        if (!changed.length) return 'Saved “' + esc(n.project) + '” with no changes';
        return 'Updated “' + esc(n.project) + '” — ' + changed.map(k =>
            esc(k) + ': ' + esc(b[k] == null || b[k] === '' ? '(blank)' : b[k]) +
            ' → ' + esc(n[k] == null || n[k] === '' ? '(blank)' : n[k])).join(', ');
    };

    el.innerHTML = `
        <div class="page-header">
            <div><h2>Change Log</h2><p>Last ${data.length} changes to the grants register, newest first</p></div>
        </div>` + (data.length === 0 ? emptyBlock('No changes recorded yet.') : `
        <div class="table-wrap">
            <table>
                <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead>
                <tbody>
                    ${data.map(a => `<tr>
                        <td style="white-space:nowrap">${esc(new Date(a.changed_at).toLocaleString('en-GB'))}</td>
                        <td style="white-space:nowrap">${esc(a.actor || '–')}</td>
                        <td>${badge(a.action === 'insert' ? 'Submitted' : a.action === 'delete' ? 'Not Awarded' : 'Awaiting Outcome')}</td>
                        <td class="td-note">${describe(a)}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>`);
}

function openModal(title, bodyHTML) {
    document.getElementById('modalContainer').innerHTML = `
        <div class="modal-backdrop" onclick="closeModalIfBackdrop(event)">
            <div class="modal">
                <div class="modal-header"><span>${title}</span><button onclick="closeModal()">×</button></div>
                <div class="modal-body">${bodyHTML}</div>

        </div>`;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }
function closeModalIfBackdrop(e) { if (e.target.classList.contains('modal-backdrop')) closeModal(); }

const inp = (name, label, val, type, extra) =>
    '<div class="form-group"><label>' + label + '</label><input name="' + name + '" type="' + (type||'text') + '" value="' + esc(val) + '" ' + (extra||'') + '></div>';
const sel = (name, label, val, opts, extra) =>
    '<div class="form-group"><label>' + label + '</label><select name="' + name + '" ' + (extra||'') + '>' + opts.map(o => '<option value="' + esc(o) + '"' + (String(o)===String(val)?' selected':'') + '>' + esc(o) + '</option>').join('') + '</select></div>';
const ta  = (name, label, val, extra) =>
    '<div class="form-group form-full"><label>' + label + '</label><textarea name="' + name + '" ' + (extra||'') + '>' + esc(val) + '</textarea></div>';
const groupHead = t =>
    '<div class="form-full" style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dark);border-bottom:1px solid var(--border);padding-bottom:5px;margin:6px 0 2px">' + t + '</div>';

// ── Unified grant modal ────────────────────────────────
function openGrantModal(id, presetStatus) {
    const item   = id ? STATE.data.grants.find(x => x.id === id) : null;
    const status = (item && item.status) || presetStatus || 'Not Submitted';

    const body = '<form class="form-grid" onsubmit="saveGrant(event,' + (id || 'null') + ')">'
        + groupHead('Identification')
        + ta('project','Project Title', item && item.project, 'required')
        + inp('funder','Funder', item && item.funder, 'text', 'required')
        + sel('year','Year', (item && item.year) || STATE.year, allYears())
        + sel('status','Status', status, ALL_STATUSES, 'onchange="toggleGrantSections(this.value)"')
        + inp('thematic','Thematic Area', item && item.thematic)
        + inp('geo','Geography', item && item.geo)

        + '<div class="form-full" id="secPipeline"><div class="form-grid" style="padding:0">'
            + groupHead('Application')
            + inp('amount','Requested Amount', item && item.amount, 'number', 'step="any"')
            + sel('currency','Currency', (item && item.currency) || 'USD', ['USD','EUR','NGN','GBP'])
            + inp('prob','Probability (0–1)', item && item.prob, 'number', 'step="0.05" min="0" max="1"')
            + inp('deadline','Deadline / Quarter', item && item.deadline)
        + '</div></div>'

        + '<div class="form-full" id="secAward"><div class="form-grid" style="padding:0">'
            + groupHead('Award Details')
            + inp('period','Grant Period', item && item.period)
            + inp('total_usd','Total Grant (USD)', item && item.total_usd, 'number', 'step="any"')
            + inp('total_ngn','Total Grant (NGN)', item && item.total_ngn, 'number', 'step="any"')
            + inp('received_usd','Amount Received (USD)', item && item.received_usd, 'number', 'step="any"')
            + inp('outstanding_usd','Outstanding (USD)', item && item.outstanding_usd, 'number', 'step="any"')
            + inp('outstanding_ngn','Outstanding (NGN)', item && item.outstanding_ngn, 'number', 'step="any"')
        + '</div></div>'

        + '<div class="form-full" id="secOutcome"><div class="form-grid" style="padding:0">'
            + groupHead('Outcome & Learning')
            + inp('amount_eur','Amount (€/yr)', item && item.amount_eur, 'number', 'step="any"')
            + inp('years','Project Years', item && item.years)
            + ta('lessons','Key Lessons Learned', item && item.lessons)
            + ta('strategy','Re-submission Strategy', item && item.strategy)
        + '</div></div>'

        + ta('note','Notes', item && item.note)
        + '<div class="form-full" style="font-size:11px;color:var(--text-muted);line-height:1.5;background:#f7f9f8;border-radius:6px;padding:9px 11px">'
        + 'Status decides where this record appears. <strong>Awarded</strong> or <strong>Active</strong> moves it to Active Grants; '
        + '<strong>Not Awarded</strong> moves it to Unsuccessful. The record is never copied — it keeps its full history.'
        + '</div>'
        + '<div class="form-actions form-full"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>'
        + '</form>';

    openModal(id ? 'Edit Record' : 'Add Record', body);
    toggleGrantSections(status);
}

function toggleGrantSections(status) {
    const stage = STAGE_OF(status);
    const show = (elId, on) => {
        const node = document.getElementById(elId);
        if (node) node.style.display = on ? '' : 'none';
    };
    show('secPipeline', stage === 'pipeline');
    show('secAward',    stage === 'active' || stage === 'closed');
    show('secOutcome',  stage === 'unsuccessful');
}

async function saveGrant(e, id) {
    e.preventDefault();
    const fd  = new FormData(e.target);
    const num = k => { const v = parseFloat(fd.get(k)); return isNaN(v) ? null : v; };
    const txt = k => { const v = fd.get(k); return v == null || v === '' ? null : v; };

    const row = {
        year:     parseInt(fd.get('year'), 10),
        status:   fd.get('status'),
        project:  fd.get('project'),
        funder:   txt('funder'),
        thematic: txt('thematic'),
        geo:      txt('geo'),
        note:     txt('note'),
        amount:   num('amount'),
        currency: txt('currency') || 'USD',
        prob:     num('prob'),
        deadline: txt('deadline'),
        period:   txt('period'),
        total_usd:       num('total_usd'),
        total_ngn:       num('total_ngn'),
        received_usd:    num('received_usd'),
        outstanding_usd: num('outstanding_usd'),
        outstanding_ngn: num('outstanding_ngn'),
        amount_eur: num('amount_eur'),
        years:      txt('years'),
        lessons:    txt('lessons'),
        strategy:   txt('strategy'),
    };

    const movedTo = STAGE_OF(row.status);
    await upsertRow('grants_register', id, row);
    closeModal();

    // Follow the record to wherever it now lives
    if (Number(row.year) !== Number(STATE.year)) STATE.year = Number(row.year);
    const tabFor = { pipeline: 'pipeline', active: 'active', unsuccessful: 'unsuccessful', closed: 'active' };
    STATE.tab = tabFor[movedTo] || STATE.tab;

    await reload();
}

// ── Receivable modal ───────────────────────────────────
function openReceivableModal(id) {
    const item = id ? STATE.data.receivables.find(x => x.id === id) : null;
    const body = '<form class="form-grid" onsubmit="saveReceivable(event,' + (id || 'null') + ')">'
        + inp('grant_name','Grant Name', item && item.grant_name, 'text', 'required')
        + inp('funder','Funder', item && item.funder)
        + inp('amount_usd','Amount (USD)', item && item.amount_usd, 'number', 'step="any"')
        + inp('amount_ngn','Amount (NGN)', item && item.amount_ngn, 'number', 'step="any"')
        + inp('due','Due Date', item && item.due)
        + sel('status','Status', (item && item.status) || 'Overdue / Pending', RCVBL_STATUSES)
        + sel('priority','Priority', (item && item.priority) || 'HIGH', ['CRITICAL','HIGH','MEDIUM','LOW'])
        + inp('owner','Action Owner', item && item.owner)
        + inp('target','Target Date', item && item.target)
        + ta('action','Required Action', item && item.action)
        + '<div class="form-actions form-full"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>'
        + '</form>';
    openModal(id ? 'Edit Receivable' : 'Add Receivable', body);
}

async function saveReceivable(e, id) {
    e.preventDefault();
    const fd  = new FormData(e.target);
    const num = k => { const v = parseFloat(fd.get(k)); return isNaN(v) ? null : v; };
    await upsertRow('receivables', id, {
        grant_name: fd.get('grant_name'), funder: fd.get('funder'),
        amount_usd: num('amount_usd'), amount_ngn: num('amount_ngn'),
        due: fd.get('due'), status: fd.get('status'), priority: fd.get('priority'),
        owner: fd.get('owner'), target: fd.get('target'), action: fd.get('action'),
    });
    closeModal();
    await reload();
}

// ═══════════════════════════════════════════════════════
// EXCEL EXPORT — one section per year, automatically
// ═══════════════════════════════════════════════════════
const C = {
    green: '1E4D2B', greenLight: 'D4EDDA', gold: '856404', goldLight: 'FFF3CD',
    red: '8B1A1A', redLight: 'F8D7DA', redDark: '721C24', dark: '1E4D2B'
};

function makeWS(title, headers, rows, widths, rowStyles) {
    const aoa = [[title], [], headers, ...rows];
    const ws  = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = (widths || headers.map(() => 18)).map(w => ({ wch: w }));

    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let R = range.s.r; R <= range.e.r; R++) {
        for (let Ci = range.s.c; Ci <= range.e.c; Ci++) {
            const addr = XLSX.utils.encode_cell({ r: R, c: Ci });
            if (!ws[addr]) continue;
            if (R === 0) {
                ws[addr].s = { font: { bold: true, sz: 14, color: { rgb: 'FFFFFF' } },
                               fill: { fgColor: { rgb: C.dark } } };
            } else if (R === 2) {
                ws[addr].s = { font: { bold: true, sz: 10, color: { rgb: 'FFFFFF' } },
                               fill: { fgColor: { rgb: C.green } },
                               alignment: { wrapText: true, vertical: 'center' } };
            } else if (R > 2 && rowStyles && rowStyles[R - 3]) {
                const st = rowStyles[R - 3];
                ws[addr].s = {
                    font: { sz: 10, bold: !!st.bold, color: { rgb: st.color || '000000' } },
                    fill: st.bg ? { fgColor: { rgb: st.bg } } : undefined,
                    alignment: { wrapText: true, vertical: 'top' }
                };
            } else {
                ws[addr].s = { font: { sz: 10 }, alignment: { wrapText: true, vertical: 'top' } };
            }
        }
    }
    return ws;
}

function exportToExcel() {
    const wb = XLSX.utils.book_new();

    allYears().slice().reverse().forEach(y => {
        const rows = STATE.data.grants.filter(g => Number(g.year) === y);
        if (!rows.length) return;

        const pipe = rows.filter(g => g.stage === 'pipeline');
        const act  = rows.filter(g => g.stage === 'active' || g.stage === 'closed');
        const uns  = rows.filter(g => g.stage === 'unsuccessful');

        if (pipe.length) {
            const h = ['#','Project','Funder','Thematic','Geography','Amount','Currency','Prob','Weighted','Deadline','Status','Notes'];
            const r = pipe.map((p, i) => [i + 1, p.project, p.funder, p.thematic, p.geo,
                        p.amount || 0, p.currency, ((p.prob || 0) * 100).toFixed(0) + '%',
                        Math.round((p.amount || 0) * (p.prob || 0)), p.deadline, p.status, p.note]);
            const s = pipe.map(p => p.status === 'Awaiting Outcome' ? { bg: C.goldLight } : {});
            XLSX.utils.book_append_sheet(wb, makeWS(y + ' Pipeline', h, r, [4,44,28,22,18,12,10,8,14,14,18,34], s), y + ' Pipeline');
        }

        if (act.length) {
            const h = ['Grant','Funder','Thematic','Geography','Period','Total USD','Total NGN','Received USD','Outstanding USD','Outstanding NGN','Status','Notes'];
            const r = act.map(g => [g.project, g.funder, g.thematic, g.geo, g.period,
                        g.total_usd || '', g.total_ngn || '', g.received_usd || '',
                        g.outstanding_usd || '', g.outstanding_ngn || '', g.status, g.note]);
            const s = act.map(g => (g.outstanding_usd || g.outstanding_ngn)
                        ? { bg: C.redLight, bold: true, color: C.redDark } : { bg: C.greenLight });
            XLSX.utils.book_append_sheet(wb, makeWS(y + ' Active Grants', h, r, [36,30,24,20,16,14,16,14,16,16,14,38], s), y + ' Active Grants');
        }

        if (uns.length) {
            const h = ['Project','Funder','Thematic','Geography','Amount','Project Years','Lessons Learned','Re-submission Strategy'];
            const r = uns.map(a => [a.project, a.funder, a.thematic, a.geo,
                        a.amount_eur || a.amount || '', a.years, a.lessons, a.strategy]);
            const s = uns.map(() => ({ bg: C.redLight, color: C.redDark }));
            XLSX.utils.book_append_sheet(wb, makeWS(y + ' Unsuccessful', h, r, [44,28,22,18,14,16,44,44], s), y + ' Unsuccessful');
        }
    });

    const rcv = STATE.data.receivables;
    if (rcv.length) {
        const h = ['Grant','Funder','USD','NGN','Due','Status','Priority','Action Required','Owner','Target'];
        const r = rcv.map(x => [x.grant_name, x.funder, x.amount_usd || '', x.amount_ngn || '',
                    x.due, x.status, x.priority, x.action, x.owner, x.target]);
        const s = rcv.map(x => x.priority === 'CRITICAL'
                    ? { bg: C.redLight, bold: true, color: C.redDark } : { bg: C.goldLight, color: C.gold });
        XLSX.utils.book_append_sheet(wb, makeWS('Outstanding Receivables', h, r, [34,26,16,18,16,20,12,44,20,16], s), 'Receivables');
    }

    if (!wb.SheetNames.length) { alert('Nothing to export yet.'); return; }

    XLSX.writeFile(wb, 'RAHAMA_Grants_Tracker_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}
