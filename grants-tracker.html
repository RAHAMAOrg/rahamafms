<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHAMA Project Tracker</title>
<link rel="icon" type="image/png" href="RAHAMA Empowerment Logo Design (3).png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Same look as the FMS: dark-green sidebar, Plus Jakarta Sans, RAHAMA greens */
:root{
  --primary:#2d7a52;--primary-dark:#1a4d32;--accent:#40C078;--side:#14432B;--side2:#1a4d32;
  --bg:#F4F7F5;--surface:#FFFFFF;--text:#14201A;--muted:#5C6B62;--border:#E2E9E4;--soft:#EAF3EE;
  --danger:#C4432A;--warn:#B7791F;--info:#3F7CAC;--violet:#8E6BB5;
  --shadow:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* sidebar */
aside{background:linear-gradient(180deg,var(--side) 0%,var(--side2) 100%);color:#DCEBE2;padding:22px 0 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{text-align:center;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:12px}
.brand img{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 12px;filter:brightness(0) invert(1)}
.brand b{display:block;font-size:18px;font-weight:800;color:#fff;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:rgba(255,255,255,.75);margin-top:4px}
.who{margin:0 16px 14px;padding:16px 24px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:#fff}
.who small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:6px}
.who b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.role{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.15)}
.years{padding:0 16px 12px}
.years label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:0 0 7px 4px}
.years div{display:flex;gap:6px;flex-wrap:wrap}
.yr{cursor:pointer;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:700;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.yr.on{background:#fff;color:var(--side);border-color:#fff}
.yr.add{border-style:dashed;background:transparent}
.navg{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:14px 30px 6px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;width:calc(100% - 20px);margin:1px 10px;padding:9px 20px;border-radius:8px;font-size:13.5px;font-weight:500;color:#DCEBE2}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#fff;color:var(--side);font-weight:700}
.nav .cnt{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.14)}
.nav button.on .cnt{background:var(--soft);color:var(--side)}
.nav .cnt.red{background:var(--danger);color:#fff}
.back{margin:14px 16px 0;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:600;font-size:13px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:block}
.back:hover{background:rgba(255,255,255,.2)}
/* main */
main{padding:28px 32px 48px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{cursor:pointer;border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-dark)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:12px}
.link{all:unset;cursor:pointer;color:var(--primary);font-weight:600}
.link:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);min-width:0}
.kpi small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:11.5px;color:var(--muted)}
.kpi.win{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border:0}
.kpi.win small,.kpi.win i{color:rgba(255,255,255,.8)}
.cv{position:relative;height:260px}.cv.sm{height:220px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;margin-bottom:10px;font-size:13px;border:1px solid}
.alert.red{background:#FBEDEA;border-color:#F2C9C0;color:#8E2C1A}
.alert.amber{background:#FFF6E3;border-color:#F3DDA8;color:#7A5410}
.alert b{display:block}
/* tables */
.tw{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th{background:var(--primary);color:#fff;text-align:left;padding:9px 11px;font-weight:700;font-size:12px;white-space:nowrap;position:sticky;top:0}
td{padding:9px 11px;border-top:1px solid var(--border);vertical-align:top}
tbody tr:hover td{background:#F6FAF7}
tr.click{cursor:pointer}
tfoot td{background:var(--primary-dark);color:#fff;font-weight:700;border:0}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.sub{font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;margin:2px 4px 2px 0;background:var(--soft)}
.chip.red{background:#FBEDEA;color:var(--danger)}.chip.amber{background:#FFF6E3;color:var(--warn)}.chip.green{background:#E3F2E9;color:var(--primary-dark)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters button{cursor:pointer;border:1px solid var(--border);background:var(--soft);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.filters button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.filters input,.filters select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:#fff}
/* grant record */
.rec-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.rec-head h1{margin:2px 0 4px;font-size:22px;font-weight:800}
.dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere}
.secn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:800;margin-right:8px}
.bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--accent)}
/* gantt */
.gantt{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
.g-row{display:grid;grid-template-columns:260px 1fr;border-top:1px solid var(--border);min-height:52px}
.g-row:first-child{border-top:0}
.g-lab{padding:8px 12px;font-size:12.5px;border-right:1px solid var(--border);background:#fff;position:sticky;left:0;z-index:2}
.g-lab b{display:block;font-weight:700;line-height:1.3}
.g-track{position:relative}
.g-head{background:var(--soft);font-size:11px;font-weight:700;color:var(--muted)}
.g-m{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);padding:10px 0 0 4px;white-space:nowrap}
.g-bar{position:absolute;top:10px;height:20px;border-radius:6px;font-size:11px;color:#fff;padding:2px 8px;white-space:nowrap;overflow:hidden;cursor:pointer}
.g-mk{position:absolute;top:33px;width:12px;height:12px;transform:translateX(-6px);cursor:default;font-size:11px;line-height:12px;text-align:center}
.g-today{position:absolute;top:0;bottom:0;border-left:2px dashed var(--danger);z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,30,20,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal>div{background:#fff;border-radius:14px;width:min(820px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--primary-dark);color:#fff;border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
.mh b{font-size:15px}.mh button{all:unset;cursor:pointer;font-size:22px;line-height:1}
.mb{padding:18px 20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .w{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.form input,.form select,.form textarea{border:1px solid #CBD6CF;border-radius:8px;padding:8px 10px;background:#fff;font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text);width:100%}
.form textarea{min-height:64px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.fh{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-dark);border-bottom:1px solid var(--border);padding-bottom:5px;margin-top:6px}
.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:999px;font-weight:600;z-index:80}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;color:var(--muted)}
.center h2{color:var(--text);margin:10px 0 6px}
@media (max-width:1100px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:18px 16px 40px}.form{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.g-row{grid-template-columns:160px 1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><img src="RAHAMA Empowerment Logo Design (3).png" alt="RAHAMA" onerror="this.style.display='none'"><b>RAHAMA FMS</b><small>Project Tracker · Grants</small></div>
  <div class="who"><small>Signed in as</small><b id="userName">Loading…</b><div><span class="role" id="userRole">–</span></div></div>
  <div class="years"><label>Year</label><div id="yearBox"></div></div>
  <nav class="nav" id="nav"></nav>
  <a href="index.html" class="back">← Back to FMS</a>
</aside>
<main id="main"><div class="center"><p>Loading tracker…</p></div></main>
</div>
<div id="modalHost"></div>

<script>
// ═════════ CONFIG ═════════
const SUPABASE_URL = 'https://sqygmoxpegbfxddglhbx.supabase.co';
const SUPABASE_KEY = 'sb_publishable__nPBgo9IeeU4Mrk_ggEeTg_YEkWrB24';
// Used only if the database access list has not been set up yet (before the upgrade SQL is run).
const FALLBACK_EMAILS = ['salahuddeen.sambo@rgcweinigeria.org','sani.hamisu@rgcweinigeria.org','aisha.abdulrahman@rgcweinigeria.org','maryam.tijjani@rgcweinigeria.org','amina.yusuf@rgcweinigeria.org'];
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ═════════ STATE ═════════
const S = { user:null, canEdit:false, tab:'dashboard', year:'all', grantId:null, upgraded:true,
  data:{ grants:[], receivables:[], audit:[], tranches:[], reports:[], milestones:[], finProjects:[] },
  f:{ dl:'upcoming', dlKind:'', q:'', gantt:'awarded' } };
let CH = {};

// ═════════ STATUS & STAGES ═════════
// Stored values stay as they are; two are shown with clearer names.
const LABEL = { 'Not Submitted':'Drafting', 'Awaiting Outcome':'Under Review' };
const lab = s => LABEL[s] || s || '–';
const STATUS_OPTS = [['Prospect / Research','Prospect / Research'],['Letter of Intent','Letter of Intent (LOI)'],['Not Submitted','Drafting'],['Submitted','Submitted'],
  ['Awaiting Outcome','Under Review'],['On Hold','On Hold'],['Awarded','Awarded'],['Active','Active'],['Not Awarded','Not Awarded'],['Closed','Closed']];
const PIPE_ORDER = ['Prospect / Research','Letter of Intent','Not Submitted','Submitted','Awaiting Outcome','On Hold'];
const STAGE_OF = s => s==='Awarded'||s==='Active' ? 'active' : s==='Not Awarded' ? 'unsuccessful' : s==='Closed' ? 'closed' : 'pipeline';
const STATUS_COL = { 'Prospect / Research':['#EEF2F7','#3B4A5C'],'Letter of Intent':['#EDE7F6','#5B3C8C'],'Not Submitted':['#E8F4F8','#0C5460'],'Submitted':['#E8F0FE','#1a3c8f'],
  'Awaiting Outcome':['#FFF3CD','#856404'],'On Hold':['#E2E3E5','#555'],'Awarded':['#D4EDDA','#155724'],'Active':['#D4EDDA','#1E4D2B'],'Not Awarded':['#F8D7DA','#721C24'],'Closed':['#E2E3E5','#383D41'],
  'Overdue / Pending':['#FFF3CD','#856404'],'Overdue / CRITICAL':['#F8D7DA','#8B1A1A'],'Paid':['#D4EDDA','#155724'],'Partially Paid':['#FFF3CD','#856404'] };
const badge = s => { const c = STATUS_COL[s] || ['#eee','#333']; return `<span class="badge" style="background:${c[0]};color:${c[1]}">${esc(lab(s))}</span>`; };
const FUNDER_TYPES = ['Private foundation','Corporate','Government / bilateral','Multilateral / UN','Trust','INGO / pass-through','Individual / other'];
const REPORT_KINDS = ['Interim narrative','Interim financial','Final narrative','Final financial','Audit','Other'];
const RCV_STATUSES = ['Overdue / Pending','Overdue / CRITICAL','Paid','Partially Paid'];

// ═════════ HELPERS ═════════
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sym = c => c==='EUR'?'€':c==='NGN'?'₦':c==='GBP'?'£':'$';
const money = (n,c) => n==null||n==='' ? '–' : sym(c||'USD') + Number(n).toLocaleString('en-NG',{maximumFractionDigits:0});
const short = (n,c) => { if(n==null) return '–'; const a=Math.abs(n), s=sym(c||'USD'); return s+(a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(0)+'k':Math.round(n)); };
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const toD = s => { if(!s) return null; const d = new Date(String(s).slice(0,10)+'T00:00:00'); return isNaN(d) ? null : d; };
const fmtD = s => { const d = s instanceof Date ? s : toD(s); return d ? d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear() : '–'; };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const days = s => { const d=toD(s); return d ? Math.round((d - today())/864e5) : null; };
const when = s => { const n = days(s); if(n==null) return ''; return n<0 ? `<span class="chip red">${-n} day${n===-1?'':'s'} overdue</span>` : n===0 ? '<span class="chip amber">today</span>' : n<=14 ? `<span class="chip amber">in ${n} day${n===1?'':'s'}</span>` : `<span class="sub">in ${n} days</span>`; };
function toast(t){ const e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2600); }
// Reads "Jan 2026 – Dec 2027", "March 2025 - Feb 2026", "2025-2027", "01/2025 - 12/2026" from the old free-text period
function parsePeriod(p){
  if(!p) return [null,null];
  const t = String(p).replace(/[–—]/g,'-');
  const mon = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?\\s*(\\d{4})';
  let m = t.match(new RegExp(mon+'\\s*(?:-|to)\\s*'+mon,'i'));
  if(m){ const a=MN.findIndex(x=>x.toLowerCase()===m[1].slice(0,3).toLowerCase()), b=MN.findIndex(x=>x.toLowerCase()===m[3].slice(0,3).toLowerCase());
    return [new Date(+m[2],a,1), new Date(+m[4],b+1,0)]; }
  m = t.match(/(\d{1,2})\/(\d{4})\s*(?:-|to)\s*(\d{1,2})\/(\d{4})/); if(m) return [new Date(+m[2],+m[1]-1,1), new Date(+m[4],+m[3],0)];
  m = t.match(/(\d{4})\s*(?:-|to)\s*(\d{4})/); if(m) return [new Date(+m[1],0,1), new Date(+m[2],11,31)];
  return [null,null];
}
function span(g){ const a=toD(g.start_date), b=toD(g.end_date); if(a&&b) return [a,b,false]; const [pa,pb]=parsePeriod(g.period); return [a||pa, b||pb, !(a&&b)&&!!(pa||pb)]; }
const yearsAll = () => { const s=new Set(S.data.grants.map(g=>+g.year).filter(Boolean)); try{(JSON.parse(localStorage.getItem('tracker_extra_years'))||[]).forEach(y=>s.add(+y))}catch(e){} if(!s.size) s.add(new Date().getFullYear()); return [...s].sort((a,b)=>b-a); };
const inYear = g => S.year==='all' || +g.year === +S.year;
const G = () => S.data.grants.filter(inYear);
const stage = st => G().filter(g => g.stage === st);
const won = g => g.stage==='active' || g.stage==='closed';
const awardOf = g => g.awarded_amount!=null ? [g.awarded_amount, g.award_currency||g.currency||'USD'] : g.total_usd ? [g.total_usd,'USD'] : g.total_ngn ? [g.total_ngn,'NGN'] : [null,null];
const usdOf = g => g.awarded_amount!=null && (g.award_currency||'USD')==='USD' ? +g.awarded_amount : g.total_usd ? +g.total_usd : 0;
const byGrant = (list,id) => list.filter(x => x.grant_id === id);

// ═════════ INIT ═════════
async function init(){
  let session=null; try{ session = JSON.parse(localStorage.getItem('pms_user')||'null'); }catch(e){}
  if(!session) return denied('Please sign in first','Open the tracker from the FMS menu after signing in.');
  S.user = session;
  const email = (session.email||'').toLowerCase().trim();
  document.getElementById('userName').textContent = session.name || email || 'User';
  // The database decides who can view and edit. Before the upgrade SQL is run, fall back to the old list.
  const r = await db.rpc('grants_role');
  let role = null;
  if(r.error){ S.upgraded=false; role = ((session.role||'').toLowerCase()==='supervisor' || FALLBACK_EMAILS.includes(email)) ? 'editor' : null; }
  else role = r.data;
  if(!role) return denied('Access restricted','The Project Tracker is only open to staff on its access list. Ask the Programme Manager if you need access.');
  S.canEdit = role === 'editor';
  document.getElementById('userRole').textContent = S.canEdit ? 'Editor' : 'Viewer';
  try { await load(); } catch(e){ document.getElementById('main').innerHTML = `<div class="center"><h2>Could not load the tracker</h2><p>${esc(e.message)}</p><button class="btn pri" onclick="init()">Try again</button></div>`; return; }
  const ys = yearsAll(); S.year = ys.includes(new Date().getFullYear()) ? new Date().getFullYear() : 'all';
  render();
}

async function load(){
  const opt = q => q.then(r => r, () => ({ data:[], error:{message:'unavailable'} }));
  const [g,r,a,t,rp,m,fp] = await Promise.all([
    db.from('grants_register').select('*').order('id'),
    opt(db.from('receivables').select('*').order('id')),
    opt(db.from('grants_audit').select('*').order('changed_at',{ascending:false}).limit(300)),
    opt(db.from('grant_tranches').select('*').order('due_date')),
    opt(db.from('grant_reports').select('*').order('due_date')),
    opt(db.from('grant_milestones').select('*').order('due_date')),
    opt(db.from('fin_projects').select('project_name,direct_budget,cash_received'))]);
  if(g.error) throw new Error('grants_register: '+g.error.message);
  Object.assign(S.data, { grants:g.data||[], receivables:r.data||[], audit:a.data||[], tranches:(t.error?[]:t.data)||[], reports:(rp.error?[]:rp.data)||[],
    milestones:(m.error?[]:m.data)||[], finProjects:(fp.error?[]:fp.data)||[] });
  if(t.error) S.upgraded = false;
}
async function reload(){ await load(); render(); }

// ═════════ DEADLINES (one list for everything with a date) ═════════
function allDeadlines(){
  const out=[], gp=id=>S.data.grants.find(x=>x.id===id)||{};
  S.data.grants.forEach(g=>{
    if(g.stage==='pipeline'){
      if(g.loi_due) out.push({date:g.loi_due,kind:'LOI due',g,text:'Letter of intent'});
      if(g.submission_date) out.push({date:g.submission_date,kind:'Submission',g,text:'Full application'+(g.submission_time?' by '+g.submission_time+(g.submission_tz?' '+g.submission_tz:''):'')});
      if(g.decision_expected) out.push({date:g.decision_expected,kind:'Decision expected',g,text:'Funder decision'});
    }
    if(won(g) && g.end_date) out.push({date:g.end_date,kind:'Grant ends',g,text:'End of grant period',done:g.stage==='closed'});
  });
  S.data.reports.forEach(r=>out.push({date:r.due_date,kind:'Report',g:gp(r.grant_id),text:r.kind+(r.title?': '+r.title:''),done:!!r.submitted_date}));
  S.data.tranches.forEach(t=>out.push({date:t.due_date,kind:'Tranche',g:gp(t.grant_id),text:money(t.amount,t.currency)+' expected',done:!!t.received_date}));
  S.data.milestones.forEach(m=>out.push({date:m.due_date,kind:'Milestone',g:gp(m.grant_id),text:m.title,done:!!m.done_date}));
  return out.filter(x=>x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}

function deadlineTable(list, compact){

// ═════════ GANTT ═════════
function renderGantt(el){
  const mode = S.f.gantt;
  let rows = S.data.grants.filter(g => mode==='all' ? true : mode==='awarded' ? won(g) : g.stage==='active');
  rows = rows.map(g=>({g,sp:span(g)})).filter(r=>r.sp[0]&&r.sp[1]).sort((a,b)=>a.sp[0]-b.sp[0]);
  const missing = S.data.grants.filter(g => (mode==='all'||won(g)) && !(span(g)[0]&&span(g)[1]));
  let h = head('Gantt chart','Grant periods with reports, tranches and milestones') + upgradeNote() +
    `<div class="filters">${[['active','Active only'],['awarded','Active and closed'],['all','Everything with dates']].map(([k,l])=>`<button class="${mode===k?'on':''}" onclick="S.f.gantt='${k}';render()">${l}</button>`).join('')}</div>`;
  if(!rows.length){ el.innerHTML = h + '<div class="card"><div class="empty">No grant has a start and end date yet. Open a grant and add its start and end dates.</div></div>'; return; }
  let lo = new Date(Math.min(...rows.map(r=>r.sp[0]))), hi = new Date(Math.max(...rows.map(r=>r.sp[1]), today()));
  lo = new Date(lo.getFullYear(), lo.getMonth(), 1); hi = new Date(hi.getFullYear(), hi.getMonth()+1, 0);
  const months = []; for(let d=new Date(lo); d<=hi; d=new Date(d.getFullYear(), d.getMonth()+1, 1)) months.push(new Date(d));
  const W = Math.max(900, months.length*46), tot = hi - lo, x = d => ((d - lo)/tot*W);
  const tx = x(today());
  const hdr = `<div class="g-row g-head"><div class="g-lab">Grant</div><div class="g-track" style="width:${W}px;height:34px">${months.map(m=>`<div class="g-m" style="left:${x(m)}px">${m.getMonth()===0||m===months[0]?MN[m.getMonth()]+' '+String(m.getFullYear()).slice(2):MN[m.getMonth()]}</div>`).join('')}</div></div>`;
  const body = rows.map(({g,sp})=>{
    const c = g.stage==='closed' ? '#8A9890' : g.stage==='active' ? 'var(--primary)' : g.stage==='unsuccessful' ? 'var(--danger)' : '#D9A21B';
    const mk = (d,ch,colr,tip) => { const dd=toD(d); if(!dd||dd<lo||dd>hi) return ''; return `<span class="g-mk" style="left:${x(dd)}px;color:${colr}" title="${esc(tip)}">${ch}</span>`; };
    const marks = byGrant(S.data.reports,g.id).map(r=>mk(r.due_date,'▲',r.submitted_date?'#2d7a52':days(r.due_date)<0?'#C4432A':'#14201A',r.kind+' report · '+fmtD(r.due_date)+(r.submitted_date?' · submitted':''))).join('')
      + byGrant(S.data.tranches,g.id).map(t=>mk(t.due_date,'●',t.received_date?'#2d7a52':'#3F7CAC','Tranche '+money(t.amount,t.currency)+' · '+fmtD(t.due_date)+(t.received_date?' · received':''))).join('')
      + byGrant(S.data.milestones,g.id).map(m=>mk(m.due_date,'◆',m.done_date?'#2d7a52':'#8E6BB5','Milestone: '+m.title+' · '+fmtD(m.due_date))).join('');
    return `<div class="g-row"><div class="g-lab"><b><button class="link" onclick="openGrant(${g.id})">${esc(g.project)}</button></b><span class="sub">${esc(g.funder||'')}${sp[2]?' · dates read from period':''}</span></div>
      <div class="g-track" style="width:${W}px"><div class="g-bar" style="left:${x(sp[0])}px;width:${Math.max(6,x(sp[1])-x(sp[0]))}px;background:${c};opacity:.9" onclick="openGrant(${g.id})" title="${esc(fmtD(sp[0])+' – '+fmtD(sp[1]))}">${MN[sp[0].getMonth()]} ${String(sp[0].getFullYear()).slice(2)} – ${MN[sp[1].getMonth()]} ${String(sp[1].getFullYear()).slice(2)}</div>${marks}</div></div>`;
  }).join('');
  h += `<div class="legend"><span><i class="sw" style="background:var(--primary)"></i>Active</span><span><i class="sw" style="background:#8A9890"></i>Closed</span><span><i class="sw" style="background:#D9A21B"></i>Pipeline</span>
    <span>▲ Report</span><span style="color:#3F7CAC">● Tranche</span><span style="color:#8E6BB5">◆ Milestone</span><span style="color:var(--danger)">┆ Today</span><span>Green marker = done</span></div>
    <div class="gantt"><div style="position:relative;min-width:${W+260}px">${hdr}${body}<div class="g-today" style="left:${260+tx}px" title="Today"></div></div></div>`;
  if(missing.length) h += `<div class="alert amber" style="margin-top:12px"><span>📅</span><div><b>${missing.length} grant${missing.length===1?'':'s'} not on the chart (no start and end date)</b>${missing.map(g=>`<button class="link" onclick="openGrant(${g.id})">${esc(g.project)}</button>`).join(' · ')}</div></div>`;
  el.innerHTML = h;
  const gc = el.querySelector('.gantt'); if(gc) gc.scrollLeft = Math.max(0, tx - (gc.clientWidth - 260) * 0.6);
}

async function loadBudget(g){
  const box = document.getElementById('budgetBox'); if(!box) return;
  if(!g.tracker_project){ box.innerHTML = `<b style="font-size:13px">Budget against spending</b><div class="sub" style="margin-top:6px">${S.canEdit?'Link this grant to its Expense Tracker project (Edit record → Award and finance) to see budget and spending here.':'Not linked to an Expense Tracker project.'}</div>`; return; }
  try{
    let rows=[], from=0; for(;;){ const {data,error} = await db.from('fin_expenses').select('amount,expense_type,category').eq('project_name',g.tracker_project).range(from,from+999); if(error) throw error; rows=rows.concat(data||[]); if(!data||data.length<1000) break; from+=1000; }
    const [{data:p},{data:bl}] = await Promise.all([db.from('fin_projects').select('*').eq('project_name',g.tracker_project), db.from('fin_budget_lines').select('*').eq('project_name',g.tracker_project).order('category_key')]);
    const pr = (p||[])[0];
    if(!pr && !rows.length){ box.innerHTML = `<b style="font-size:13px">Budget against spending · ${esc(g.tracker_project)}</b><div class="sub" style="margin-top:6px">No figures visible. Spending is shown to people with Expense Tracker access.</div>`; return; }
    const dir = rows.filter(r=>r.expense_type==='Direct').reduce((s,r)=>s+(+r.amount||0),0)+(+(pr&&pr.opening_spend)||0);
    const idc = rows.filter(r=>r.expense_type==='IDC').reduce((s,r)=>s+(+r.amount||0),0), bud = +(pr&&pr.direct_budget)||0;
    const byCat = {}; rows.filter(r=>r.expense_type==='Direct').forEach(r=>{const k=r.category||'None'; byCat[k]=(byCat[k]||0)+(+r.amount||0);});
    box.innerHTML = `<b style="font-size:13px">Budget against spending · ${esc(g.tracker_project)}</b><span class="sub"> (from the Expense Tracker)</span>
      <dl class="dl" style="margin-top:8px">${dlRow('Direct budget',bud?money(bud,'NGN'):'')}${dlRow('Direct spent',money(dir,'NGN')+(bud?` · ${Math.round(dir/bud*100)}%`:''))}${dlRow('IDC booked',money(idc,'NGN'))}${dlRow('Cash received',pr&&pr.cash_received?money(pr.cash_received,'NGN'):'')}</dl>
      ${bud?`<div class="bar"><span style="width:${Math.min(100,dir/bud*100)}%;background:${dir>bud?'var(--danger)':'var(--accent)'}"></span></div>`:''}
      ${(bl||[]).length?`<div class="tw" style="margin-top:10px;max-height:220px"><table><thead><tr><th>Line</th><th class="n">Budget</th><th class="n">Spent</th><th class="n">Used</th></tr></thead><tbody>${bl.map(b=>{const s=byCat[b.category_key]||0,u=b.budget?s/b.budget:0;
        return `<tr><td>${esc(b.category_key)} <span class="sub">${esc((b.category_name||'').split(/[:(]/)[0])}</span></td><td class="n">${money(b.budget,'NGN')}</td><td class="n">${money(s,'NGN')}</td><td class="n"><span class="chip ${u>1?'red':u>.9?'amber':'green'}">${Math.round(u*100)}%</span></td></tr>`}).join('')}</tbody></table></div>`:''}`;
  }catch(e){ box.innerHTML = `<b style="font-size:13px">Budget against spending</b><div class="sub" style="margin-top:6px">Could not read the Expense Tracker: ${esc(e.message)}</div>`; }
}

  el.innerHTML = head('Change log','Last '+S.data.audit.length+' changes to the grants register, newest first') +
    (S.data.audit.length ? `<div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>${S.data.audit.map(a=>`<tr><td class="nw">${esc(new Date(a.changed_at).toLocaleString('en-GB'))}</td><td class="nw">${esc(a.actor||'–')}</td>
      <td><span class="chip ${a.action==='delete'?'red':a.action==='insert'?'green':''}">${esc(a.action)}</span></td><td>${describe(a)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card"><div class="empty">No changes recorded yet.</div></div>');
}

// ═════════ FORMS ═════════
function modal(title, body){ document.getElementById('modalHost').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div><div class="mh"><b>${title}</b><button onclick="closeModal()" aria-label="Close">×</button></div><div class="mb">${body}</div></div></div>`; }
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
const F = {
  i:(n,l,v,t,x,w)=>`<label class="${w?'w':''}">${l}<input name="${n}" type="${t||'text'}" value="${esc(v)}" ${x||''}></label>`,
  s:(n,l,v,opts,x,w)=>`<label class="${w?'w':''}">${l}<select name="${n}" ${x||''}>${opts.map(o=>{const [val,txt]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v??'')?'selected':''}>${esc(txt)}</option>`}).join('')}</select></label>`,
  t:(n,l,v,x)=>`<label class="w">${l}<textarea name="${n}" ${x||''}>${esc(v)}</textarea></label>`,
  h:t=>`<div class="fh">${t}</div>` };
function editGrant(id, preset){
  const g = id ? S.data.grants.find(x=>x.id===id) : { status:preset||'Prospect / Research', year: S.year==='all'?new Date().getFullYear():S.year, currency:'USD' };
  const up = S.upgraded, st = g.status || 'Not Submitted';
  const statusOpts = STATUS_OPTS.slice(); if(!statusOpts.some(o=>o[0]===st)) statusOpts.unshift([st,st]);
  const fin = [['','Not linked']].concat(S.data.finProjects.map(p=>[p.project_name,p.project_name])); if(g.tracker_project && !fin.some(o=>o[0]===g.tracker_project)) fin.push([g.tracker_project,g.tracker_project]);
  modal(id?'Edit record':'Add record', `<form class="form" id="gForm">
    ${F.h('Identification')}${F.t('project','Project title',g.project,'required')}${F.i('funder','Funder',g.funder,'text','required')}
    ${F.s('year','Year',g.year,yearsAll().concat(yearsAll().includes(+g.year)?[]:[+g.year]).filter(Boolean))}${F.s('status','Stage / status',st,statusOpts,'onchange="secs(this.value)"')}
    ${up?F.i('grant_code','Grant code (unique)',g.grant_code,'text','placeholder="e.g. RAH-2026-GEPP"'):''}${F.i('thematic','Theme',g.thematic)}${F.i('geo','Geography',g.geo)}
    ${up?F.h('1 · Funder and prospect')+F.s('funder_type','Funder type',g.funder_type,[['','–']].concat(FUNDER_TYPES))+F.i('funder_website','Website / guidelines link',g.funder_website,'url','placeholder="https://"')
      +F.i('contact_name','Programme officer',g.contact_name)+F.i('contact_email','Officer email',g.contact_email,'email')+F.i('contact_phone','Officer phone',g.contact_phone,'tel')
      +F.t('focus_areas','Focus areas',g.focus_areas)+F.t('eligibility','Eligibility (do we match?)',g.eligibility):''}
    ${F.h('2 · Application')}${F.i('amount','Requested amount',g.amount,'number','step="any"')}${F.s('currency','Currency',g.currency||'USD',['USD','EUR','GBP','NGN'])}
    ${F.i('prob','Probability (0–1)',g.prob,'number','step="0.05" min="0" max="1"')}${up?F.i('loi_due','LOI due',g.loi_due,'date'):F.i('deadline','Deadline',g.deadline)}
    ${up?F.i('submission_date','Submission deadline (date)',g.submission_date,'date')+F.i('submission_time','Time',g.submission_time,'time')
      +F.s('submission_tz','Time zone',g.submission_tz||'WAT (UTC+1)',['WAT (UTC+1)','GMT / UTC','CET / CEST (Europe)','EST / EDT (US East)','PST / PDT (US West)','EAT (UTC+3)','SAST (UTC+2)','Other (see notes)'])
      +F.i('decision_expected','Decision expected',g.decision_expected,'date')+F.i('deadline','Deadline / quarter (old free text)',g.deadline):''}
    <div class="w" id="secAward" style="display:contents">${F.h('3 · Award and finance')}
      ${up?F.i('awarded_amount','Awarded amount',g.awarded_amount,'number','step="any"')+F.s('award_currency','Award currency',g.award_currency||g.currency||'USD',['USD','EUR','GBP','NGN'])
        +F.i('start_date','Grant start',g.start_date,'date')+F.i('end_date','Grant end',g.end_date,'date'):''}
      ${F.i('period','Grant period (text)',g.period)}${F.i('total_usd','Total grant (USD)',g.total_usd,'number','step="any"')}${F.i('total_ngn','Total grant (NGN)',g.total_ngn,'number','step="any"')}
      ${F.i('received_usd','Received (USD)',g.received_usd,'number','step="any"')}${F.i('outstanding_usd','Outstanding (USD)',g.outstanding_usd,'number','step="any"')}${F.i('outstanding_ngn','Outstanding (NGN)',g.outstanding_ngn,'number','step="any"')}
      ${up?F.s('tracker_project','Expense Tracker project',g.tracker_project||'',fin)+F.t('restrictions','Restrictions and compliance (e.g. indirect cost cap, equipment ban)',g.restrictions):''}</div>
    ${F.h('4 · Reporting, outcome and documents')}${up?F.i('doc_link','Document folder link',g.doc_link,'url','placeholder="https:// (proposal, contract, award letter)"',1):''}
    ${F.i('amount_eur','Amount (€/yr, old field)',g.amount_eur,'number','step="any"')}${F.i('years','Project years',g.years)}
    ${F.t('lessons','Outcome and funder feedback / lessons learned',g.lessons)}${F.t('strategy','Re-submission strategy',g.strategy)}
    ${up?F.t('relationship_notes','Relationship notes',g.relationship_notes):''}${F.t('note','Notes',g.note)}
    <div class="w sub">Status decides where the record appears: Awarded or Active → Active grants; Not Awarded → Unsuccessful; Closed → shown under Active as closed. Reports, tranches and milestones are added on the grant's own page after saving.</div>
    <div class="w fa"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" type="submit">Save</button></div></form>`);
  const f = document.getElementById('gForm');
  f.onsubmit = e => { e.preventDefault(); saveGrant(f, id); };
}
function secs(){}
async function saveGrant(f, id){
  const fd = new FormData(f), num = k => { if(!fd.has(k)) return undefined; const v=parseFloat(fd.get(k)); return isNaN(v)?null:v; }, txt = k => { if(!fd.has(k)) return undefined; const v=String(fd.get(k)).trim(); return v===''?null:v; };
  const row = { year:parseInt(fd.get('year'),10), status:fd.get('status'), project:txt('project'), funder:txt('funder') };
  ['thematic','geo','note','deadline','period','years','lessons','strategy','currency','grant_code','funder_type','funder_website','contact_name','contact_email','contact_phone','focus_areas','eligibility',
   'loi_due','submission_date','submission_time','submission_tz','decision_expected','award_currency','start_date','end_date','restrictions','doc_link','relationship_notes','tracker_project'].forEach(k=>{const v=txt(k); if(v!==undefined) row[k]=v;});
  ['amount','prob','total_usd','total_ngn','received_usd','outstanding_usd','outstanding_ngn','amount_eur','awarded_amount'].forEach(k=>{const v=num(k); if(v!==undefined) row[k]=v;});
  if(row.prob!=null && (row.prob<0||row.prob>1)) return alert('Probability must be between 0 and 1 (e.g. 0.4 for 40%).');
  if(row.start_date && row.end_date && row.end_date < row.start_date) return alert('The grant end date is before the start date.');
  row.updated_by = (S.user && (S.user.email||S.user.name)) || 'unknown';
  if(!id) row.created_by = row.updated_by;
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Saving…';
  const res = id ? await db.from('grants_register').update(row).eq('id',id).select() : await db.from('grants_register').insert([row]).select();
  if(res.error){ btn.disabled=false; btn.textContent='Save'; return alert('Not saved: '+(/grants_register_code_uq|duplicate/.test(res.error.message)?'that grant code is already used by another record.':res.error.message)); }
  closeModal(); toast('Saved');
  const saved = (res.data||[])[0];
  if(saved && +saved.year !== +S.year && S.year!=='all') S.year = +saved.year;
  await load(); if(saved){ S.grantId = saved.id; } render();
}
async function delGrant(id){
  const g = S.data.grants.find(x=>x.id===id);
  if(!confirm('Delete "'+(g&&g.project)+'"?\n\nIts tranches, reports and milestones are deleted with it. The record itself stays in the Change log.')) return;
  const { error } = await db.from('grants_register').delete().eq('id',id); if(error) return alert('Not deleted: '+error.message);
  S.grantId=null; toast('Deleted'); await reload();
}
async function delRow(t,id){ if(!confirm('Delete this entry?')) return; const { error } = await db.from(t).delete().eq('id',id); if(error) return alert('Not deleted: '+error.message); toast('Deleted'); await reload(); }
const CHILD = {
  tranche:{ t:'grant_tranches', title:'payment tranche', list:'tranches', form:x=>F.i('due_date','Expected date',x.due_date,'date','required')+F.i('amount','Expected amount',x.amount,'number','step="any" required')
     +F.s('currency','Currency',x.currency||'USD',['USD','EUR','GBP','NGN'])+F.i('received_date','Received on',x.received_date,'date')+F.i('received_amount','Amount received',x.received_amount,'number','step="any"')+F.t('note','Note (milestone it depends on, conditions…)',x.note) },
  report:{ t:'grant_reports', title:'report', list:'reports', form:x=>F.s('kind','Type',x.kind||'Interim narrative',REPORT_KINDS)+F.i('title','Title (optional)',x.title)+F.i('due_date','Due date',x.due_date,'date','required')
     +F.i('submitted_date','Submitted on',x.submitted_date,'date')+F.t('note','Note',x.note) },
  milestone:{ t:'grant_milestones', title:'milestone', list:'milestones', form:x=>F.i('title','Milestone or deliverable',x.title,'text','required',1)+F.i('due_date','Due date',x.due_date,'date')
     +F.i('done_date','Done on',x.done_date,'date')+F.t('note','Note',x.note) } };
function editChild(kind, id, grantId){
  const c = CHILD[kind], x = id ? S.data[c.list].find(r=>r.id===id) : {};
  modal((id?'Edit ':'Add ')+c.title, `<form class="form" id="cForm">${c.form(x)}<div class="w fa">${id?`<button type="button" class="btn danger" style="margin-right:auto" id="cDel">Delete</button>`:''}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" type="submit">Save</button></div></form>`);
  const f = document.getElementById('cForm');
  f.onsubmit = async e => { e.preventDefault(); const fd=new FormData(f), row={ grant_id:grantId };
    for(const [k,v] of fd.entries()){ const s=String(v).trim(); row[k] = s==='' ? null : ['amount','received_amount'].includes(k) ? parseFloat(s) : s; }
    const res = id ? await db.from(c.t).update(row).eq('id',id) : await db.from(c.t).insert([row]);
    if(res.error) return alert('Not saved: '+res.error.message); closeModal(); toast('Saved'); await reload(); };
  if(id) document.getElementById('cDel').onclick = async () => { if(!confirm('Delete this '+c.title+'?')) return; const { error } = await db.from(c.t).delete().eq('id',id); if(error) return alert('Not deleted: '+error.message); closeModal(); toast('Deleted'); await reload(); };
}
function editRcv(id){
  const r = id ? S.data.receivables.find(x=>x.id===id) : {};
  modal(id?'Edit receivable':'Add receivable', `<form class="form" id="rForm">${F.i('grant_name','Grant',r.grant_name,'text','required')}${F.i('funder','Funder',r.funder)}
    ${F.i('amount_usd','Amount (USD)',r.amount_usd,'number','step="any"')}${F.i('amount_ngn','Amount (NGN)',r.amount_ngn,'number','step="any"')}${F.i('due','Due',r.due)}
    ${F.s('status','Status',r.status||'Overdue / Pending',RCV_STATUSES)}${F.s('priority','Priority',r.priority||'HIGH',['CRITICAL','HIGH','MEDIUM','LOW'])}${F.i('owner','Action owner',r.owner)}${F.i('target','Target date',r.target)}
    ${F.t('action','Action required',r.action)}<div class="w fa"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" type="submit">Save</button></div></form>`);
  const f = document.getElementById('rForm');
  f.onsubmit = async e => { e.preventDefault(); const fd=new FormData(f), n=k=>{const v=parseFloat(fd.get(k));return isNaN(v)?null:v};
    const row = { grant_name:fd.get('grant_name'), funder:fd.get('funder'), amount_usd:n('amount_usd'), amount_ngn:n('amount_ngn'), due:fd.get('due'), status:fd.get('status'), priority:fd.get('priority'), owner:fd.get('owner'), target:fd.get('target'), action:fd.get('action') };
    const res = id ? await db.from('receivables').update(row).eq('id',id) : await db.from('receivables').insert([row]);
    if(res.error) return alert('Not saved: '+res.error.message); closeModal(); toast('Saved'); await reload(); };
}

// ═════════ EXCEL ═════════
function sheet(wb, name, head, rows, widths){ const ws = XLSX.utils.aoa_to_sheet([head].concat(rows)); ws['!cols'] = (widths||head.map(()=>18)).map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31)); }
function exportExcel(){
  const wb = XLSX.utils.book_new(), gs = S.data.grants.slice().sort((a,b)=>(b.year-a.year)||String(a.stage).localeCompare(b.stage));
  const wins = gs.filter(won).length, losses = gs.filter(g=>g.stage==='unsuccessful').length;
  const ys = yearsAll().slice().reverse();
  sheet(wb,'Summary',['Year','Applications','Won','Not awarded','Open','Win rate'], ys.map(y=>{const r=gs.filter(g=>+g.year===y),w=r.filter(won).length,l=r.filter(g=>g.stage==='unsuccessful').length;
    return [y,r.length,w,l,r.filter(g=>g.stage==='pipeline').length,w+l?Math.round(w/(w+l)*100)+'%':'–'];}).concat([['All years',gs.length,wins,losses,gs.filter(g=>g.stage==='pipeline').length,wins+losses?Math.round(wins/(wins+losses)*100)+'%':'–']]),[12,14,8,12,8,10]);
  sheet(wb,'Grants register',['Code','Year','Project','Funder','Funder type','Website','Programme officer','Email','Phone','Focus areas','Eligibility','Theme','Geography','Stage','Status',
    'Requested','Currency','Probability','LOI due','Submission date','Time','Time zone','Decision expected','Awarded','Award currency','Start','End','Period (text)','Total USD','Total NGN','Received USD','Outstanding USD','Outstanding NGN',
    'Restrictions','Expense Tracker project','Documents','Outcome / lessons','Re-submission strategy','Relationship notes','Notes'],
    gs.map(g=>[g.grant_code,g.year,g.project,g.funder,g.funder_type,g.funder_website,g.contact_name,g.contact_email,g.contact_phone,g.focus_areas,g.eligibility,g.thematic,g.geo,g.stage,lab(g.status),
      g.amount,g.currency,g.prob,g.loi_due,g.submission_date,g.submission_time,g.submission_tz,g.decision_expected,g.awarded_amount,g.award_currency,g.start_date,g.end_date,g.period,g.total_usd,g.total_ngn,g.received_usd,g.outstanding_usd,g.outstanding_ngn,
      g.restrictions,g.tracker_project,g.doc_link,g.lessons,g.strategy,g.relationship_notes,g.note]));
  const pn = id => (S.data.grants.find(g=>g.id===id)||{}).project||'';
  if(S.data.tranches.length) sheet(wb,'Tranches',['Grant','Due','Expected','Currency','Received on','Received','Note'], S.data.tranches.map(t=>[pn(t.grant_id),t.due_date,t.amount,t.currency,t.received_date,t.received_amount,t.note]),[40,12,14,9,12,14,40]);
  if(S.data.reports.length) sheet(wb,'Reports',['Grant','Type','Title','Due','Submitted','Note'], S.data.reports.map(r=>[pn(r.grant_id),r.kind,r.title,r.due_date,r.submitted_date,r.note]),[40,18,30,12,12,40]);
  if(S.data.milestones.length) sheet(wb,'Milestones',['Grant','Milestone','Due','Done','Note'], S.data.milestones.map(m=>[pn(m.grant_id),m.title,m.due_date,m.done_date,m.note]),[40,40,12,12,40]);
  const dl = allDeadlines().filter(d=>!d.done);
  if(dl.length) sheet(wb,'Open deadlines',['Date','What','Grant','Funder','Detail','Days left'], dl.map(d=>[d.date,d.kind,d.g.project,d.g.funder,d.text,days(d.date)]),[12,16,40,28,40,10]);
  if(S.data.receivables.length) sheet(wb,'Receivables',['Grant','Funder','USD','NGN','Due','Status','Priority','Action','Owner','Target'], S.data.receivables.map(x=>[x.grant_name,x.funder,x.amount_usd,x.amount_ngn,x.due,x.status,x.priority,x.action,x.owner,x.target]),[34,26,14,16,14,18,10,44,18,14]);
  XLSX.writeFile(wb, 'RAHAMA_Grants_Tracker_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
