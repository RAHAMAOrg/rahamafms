                        ? '<button class="action-btn" onclick="app.showProcurementUpload(\'' + cn.refNumber + '\')" style="background:#FFEBEE;border-color:#C62828;color:#B71C1C;">↩ Fix Receipt Details & Resubmit</button>'
                        : '<button class="action-btn" onclick="app.showPOCreationForm(\'' + cn.refNumber + '\')" style="background:#FFEBEE;border-color:#C62828;color:#B71C1C;">↩ Fix & Recreate PO</button>';
                    return '<div style="background:#FFEBEE;border:1px solid #FFCDD2;border-radius:6px;padding:6px 10px;margin-bottom:6px;max-width:200px;"><div style="font-size:11px;font-weight:700;color:#B71C1C;">⚠️ Finance Rejected</div><div style="font-size:11px;color:#C62828;margin-top:2px;">' + (cn.financeRejectionReason.length > 60 ? cn.financeRejectionReason.slice(0,60)+'…' : cn.financeRejectionReason) + '</div></div>' + fixBtn;
                }
                if (!cn.poNumber) {
                    if (cn.quoteExceptionStatus === 'approved') {
                        return '<div style="background:#F1F8F4;border:1px solid #A5D6A7;border-radius:8px;padding:8px 12px;max-width:210px;margin-bottom:6px;">'
                             + '<div style="font-size:11px;font-weight:700;color:#1B5E20;">✓ 3-Quote Exception Approved</div>'
                             + '<div style="font-size:11px;color:#2E7D32;">by ' + (cn.quoteExceptionApprovedBy || '') + '</div></div>'
                             + '<button class="action-btn approve" onclick="app.showPOCreationForm(\'' + cn.refNumber + '\')">📝 Create &amp; Share PO</button>';
                    }
                    // At or above ₦500,000 the quotation analysis is mandatory —
                    // procurement cannot enter a PO directly.
                    const mustAnalyse = Number(cn.estimatedCost || 0) >= 500000
                                        && cn.quoteExceptionStatus !== 'approved';
                    let out = '<button class="action-btn approve" onclick="app.showQuotationAnalysis(\'' + cn.refNumber + '\')" style="margin-bottom:6px;">📊 Analyse Quotations &amp; Create PO</button><br>';
                    if (mustAnalyse) {
                        out += '<div style="font-size:11px;color:#B45309;max-width:190px;">⚠️ Above ₦500,000 — quotation analysis is required, with at least 3 quotes.</div>';
                    } else {
                        out += '<button class="action-btn" onclick="app.showPOCreationForm(\'' + cn.refNumber + '\')" style="border-color:#6B7280;color:#6B7280;font-size:12px;">📝 Skip Analysis — Enter PO Directly</button>';
                    }
                    return out;
                }
                if (!cn.grrNumber) {
                    return '<button class="action-btn" onclick="app._procurementSignPO(\'' + cn.refNumber + '\')" style="border-color:#7B1FA2;color:#7B1FA2;font-size:12px;margin-bottom:6px;">✍️ Sign PO (Procurement)</button><br>'
                         + '<button class="action-btn approve" onclick="app.showProcurementUpload(\'' + cn.refNumber + '\')" style="margin-bottom:6px;">✅ Confirm Receipt &amp; Forward to Finance</button><br>'

    case 'approve_under_1m':

        const boFields = { budgetOwnerSignatureData: boSigData, budgetOwnerSignedAt: now, budgetOwnerApprovedBy: this.currentUser };
        if (action === 'approve_with_note') boFields.budgetOwnerNote = approvalNote;
        const needsSecurity = cn.travelRequired === 'yes' && cn.securityStatus !== 'cleared';
        updates = needsSecurity
            ? { status: 'security_review', currentApprover: 'security', securityStatus: 'pending',
                approvedBy: this.currentUser, approvedDate: null, ...boFields }
            : cn.requiresProcurement === 'yes'
            ? { currentApprover: 'procurement', sentToProcurement: now, retirementresponsibility: 'procurement', ...boFields }
            : { status: 'approved', approvedDate: now, approvedBy: this.currentUser, retirementresponsibility: 'staff', ...boFields };
        break; }
    case 'approve_needs_ed':
        // BO signs first, then routes to ED for counter-signature
        updates = { currentApprover: 'ed', forwardedToED: now, boPreApprovedAt: now,
            budgetOwnerSignatureData: boSigData, budgetOwnerSignedAt: now, budgetOwnerApprovedBy: this.currentUser };
        break;
    case 'forward_to_ed': updates = { currentApprover: 'ed', forwardedToED: now }; break;
    case 'ed_approve': {
        const boFields = { budgetOwnerSignatureData: boSigData, budgetOwnerSignedAt: now, budgetOwnerApprovedBy: this.currentUser };
        // Travel needs security clearance before procurement or payment can start.
        const needsSecurity = cn.travelRequired === 'yes' && cn.securityStatus !== 'cleared';
        updates = needsSecurity
            ? { status: 'security_review', currentApprover: 'security', securityStatus: 'pending',
                edApprovedAt: now, edApprovedBy: this.currentUser, ...boFields }
            : cn.requiresProcurement === 'yes'
            ? { currentApprover: 'procurement', sentToProcurement: now, retirementresponsibility: 'procurement', ...boFields }
            : { status: 'approved', approvedDate: now, approvedBy: this.currentUser, retirementresponsibility: 'staff', ...boFields };
        break; }
}
                try {
                    const { error } = await supabaseClient.from('concept_notes').update(updates).eq('refNumber', refNumber);
                    if (error) throw error;
                    Object.assign(cn, updates); this.clearCache();
                    await this._logAudit('concept_notes', refNumber, action, (() => {

                        if (action === 'approve_needs_ed') return `Pre-approved by BO ${this.currentUser} (₦${cn.estimatedCost.toLocaleString()} — above limit). Sent to ED for counter-signature.`;
                        if (updates.sentToProcurement) return `Approved by ${this.currentUser} → sent to Procurement. Amount: ₦${cn.estimatedCost.toLocaleString()}. PO: ${updates.poNumber||'N/A'}.`;
                        if (updates.status === 'approved') return `Approved by ${this.currentUser}. Amount: ₦${cn.estimatedCost.toLocaleString()}. Activity: ${cn.activityTitle}. Project: ${cn.projectCode}.`;
                        return `Action: ${action} by ${this.currentUser}.`;

                        await supabaseClient.from('document_signatures').insert([{

                            await this._previewPODraft(refNumber);
                        }
                    }
                    const isFullyApproved = updates.status === 'approved';
                    const sentToProcurement = !!updates.sentToProcurement;
                    const forwardedToED = !!updates.forwardedToED;
                    // Notify the submitting staff member
                    await this.createNotification(cn.staffName, isFullyApproved ? `Your concept note ${refNumber} has been approved!` : sentToProcurement ? `Your concept note ${refNumber} has been sent to Procurement.` : `Your concept note ${refNumber} has been forwarded to the Executive Director.`, isFullyApproved ? 'success' : 'info', refNumber);
                    // Notify ED when forwarded
                    if (forwardedToED) {
                        const edUsers = Object.entries(this.data.roles).filter(([,r]) => r === 'ed').map(([n]) => n);
                        for (const ed of edUsers) { await this.createNotification(ed, `Concept note ${refNumber} (₦${cn.estimatedCost.toLocaleString()}) has been forwarded to you for approval by ${this.currentUser}.`, 'info', refNumber); }

                        for (const p of procUsers) { await this.createNotification(p, `Concept note ${refNumber} has been sent to Procurement for processing.`, 'info', refNumber); }
                    }

                        address:   (document.getElementById('qaAddress_' + id)?.value || '').trim(),
                        price:     parseFloat(document.getElementById('qaPrice_'     + id)?.value) || 0,
                        delivery:  parseFloat(document.getElementById('qaDelivery_'  + id)?.value) || 0,
                        warranty:  parseFloat(document.getElementById('qaWarranty_'  + id)?.value) || 0,
                        financial: parseFloat(document.getElementById('qaFinancial_' + id)?.value) || 0,
                        quality
                    });
                });
                return vendors;
            },

            // Min-max normalise a set of values to 0–100.
            // lowerIsBetter=true inverts (used for price and delivery lead time).
            // If all values are identical, every vendor scores 100 (no differentiator).
            _qaNormalise(values, lowerIsBetter) {
                const min = Math.min(...values), max = Math.max(...values);
                if (max === min) return values.map(() => 100);
                return values.map(v => lowerIsBetter
                    ? ((max - v) / (max - min)) * 100
                    : ((v - min) / (max - min)) * 100);
            },

            _computeQuotationAnalysis(vendors, qty) {
                const qc = this._qaQualityCriteria;
                const w  = this._qaWeights;
                const qtyNum = qty || 1;

                // Composite quality score out of 5 (weighted avg of panel sub-criteria), then ×2 for /10
                vendors.forEach(v => {
                    const qSum = qc.reduce((s,c) => s + (v.quality[c.key] * (c.weight/100)), 0);
                    v.qualityScore5  = qSum;
                    v.qualityScore10 = qSum * 2;
                    v.totalQuoted    = v.price * qtyNum;
                });

                const nPrice     = this._qaNormalise(vendors.map(v => v.totalQuoted),    true);
                const nQuality   = this._qaNormalise(vendors.map(v => v.qualityScore10), false);
                const nDelivery  = this._qaNormalise(vendors.map(v => v.delivery),       true);
                const nWarranty  = this._qaNormalise(vendors.map(v => v.warranty),       false);
                const nFinancial = this._qaNormalise(vendors.map(v => v.financial),      false);

                vendors.forEach((v, i) => {
                    v.norm = {
                        price: nPrice[i], quality: nQuality[i], delivery: nDelivery[i],
                        warranty: nWarranty[i], financial: nFinancial[i]
                    };
                    v.compositeScore =
                        (nPrice[i]     * w.price     / 100) +
                        (nQuality[i]   * w.quality   / 100) +
                        (nDelivery[i]  * w.delivery  / 100) +
                        (nWarranty[i]  * w.warranty  / 100) +
                        (nFinancial[i] * w.financial / 100);
                });

                const lowestTotal = Math.min(...vendors.map(v => v.totalQuoted));
                const highestTotal = Math.max(...vendors.map(v => v.totalQuoted));
                const winner = vendors.reduce((best, v) => v.compositeScore > best.compositeScore ? v : best, vendors[0]);
                return { vendors, winner, lowestTotal, highestTotal, saving: highestTotal - lowestTotal };
            },

                if (vendors.some(v => !v.price || v.price <= 0)) { alert('Each quotation must have a unit price greater than zero.'); return; }

                const result = this._computeQuotationAnalysis(vendors, itemQty);

                // Three-quote rule applies to the winning total

                app._qaResult = { refNumber, itemDesc, itemUnit, itemQty, ...result, analysedBy: this.currentUser, analysedAt: new Date().toISOString() };

                        awardedVendors: awarded.map(v => v.name),

                        selectedScore: Number(r.winner.compositeScore.toFixed(2)),
                        vendors: r.vendors.map(v => ({
                            name: v.name, phone: v.phone, address: v.address,
                            price: v.price, totalQuoted: v.totalQuoted,
                            delivery: v.delivery, warranty: v.warranty, financial: v.financial,
                            quality: v.quality,
                            qualityScore10: Number(v.qualityScore10.toFixed(2)),
                            compositeScore: Number(v.compositeScore.toFixed(2)),
                            selected: awarded.includes(v)
                        }))
                    };
                    const { error } = await supabaseClient.from('concept_notes')
                        .update({ quotationAnalysisJson: JSON.stringify(payload) })
                        .eq('refNumber', refNumber);
                    if (error) throw error;

                    const cnIdx = this.data.conceptNotes.findIndex(c => c.refNumber === refNumber);
                    if (cnIdx !== -1) this.data.conceptNotes[cnIdx].quotationAnalysisJson = JSON.stringify(payload);

                    await this._logAudit('concept_notes', refNumber, 'quotation_analysed',
                        `${r.vendors.length} quotations compared by ${this.currentUser}. Selected: ${r.winner.name} (score ${r.winner.compositeScore.toFixed(1)}/100, total ${r.winner.totalQuoted.toLocaleString()}).`);
                } catch(e) {
                    if (!confirm('Could not save the analysis record: ' + e.message + '\n\nThe quotationAnalysisJson column may be missing from your concept_notes table.\n\nContinue to PO creation anyway?')) return;
                }
                app._qaPrefillVendors = awarded.map(v => ({
                    name: v.name, phone: v.phone, address: v.address,
                    items: r.itemDesc, amount: v.price, qty: r.itemQty
                }));
                app._qaPrefillVendor = app._qaPrefillVendors[0];
                this.showPOCreationForm(refNumber);
            },

            // ══════════════════════════════════════════════════════════════
            // STAGE 1 — CREATE & SHARE PURCHASE ORDER (before anything is bought)
            // Vendor pricing entered and locked here; PO generated & shared with

                // Backstop: direct PO entry is not permitted at or above ₦500,000

                    alert('This procurement is ₦' + Number(cn.estimatedCost).toLocaleString() + ', which is at or above the ₦500,000 threshold.\n\nA quotation analysis with at least 3 quotes is required before a PO can be raised.');
                    this.showQuotationAnalysis(refNumber);

                app._vendorCount = 1;
                // Pre-filled from a completed quotation analysis, if one was just run
                let pf = app._qaPrefillVendor || null;
                app._qaPrefillVendor = null;

                const isEdit = !!app._poEditMode;

                let existingVendors = [];
                if (isEdit) {

                const content = document.getElementById('mainContent');

                content.innerHTML = `

                    </div>

                    ${cn.status === 'variance_rejected' && cn.rejectionReason ? `
                    <div style="background:#FFEBEE;border:2px solid #FFCDD2;border-radius:12px;padding:20px 24px;margin-bottom:24px;">
                        <div style="font-weight:700;color:#B71C1C;font-size:14px;margin-bottom:8px;">&#x274C; Variance Rejected by Budget Owner &#x2014; Action Required</div>
                        <p style="color:#C62828;font-size:13px;">${cn.rejectionReason}</p>
                        <p style="font-size:12px;color:#B71C1C;margin-top:8px;font-style:italic;">Please re-source at or within the original estimated budget and resubmit.</p>
                    </div>` : ''}

                    <div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:12px;padding:20px 24px;margin-bottom:24px;">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                            <div>
                                <div style="font-size:11px;font-weight:700;color:#1B4D8E;text-transform:uppercase;margin-bottom:4px;">Concept Note</div>
                                <div style="font-size:13px;color:#374151;">${cn.refNumber} — ${cn.activityTitle}</div>
                                <div style="font-size:12px;color:#6B7280;margin-top:2px;">Staff: ${cn.staffName}</div>
                            </div>
                            <div>
                                <div style="font-size:11px;font-weight:700;color:#1B4D8E;text-transform:uppercase;margin-bottom:4px;">Staff's Estimated Budget</div>
                                <div style="font-size:22px;font-weight:700;color:#1B4D8E;font-family:'Archivo',sans-serif;">₦${cn.estimatedCost.toLocaleString()}</div>
                            </div>
                        </div>
                        <p style="font-size:12px;color:#4338CA;margin-top:12px;font-style:italic;">
                            ℹ️ The price you enter per vendor below is locked once the PO is generated. Purchases over ₦500,000 require at least 3 vendor quotes. If the total exceeds the estimated budget by more than 20%, this will be sent to the Budget Owner for approval before a PO can be generated.
                        </p>
                    </div>

                    <form class="form-grid" id="poCreationForm" onsubmit="app.submitPOCreation(event, '${refNumber}')">
                        <div class="form-group full-width">
                            <label>PO Notes</label>
                            <textarea id="procNotes" rows="3" placeholder="Additional information — delivery terms, payment terms, etc."></textarea>
                        </div>
                        <div class="form-group full-width">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                                <h3 style="font-family:'Archivo',sans-serif;margin:0;">Vendor / Supplier Details</h3>
                                <button type="button" onclick="app._addVendorBlock()" style="padding:8px 16px;background:#ECFDF5;border:1px dashed #6EE7B7;border-radius:6px;color:#047857;font-size:13px;font-weight:600;cursor:pointer;">+ Add Another Vendor</button>
                            </div>
                            <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">For activities needing multiple vendors, add each separately — a PO will be generated for each</p>
                            <div id="vendorBlocksContainer">
                                <div id="vendorBlock_1" style="background:#F0FDF4;border:1px solid #A7F3D0;border-radius:10px;padding:16px;margin-bottom:12px;">
                                    <div style="margin-bottom:10px;"><strong style="color:#047857;font-size:13px;">Vendor 1${pf ? ' — selected by quotation analysis ★' : ''}</strong></div>
                                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Name <span style="color:var(--danger)">*</span></label><input type="text" id="vName_1" value="${pf ? (pf.name||'').replace(/"/g,'&quot;') : ''}" placeholder="Vendor or company name" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;"></div>
                                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Phone <span style="color:var(--danger)">*</span></label><input type="text" id="vPhone_1" value="${pf ? (pf.phone||'').replace(/"/g,'&quot;') : ''}" placeholder="e.g. 08012345678" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;"></div>
                                        <div style="grid-column:1/-1"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Goods / Services to be Supplied <span style="color:var(--danger)">*</span></label><textarea id="vItems_1" rows="3" placeholder="One item per line — e.g.&#10;20 plastic chairs&#10;4 tables&#10;1 projector" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;">${pf ? (pf.items||'') : ''}</textarea> style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;"></div>
                                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Reference / Quote No. <span style="font-size:11px;font-weight:400;color:#6B7280;">(optional)</span></label><input type="text" id="vInvoice_1" placeholder="Vendor quote reference" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;"></div>
                                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Unit Price (₦) <span style="color:var(--danger)">*</span></label><input type="number" id="vAmount_1" min="0" step="0.01" value="${pf ? Number(pf.amount||0) : ''}" placeholder="0" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;" oninput="app._recalcVendorTotal()"></div>
                                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Quantity Ordered <span style="color:var(--danger)">*</span></label><input type="number" id="vQty_1" min="1" step="1" value="${pf ? (pf.qty||1) : 1}" placeholder="e.g. 10" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;" oninput="app._recalcVendorTotal()"></div>
                                        <div style="grid-column:1/-1"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Address / Contact Details</label><textarea id="vAddress_1" rows="2" placeholder="Optional" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:60px;">${pf ? (pf.address||'') : ''}</textarea></div>
                                    </div>
                                </div>
                            </div>
                            <div id="vendorTotalDisplay" style="display:none;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:8px;padding:12px 16px;font-size:13px;font-weight:700;color:#047857;margin-top:4px;"></div>
                        </div>

                        <div class="btn-group full-width">
                            <button type="submit" class="btn btn-primary" id="poCreationSubmitBtn">${isEdit ? 'Save Changes to PO →' : 'Generate &amp; Share PO(s) →'}</button>
                            <button type="button" class="btn btn-secondary" onclick="app.showView('approvals')">Cancel</button>
                        </div>
                    </form>`;

                // Rebuild any additional vendor blocks when editing a multi-vendor PO
                if (isEdit && existingVendors.length > 1) {
                    for (let i = 1; i < existingVendors.length; i++) {
                        this._addVendorBlock();
                        const id = app._vendorCount;
                        const v = existingVendors[i];
                        const set = (pre, val) => { const el = document.getElementById(pre + '_' + id); if (el) el.value = val ?? ''; };
                        set('vName', v.name); set('vPhone', v.phone); set('vItems', v.items);
                        set('vInvoice', v.invoiceNo); set('vAmount', v.amount); set('vQty', v.qty || 1);
                        set('vAddress', v.address);
                    }
                    this._recalcVendorTotal();
                }
            },

            async submitPOCreation(event, refNumber) {
                event.preventDefault();
                const wasEdit = !!(this.data.conceptNotes.find(c => c.refNumber === refNumber) || {}).poNumber;
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber);
                if (!cn) return;
                const submitBtn = document.getElementById('poCreationSubmitBtn');
                const notes = document.getElementById('procNotes').value;

                const vendors = this._collectVendors();
                if (vendors.length === 0) { alert('Please add at least one vendor.'); return; }
                const missingFields = vendors.some(v => !v.name || !v.items);
                if (missingFields) { alert('Each vendor must have a Name and Goods/Services to be Supplied.'); return; }
                const missingPhone = vendors.some(v => !v.phone);
                if (missingPhone) { alert('Each vendor must have a phone number.'); return; }
                const missingPrice = vendors.some(v => !v.amount || v.amount <= 0);
                if (missingPrice) { alert('Each vendor must have a unit price greater than zero.'); return; }

                const total = vendors.reduce((s,v) => s + (v.amount * v.qty), 0);

                // Three-quote rule: require at least 3 vendor blocks for totals > 500,000
                const QUOTE_THRESHOLD = 500000;
                const vendorBlockCount = document.querySelectorAll('[id^="vendorBlock_"]').length;
                // A completed quotation analysis already satisfies the 3-quote rule —
                // it compared the quotes and selected the winner, so the PO carries
                // only that vendor. Demanding 3 vendor blocks here blocked procurement
                // from ever raising the PO the analysis had just chosen.
                let quotesOnRecord = 0;
                try { quotesOnRecord = (JSON.parse(cn.quotationAnalysisJson || '{}').vendors || []).length; } catch(e) {}
                // The local copy can be stale — an analysis saved moments ago may not
                // be in this session's cache. Check the database before blocking.
                if (quotesOnRecord < 3) {
                    try {
                        const { data: fresh } = await supabaseClient.from('concept_notes')
                            .select('quotationAnalysisJson').eq('refNumber', refNumber).single();
                        if (fresh?.quotationAnalysisJson) {
                            quotesOnRecord = (JSON.parse(fresh.quotationAnalysisJson).vendors || []).length;
                            const li = this.data.conceptNotes.findIndex(x => x.refNumber === refNumber);
                            if (li !== -1) this.data.conceptNotes[li].quotationAnalysisJson = fresh.quotationAnalysisJson;
                        }
                    } catch(e) {}
                }
                // The three-quote rule applies per service, not to the concept note
                // total. Several vendors supplying DIFFERENT services (venue, catering,
                // printing) can't be compared against each other — only a single
                // service worth ₦500,000 or more needs competing quotes.
                const largestLine = vendors.reduce((mx,v) => Math.max(mx, Number(v.amount||0) * (v.qty||1)), 0);
                const bigLines = vendors.filter(v => (Number(v.amount||0) * (v.qty||1)) >= QUOTE_THRESHOLD);

                if (bigLines.length > 0 && vendorBlockCount < 3 && quotesOnRecord < 3 && cn.quoteExceptionStatus !== 'approved') {
                    alert(
                        `These service(s) are individually at or above ₦500,000:\n\n` +
                        `${bigLines.map(v => `  • ${v.name} — ₦${(Number(v.amount||0)*(v.qty||1)).toLocaleString()}`).join('\n')}\n\n` +
                        `A single service of that value needs at least 3 competing quotes.\n\n` +
                        `If fewer than 3 providers exist, open Quotation Analysis and tick ` +
                        `"Fewer than 3 providers exist for this service" to request Budget Owner approval.`);
                    return;
                }
                if (bigLines.length > 0 && cn.quoteExceptionStatus === 'pending') {
                    alert('The 3-quote exception is still awaiting Budget Owner approval. The PO can be raised once it is approved.');
                    return;
                }
                if (bigLines.length > 0 && cn.quoteExceptionStatus === 'declined') {
                    alert(`The 3-quote exception was declined${cn.quoteExceptionDeclineReason ? ':\n\n' + cn.quoteExceptionDeclineReason : '.'}\n\nYou need at least 3 competing quotes for this service.`);
                    return;
                }

                // Total is above the threshold only because several distinct services
                // are combined — record why, so the audit trail shows it wasn't a
                // single purchase split to stay under the limit.
                if (bigLines.length === 0 && total >= QUOTE_THRESHOLD && vendors.length > 1 && quotesOnRecord < 3) {
                    if (!app._multiServiceReason) {
                        const reason = prompt(
                            `This concept note totals ₦${total.toLocaleString()} across ${vendors.length} vendors, ` +
                            `but no single service reaches ₦500,000 (largest is ₦${largestLine.toLocaleString()}).\n\n` +
                            `If these vendors are supplying DIFFERENT services, no quotation analysis is required.\n\n` +
                            `Briefly state what each vendor is providing:`);
                        if (reason === null) return;
                        if (!reason.trim() || reason.trim().length < 15) {
                            alert('Please describe what each vendor is supplying — this is recorded in the audit trail.');
                            return;
                        }
                        app._multiServiceReason = reason.trim();
                    }
                }

                const variance = cn.estimatedCost - total;
                const overPct = cn.estimatedCost > 0 ? ((total - cn.estimatedCost) / cn.estimatedCost) : 0;

                if (variance < -0.01 && overPct > 0.20) {
                    const overAmt = Math.abs(variance).toLocaleString(undefined, { minimumFractionDigits: 2 });
                    const pctLabel = (overPct * 100).toFixed(1);
                    const justification = prompt(
                        `🚨 VARIANCE EXCEEDS 20% — Budget Owner Approval Required\n\n` +
                        `Estimated: ₦${cn.estimatedCost.toLocaleString()}\n` +
                        `Proposed PO Total: ₦${total.toLocaleString()}\n` +
                        `Over by:   ₦${overAmt} (${pctLabel}%)\n\n` +
                        `This will be sent to the Budget Owner for approval before a PO can be generated.\n\n` +
                        `Enter a brief justification for the cost increase:`
                    );
                    if (justification === null) return;
                    if (!justification.trim()) { alert('A justification is required for variances above 20%.'); return; }

                    try {
                        submitBtn.disabled = true; submitBtn.textContent = 'Escalating…';
                        const now = new Date().toISOString();
                        await supabaseClient.from('concept_notes').update({
                            status: 'variance_review',
                            currentApprover: 'budgetOwner',
                            actualProcurementCost: total,
                            procurementVariance: variance,
                            procurementNotes: notes,
                            varianceJustification: justification.trim(),
                            varianceEscalatedAt: now,
                            varianceEscalatedBy: this.currentUser,
                            financeRejectionReason: null,
                            financeRejectedAt: null,
                            financeRejectedBy: null,
                            vendorsJson: JSON.stringify(vendors)
                        }).eq('refNumber', refNumber);

                        await this._logAudit('concept_notes', refNumber, 'variance_escalated',
                            `${pctLabel}% over budget at PO stage. Proposed total: ₦${total.toLocaleString()}. Justification: ${justification.trim()}.`);

                        const cnIdx = this.data.conceptNotes.findIndex(c => c.refNumber === refNumber);
                        if (cnIdx !== -1) Object.assign(this.data.conceptNotes[cnIdx], {
                            status: 'variance_review', currentApprover: 'budgetOwner',
                            actualProcurementCost: total, procurementVariance: variance,
                            vendorsJson: JSON.stringify(vendors)
                        });
                        this.clearCache();

                        alert(`Vendor pricing escalated to Budget Owner for approval.\n\nA PO will be generated automatically once approved — no purchase should be made until then.`);
                        this.showView('approvals');
                    } catch(e) {
                        alert('Error escalating variance: ' + e.message);
                    } finally {
                        submitBtn.disabled = false; submitBtn.textContent = 'Generate & Share PO(s) →';
                    }
                    return;
                }

                try {
                    submitBtn.disabled = true; submitBtn.textContent = 'Generating PO…';

                    const projCode  = (cn.projectCode || 'GEN').replace(/[^A-Z0-9]/gi,'').toUpperCase();
                    const yearMonth = new Date().toISOString().slice(0,7).replace('-','');
                    const serial    = Date.now().toString().slice(-5);
                    // Amending an unsigned PO keeps its number — a new one would
                    // orphan the document already shared with vendors.
                    const poNumber  = cn.poNumber || `PO-${projCode}-${yearMonth}-${serial}`;
                    const now       = new Date().toISOString();

                    const { error: cnError } = await supabaseClient.from('concept_notes').update({
                        poNumber,
                        poGeneratedAt: now,
                        procurementNotes: notes,
                        vendorsJson: JSON.stringify(vendors),
                        multiServiceJustification: app._multiServiceReason || null,
                        rejectionReason: null,
                        financeRejectionReason: null,
                        financeRejectedAt: null,
                        financeRejectedBy: null
                    }).eq('refNumber', refNumber);
                    if (cnError) throw cnError;

                    const cnIdx = this.data.conceptNotes.findIndex(c => c.refNumber === refNumber);
                    if (cnIdx !== -1) Object.assign(this.data.conceptNotes[cnIdx], {
                        poNumber, poGeneratedAt: now, vendorsJson: JSON.stringify(vendors)
                    });
                    this.clearCache();

                    if (app._multiServiceReason) {
                        await this._logAudit('concept_notes', refNumber, 'multi_service_declared',
                            `No quotation analysis required — ${vendors.length} vendors supplying different services, largest single line ₦${largestLine.toLocaleString()} (below the ₦500,000 threshold). Declared by ${this.currentUser}: ${app._multiServiceReason}`);
                    }
                    await this._logAudit('concept_notes', refNumber, 'po_created',
                        `PO ${poNumber} created by ${this.currentUser}. Vendors: ${vendors.map(v=>v.name).join(', ')}. Total: ₦${total.toLocaleString()}.`);

                    await this.createNotification(cn.staffName,
                        `PO ${poNumber} has been generated for ${refNumber} (${cn.activityTitle}) and is ready for your signature.`,
                        'info', refNumber);
                    // Finance confirms the PO as a budget commitment — under the
                    // PO-first flow there is no payment yet to prompt them, so
                    // they are notified directly.
                    if (!wasEdit) {
                        const financeUsers = Object.entries(this.data.roles)
                            .filter(([, r]) => ['finance','finance_manager'].includes(r))
                            .map(([n]) => n);
                        for (const f of financeUsers) {
                            await this.createNotification(f,
                                `PO ${poNumber} raised for ${refNumber} (${cn.activityTitle}) — ₦${total.toLocaleString()}. Open the concept note to confirm it as a budget commitment.`,
                                'info', refNumber);
                        }
                    }

                    // Amending replaces procurement's earlier signature — it must
                    // attest to the terms as they now stand, not the previous ones.
                    if (wasEdit) {
                        await supabaseClient.from('document_signatures')
                            .delete().eq('docRef', poNumber).eq('pageContext', 'procurement_po');
                    }
                    app._multiServiceReason = null;
                    alert(`PO ${poNumber} saved!\n\n${wasEdit ? 'Because the details changed, you will be asked to sign again.' : 'You will now be asked to sign it as Procurement.'}\n\nAfter that, share it with the vendor(s) — the requester will be prompted to sign too.`);
                    const { data: alreadySigned } = await supabaseClient.from('document_signatures')
                        .select('id').eq('docRef', poNumber).eq('pageContext', 'procurement_po');
                    if (!alreadySigned || alreadySigned.length === 0) {
                        await this.showSigningView(poNumber, 'purchase_order', refNumber, 'procurement_po', refNumber);
                    } else {
                        this.showView('approvals');
                    }
                } catch(e) {
                    alert('Error generating PO: ' + e.message);
                } finally {
                    submitBtn.disabled = false; submitBtn.textContent = 'Generate & Share PO(s) →';
                }
            },

            showProcurementUpload(refNumber) {
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber);
                if (!cn) return;
                if (!cn.poNumber) { alert('No PO exists for this concept note yet. Please create the PO first.'); this.showPOCreationForm(refNumber); return; }
                const bankOptions = ['Access Bank','Fidelity Bank','First Bank','FCMB','GTBank','Jaiz Bank','Keystone Bank','Moniepoint MFB','Opay Services','Polaris Bank','Stanbic IBTC','UBA','Union Bank','Unity Bank','Wema Bank','Zenith Bank'].map(b => `<option value="${b}">${b}</option>`).join('');
                const content = document.getElementById('mainContent');

                let vendors = [];
                try { if (cn.vendorsJson) vendors = JSON.parse(cn.vendorsJson); } catch(e) {}
                if (vendors.length === 0) {
                    vendors = [{ name: cn.grrVendorName||'', phone: cn.grrVendorPhone||'', items: cn.vendorItemsSupplied||'', invoiceNo: cn.vendorInvoiceNo||'', amount: cn.actualProcurementCost||cn.estimatedCost, qty: 1, quality: 'Good', address: cn.vendorAddress||'' }];
                }
                const poTotal = vendors.reduce((s,v) => s + (Number(v.amount||0) * (v.qty||1)), 0);

                // Prior partial deliveries against this PO — used to show what's left per vendor line
                let receivedRounds = [];
                try { if (cn.receivedJson) receivedRounds = JSON.parse(cn.receivedJson); } catch(e) {}
                const _getReceivedQty = (vendorIndex) => receivedRounds.reduce((s,r) =>
                    s + (r.lines||[]).filter(l => l.vendorIndex === vendorIndex).reduce((ss,l) => ss + (Number(l.qtyReceived)||0), 0), 0);
                const roundsSoFar = receivedRounds.length;
                const cumulativeReceivedValue = Number(cn.actualProcurementCost || 0);
                const poBalance = poTotal - cumulativeReceivedValue;

                const vendorBlocksHtml = vendors.map((v, i) => {
                    const id = i + 1;
                    const orderedQty    = v.qty || 1;
                    const receivedSoFar = _getReceivedQty(i);
                    const remaining     = Math.max(0, orderedQty - receivedSoFar);

                                            font-weight:700;letter-spacing:0.5px;text-transform:uppercase;">

                                            <div style="font-size:22px;font-weight:700;color:#047857;font-family:'Archivo',sans-serif;">₦${poTotal.toLocaleString()}${roundsSoFar > 0 ? ` <span style="font-size:14px;color:#E65100;">(₦${poBalance.toLocaleString()} left)</span>` : ''}</div>

                        <div class="form-group full-width">
    <h3 style="font-family:'Archivo',sans-serif;margin-bottom:8px;">Confirm Vendor / Supplier Receipt</h3>

        ${vendorBlocksHtml}

</div>

            _handleProcFile(input, areaId, label) {
                const area = document.getElementById(areaId);
                const file = input.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) { alert('File too large — max 5MB'); input.value = ''; return; }
                area.classList.add('has-file');
                area.innerHTML = `<p>✓ ${file.name}</p><span class="form-hint">${(file.size/1024).toFixed(1)} KB — ${label} ready</span>`;
            },

            // Keeps a "Receiving Now" field from exceeding what's actually left to receive on that vendor line
            _clampReceivingInput(el, max) {
                const v = parseFloat(el.value) || 0;
                if (v > max) el.value = max;
                if (v < 0) el.value = 0;
            },

            // Reads the per-vendor "Receiving Now" quantities, quality, and payment
            // account details for THIS delivery round (used by completeProcurementWithDocs).
            // Distinct from _collectVendors(), which reads the PO-creation form.
            _collectProcurementReceiving() {
                const rows = [];
                document.querySelectorAll('[id^="vendorBlock_"]').forEach(block => {
                    const m = block.id.match(/vendorBlock_(\d+)/);
                    if (!m) return;
                    const id = m[1];
                    const receivingEl = document.getElementById('vReceiving_' + id);
                    const receivingNow = receivingEl ? (parseFloat(receivingEl.value) || 0) : 0;
                    rows.push({
                        id,
                        receivingNow,
                        quality:  document.getElementById('vQuality_'  + id)?.value || 'Good',
                        acctName: (document.getElementById('vAcctName_' + id)?.value || '').trim(),
                        acctNo:   (document.getElementById('vAcctNo_'   + id)?.value || '').trim(),
                        bank:     (document.getElementById('vBank_'     + id)?.value || '').trim(),
                    });
                });
                return rows;
            },

            calcProcurementVariance(estimatedCost) {
                const actual = parseFloat(document.getElementById('actualProcurementCost')?.value) || 0;
                const variance = estimatedCost - actual;
                const fmt = v => v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const display = document.getElementById('procVarianceDisplay');
                const table = document.getElementById('procVarianceTable');
                const varActual = document.getElementById('procVarActual');
                const varBal = document.getElementById('procVarBalance');
                const varRow = document.getElementById('procVarBalanceRow');
                if (actual <= 0 || !display) return;
                table.style.display = 'table';
                if (varActual) varActual.textContent = '₦' + fmt(actual);
                if (Math.abs(variance) < 0.005) {
                    display.style.cssText = 'background:#ECFDF5;border-color:#10B981;color:#065F46;padding:12px 16px;border-radius:8px;border:1px solid;min-height:48px;display:flex;align-items:center;';
                    display.innerHTML = '✅ Exact match — no variance';
                    if (varBal) { varBal.textContent = '₦0.00'; varBal.style.color = '#059669'; }
                    if (varRow) varRow.style.background = '#ECFDF5';
                } else if (variance > 0) {
                    display.style.cssText = 'background:#F0FDF4;border-color:#10B981;color:#065F46;padding:12px 16px;border-radius:8px;border:1px solid;min-height:48px;display:flex;align-items:center;';
                    display.innerHTML = `✅ <strong>₦${fmt(variance)} under budget</strong> — savings to be noted`;
                    if (varBal) { varBal.textContent = '+₦' + fmt(variance); varBal.style.color = '#059669'; }
                    if (varRow) varRow.style.background = '#F0FDF4';
                } else {
                    const over = Math.abs(variance);
                    display.style.cssText = 'background:#FFFBEB;border-color:#F59E0B;color:#92400E;padding:12px 16px;border-radius:8px;border:1px solid;min-height:48px;display:flex;align-items:center;';
                    display.innerHTML = `⚠️ <strong>₦${fmt(over)} over budget</strong> — Finance will see this. Add a note below.`;
                    if (varBal) { varBal.textContent = '-₦' + fmt(over); varBal.style.color = '#D97706'; }
                    if (varRow) varRow.style.background = '#FFFBEB';
                }
            },
            
            handleFileUpload(input, areaId) {
                const area = document.getElementById(areaId); const file = input.files[0];
                if (file) { if (file.size > MAX_FILE_SIZE) { alert(`File too large! Maximum size is ${MAX_FILE_SIZE / 1024 / 1024}MB`); input.value = ''; return; } area.classList.add('has-file'); area.innerHTML = `<p>✓ ${file.name}</p><span class="form-hint">${(file.size / 1024).toFixed(1)} KB</span>`; }
            },

            handleRetirementUpload(input) {
                const area = document.getElementById('retirementUploadArea'); const file = input.files[0];
                if (file) { if (file.size > MAX_FILE_SIZE) { alert(`File too large! Maximum size is ${MAX_FILE_SIZE / 1024 / 1024}MB`); input.value = ''; return; } area.classList.add('has-file'); area.innerHTML = `<p>✓ ${file.name}</p><span class="form-hint">${(file.size / 1024).toFixed(1)} KB</span>`; }
            },

            async completeProcurementWithDocs(event, refNumber) {
                event.preventDefault();
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber);
                if (!cn) return;
                if (!cn.poNumber) { alert('No PO exists for this concept note. Please create the PO first.'); return; }
                const submitBtn  = document.getElementById('procurementSubmitBtn');
                const notes      = document.getElementById('procNotes').value;
                const accountName   = document.getElementById('accountName').value;
                const accountNumber = document.getElementById('accountNumber').value;
                const bankName      = document.getElementById('bankName').value;

                // Procurement purchases always pay the vendor — never a staff reimbursement.
                const payMode = 'vendors';

                // The PO's locked vendor lines (name/phone/items/unit price/ordered qty) —
                // never edited here, only referenced.
                let vendors = [];
                try { if (cn.vendorsJson) vendors = JSON.parse(cn.vendorsJson); } catch(e) {}
                if (vendors.length === 0) { alert('No vendors found on this PO.'); return; }

                // Everything received in previous rounds — used to compute what's left.
                let receivedRounds = [];
                try { if (cn.receivedJson) receivedRounds = JSON.parse(cn.receivedJson); } catch(e) {}
                const getReceivedQty = (vi) => receivedRounds.reduce((s,r) =>
                    s + (r.lines||[]).filter(l => l.vendorIndex === vi).reduce((ss,l) => ss + (Number(l.qtyReceived)||0), 0), 0);

                // What's being received THIS round, per vendor line.
                const receiving = this._collectProcurementReceiving();
                const merged = vendors.map((v, i) => {
                    const r = receiving[i] || {};
                    const orderedQty    = v.qty || 1;
                    const receivedSoFar = getReceivedQty(i);
                    const remaining     = Math.max(0, orderedQty - receivedSoFar);
                    const receivingNow  = Math.min(Math.max(0, Number(r.receivingNow || 0)), remaining);
                    return { ...v, vendorIndex: i, orderedQty, receivedSoFar, remaining, receivingNow,
                             quality: r.quality || 'Good', acctName: r.acctName, acctNo: r.acctNo, bank: r.bank };
                });

                const activeLines = merged.filter(v => v.receivingNow > 0);
                if (activeLines.length === 0) { alert('Enter the quantity received in this delivery for at least one vendor.'); return; }

                const badAcct = activeLines.filter(v => !v.acctName || !v.acctNo || !v.bank);
                if (badAcct.length) {
                    alert(`Payment account details are missing for:\n\n${badAcct.map(v => '  • ' + v.name).join('\n')}\n\nEnter each vendor's account name, number and bank.`);
                    return;
                }
                const badNo = activeLines.filter(v => !/^[0-9]{10}$/.test(v.acctNo));
                if (badNo.length) {
                    alert(`Account number must be exactly 10 digits for:\n\n${badNo.map(v => '  • ' + v.name).join('\n')}`);
                    return;
                }

                // Value of THIS delivery only — not the whole PO.
                const roundCost = activeLines.reduce((s,v) => s + (Number(v.amount||0) * v.receivingNow), 0);

            async viewConceptNoteFromPayment(paymentRef) {
                let payment = this.data.payments.find(p => p.refNumber === paymentRef);
                if (!payment) {
                    const { data, error } = await supabaseClient.from('payments').select('*').eq('refNumber', paymentRef).single();
                    if (error || !data) { alert('Payment not found.'); return; }
                    payment = data;
                }
                if (!payment.conceptNoteRef) { alert('No concept note is linked to this payment.'); return; }
                await this.viewConceptNoteDetails(payment.conceptNoteRef);
            },

            async rejectPayment(refNumber) {
                const reason = prompt('Please provide a reason for rejection:'); if (!reason) return;
                const payment = this.data.payments.find(p => p.refNumber === refNumber);
                try {
                    const { error } = await supabaseClient.from('payments').update({ status: 'rejected', rejectedDate: new Date().toISOString(), rejectedBy: this.currentUser, rejectionReason: reason }).eq('refNumber', refNumber);
                    if (error) throw error;

                    const isProcurement = payment.retirementresponsibility === 'procurement' || payment.procurementComplete;

                    if (isProcurement && payment.conceptNoteRef) {
                        // Reset CN back to procurement so they can re-process
                        await supabaseClient.from('concept_notes').update({
                            currentApprover: 'procurement',
                            status: 'pending',
                            financeRejectionReason: reason,
                            financeRejectedAt: new Date().toISOString(),
                            financeRejectedBy: this.currentUser
                        }).eq('refNumber', payment.conceptNoteRef);

                        // Notify all procurement officers
                        const procUsers = Object.entries(this.data.roles).filter(([,r]) => r === 'procurement').map(([n]) => n);
                        for (const p of procUsers) {
                            await this.createNotification(p,
                                `⚠️ Finance rejected payment ${refNumber} for CN ${payment.conceptNoteRef}. Reason: "${reason}". Please review and resubmit to Finance.`,
                                'danger', payment.conceptNoteRef);
                        }
                        // Also notify original staff member
                        await this.createNotification(payment.staffName,
                            `Payment for your activity (${payment.conceptNoteRef}) was rejected by Finance: "${reason}". Procurement is reviewing and will resubmit.`,
                            'warning', refNumber);

                        await this._logAudit('payments', refNumber, 'rejected',
                            `Finance rejected procurement payment. Reason: ${reason}. CN ${payment.conceptNoteRef} returned to Procurement. Rejected by: ${this.currentUser}.`);

                        alert(`Payment rejected.\n\nCN ${payment.conceptNoteRef} has been returned to Procurement to review and resubmit.`);
                    } else {
                        // Regular staff payment — notify staff as before
                        await this.createNotification(payment.staffName,
                            `Your payment request ${refNumber} was rejected: "${reason}"`, 'danger', refNumber);
                        await this._logAudit('payments', refNumber, 'rejected',
                            `Staff payment rejected by ${this.currentUser}. Reason: ${reason}.`);
                        alert('Payment rejected.');
                    }

                    await this.loadData(); this.showView('approvals');
                } catch (error) { console.error('Reject error:', error); alert('Error rejecting payment: ' + error.message); }
            },
            
       async approveRetirement(refNumber) { return this.advanceRetirementStage(refNumber); },
            async rejectRetirement(refNumber) {
                const retirement = this.data.retirements.find(r => r.refNumber === refNumber);
                const reason = prompt('Please provide a reason for rejection:'); if (!reason) return;
                try {
                    const { error } = await supabaseClient.from('retirements').update({
                        status: 'rejected', rejectedDate: new Date().toISOString(),
                        rejectedBy: this.currentUser, rejectionReason: reason
                    }).eq('refNumber', refNumber);
                    if (error) throw error;
                    await this._logAudit('retirements', refNumber, 'retirement_rejected', `Rejected by ${this.currentUser}. Staff: ${retirement?.staffName||'N/A'}. Amount spent: ₦${Number(retirement?.actualSpent||0).toLocaleString()}. Reason: ${reason}. Payment ref: ${retirement?.paymentRef||'N/A'}.`);
                    // Notify the staff member
                    if (retirement) await this.createNotification(retirement.staffName, `Your retirement ${refNumber} was rejected: "${reason}". Please resubmit with corrections.`, 'danger', retirement.paymentRef || refNumber);
                    alert('Retirement rejected.'); await this.loadData(); this.showView('approvals');
                } catch (error) { console.error('Reject error:', error); alert('Error rejecting retirement: ' + error.message); }
            },

         // Bank payment schedule — every line Finance needs to pay, flattened
         // from multi-vendor schedules so one authorisation can produce several
         // transfers. Any finance officer can pull this.
         async exportPaymentSchedule() {
    const csvEscape = v => {
        const s = (v === null || v === undefined) ? '' : String(v);
        return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g,'""') + '"' : s;
    };
    const fmt = d => d ? new Date(d).toLocaleDateString('en-NG', { day:'2-digit', month:'short', year:'numeric' }) : '';

    let pays = [];
    try {
        const { data, error } = await supabaseClient.from('payments').select('*').limit(5000);
        if (error) throw new Error(error.message);
        pays = data || [];
    } catch(e) { alert('Could not load payments: ' + e.message); return; }

    // Only payments authorised by the designated authorizer. Status alone isn't
    // enough — legacy payments were marked 'paid' by the old single-step flow
    // without passing through the reviewer → approver → authorizer chain.
    const authorizer = Object.entries(this.data.financeStages || {})
        .find(([, s]) => s === 'authorizer')?.[0] || null;
    const scope = pays.filter(p => p.status === 'paid' && p.processedBy === authorizer);
    if (!scope.length) {
        alert(`No payments authorised by ${authorizer || 'the authorizer'} were found.`);
        return;
    }

    const rows = [];
    scope.forEach(p => {
        let sched = [];
        try { if (p.paymentScheduleJson) sched = JSON.parse(p.paymentScheduleJson); } catch(e) {}
        if (sched.length) {
            sched.forEach((s, i) => rows.push({
                payRef: p.refNumber, line: `${i+1} of ${sched.length}`, cn: p.conceptNoteRef || '',
                project: p.projectCode || '', beneficiary: s.vendor, detail: s.items || '',
                amount: s.amount, acctName: s.accountName, acctNo: s.accountNumber, bank: s.bankName,
                status: p.status, reviewed: p.reviewedBy || '', approved: p.financeApprovedBy || '',
                authorised: p.processedBy || '', paidDate: fmt(p.paidDate)
            }));
        } else {
            rows.push({
                payRef: p.refNumber, line: '1 of 1', cn: p.conceptNoteRef || '',
                project: p.projectCode || '', beneficiary: p.staffName, detail: p.justification ? String(p.justification).slice(0,80) : '',
                amount: p.amount, acctName: p.accountName || '', acctNo: p.accountNumber || '', bank: p.bankName || '',
                status: p.status, reviewed: p.reviewedBy || '', approved: p.financeApprovedBy || '',
                authorised: p.processedBy || '', paidDate: fmt(p.paidDate)
            });
        }
    });

    const total = rows.reduce((s,r) => s + Number(r.amount||0), 0);
    const headers = ['Payment Ref','Line','Concept Note','Project','Beneficiary','Description','Amount (NGN)',
                     'Account Name','Account Number','Bank','Status','Reviewed By','Approved By','Authorised By','Paid Date'];
    const csv = [
        ['RAHAMA Girl Child & Women Empowerment Initiative'].map(csvEscape).join(','),
        ['Payment Schedule — Authorised Payments'].map(csvEscape).join(','),
        ['Authorised by', authorizer || ''].map(csvEscape).join(','),
        ['Generated', new Date().toLocaleString('en-NG')].map(csvEscape).join(','),
        ['Generated by', this.currentUser || ''].map(csvEscape).join(','),
        ['Payment lines', rows.length].map(csvEscape).join(','),
        ['Total value (NGN)', total].map(csvEscape).join(','),
        '',
        headers.map(csvEscape).join(',')
    ];
    rows.forEach(r => csv.push([r.payRef, r.line, r.cn, r.project, r.beneficiary, r.detail, r.amount,
        r.acctName, r.acctNo, r.bank, r.status, r.reviewed, r.approved, r.authorised, r.paidDate].map(csvEscape).join(',')));

    const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rahama_payment_schedule_authorised_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    alert(`Payment schedule downloaded.\n\n${rows.length} payment line(s)\nTotal: ₦${total.toLocaleString()}`);
},

         // Concept-note-driven pipeline report.
         // Previously this started from payments, so an approved concept note that
         // hadn't reached payment yet was invisible. It now lists every approved
         // note and shows the stage it has reached, with payment and retirement
         // attached where they exist.
         async exportPaymentsReport() {
    const fmt = (d) => d ? new Date(d).toLocaleString('en-NG', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
    }) : '';
    const csvEscape = (val) => {
        const s = (val === null || val === undefined) ? '' : String(val);
        return (s.includes(',') || s.includes('"') || s.includes('\n'))
            ? '"' + s.replace(/"/g, '""') + '"' : s;
    };

    let cns = [], pays = [], rets = [];
    try {
        // Fetch fresh — the local cache is scoped to the current user's role and
        // would otherwise omit notes they aren't personally involved in.
        const [cnRes, payRes, retRes] = await Promise.all([
            supabaseClient.from('concept_notes').select('*').order('submittedDate', { ascending: false }).limit(5000),
            supabaseClient.from('payments').select('*').limit(5000),
            supabaseClient.from('retirements').select('*').limit(5000)
        ]);
        // Surface errors — previously a failed query silently became an empty
        // list, which looked identical to "no records in this period".
        if (cnRes.error)  throw new Error('concept_notes: ' + cnRes.error.message);
        if (payRes.error) throw new Error('payments: ' + payRes.error.message);
        if (retRes.error) throw new Error('retirements: ' + retRes.error.message);
        cns  = cnRes.data  || [];
        pays = payRes.data || [];
        rets = retRes.data || [];
        if (!cns.length) { alert('No concept notes were returned from the database at all.\n\nThis is a data access problem, not a date filter issue.'); return; }
    } catch (e) {
        alert('Could not load report data: ' + e.message); return;
    }

    // Everything that has cleared approval, at whatever stage it has reached
    let inScope = cns.filter(cn => {
        if (['rejected','variance_rejected'].includes(cn.status)) return false;
        const hasPayment = pays.some(p => p.conceptNoteRef === cn.refNumber);
        return cn.status === 'approved'
            || cn.budgetOwnerApprovedBy || cn.approvedBy
            || cn.currentApprover === 'procurement'
            || cn.poNumber || cn.grrNumber || hasPayment;
    });
    // Reporting period filter
    const fromVal  = document.getElementById('rptFrom')?.value || '';
    const toVal    = document.getElementById('rptTo')?.value   || '';
    const basis    = document.getElementById('rptBasis')?.value || 'submittedDate';
    const basisLbl = { submittedDate:'Concept note submitted', approvedDate:'Approved', paidDate:'Payment made' }[basis] || basis;
    const fromTs = fromVal ? new Date(fromVal + 'T00:00:00').getTime() : null;
    const toTs   = toVal   ? new Date(toVal   + 'T23:59:59').getTime() : null;

    const basisDate = (cn, pay) => {
        if (basis === 'paidDate')     return pay ? pay.paidDate : null;
        if (basis === 'approvedDate') return cn.approvedDate || cn.budgetOwnerSignedAt || null;
        return cn.submittedDate || null;
    };
    const preFilter = inScope.slice();
    const approvedCount = inScope.length;
    if (fromTs || toTs) {
        inScope = inScope.filter(cn => {
            const pay = pays.find(p => p.conceptNoteRef === cn.refNumber);
            const d = basisDate(cn, pay);
            if (!d) return false;                       // no date on this basis — out of period
            const ts = new Date(d).getTime();
            if (fromTs && ts < fromTs) return false;
            if (toTs   && ts > toTs)   return false;
            return true;
        });
    }
    if (!inScope.length) {
        if (fromTs || toTs) {
            // Show what the period actually excluded, so the cause is obvious
            const sample = approvedCount > 0
                ? preFilter.slice(0, 5).map(cn => `  • ${cn.refNumber}: ${basisDate(cn, pays.find(p=>p.conceptNoteRef===cn.refNumber)) || 'no date on this basis'}`).join('\n')
                : '';
            alert(`${approvedCount} approved concept note(s) exist, but none fall between ${fromVal||'the earliest record'} and ${toVal||'today'} using "${basisLbl}".\n\n` +
                  (sample ? `Most recent dates on that basis:\n${sample}\n\n` : '') +
                  `Try "All time", or change the date basis.`);
        } else {
            alert(`${cns.length} concept note(s) were found, but none have been approved yet.`);
        }
        return;
    }

    const stageOf = (cn, pay, ret) => {
        if (cn.status === 'security_review')  return '1. Awaiting security clearance';
        if (cn.status === 'variance_review')  return '2. Cost variance with Budget Owner';
        if (cn.requiresProcurement === 'yes' && !cn.poNumber)  return '3. With Procurement — PO not raised';
        if (cn.poNumber && !cn.grrNumber)     return '4. PO raised — awaiting delivery';
        if (cn.grrNumber && !pay)             return '5. Goods received — payment not raised';
        if (pay && pay.status === 'pending')  return '6. Payment awaiting review';
        if (pay && pay.status === 'reviewed') return '7. Payment awaiting approval';
        if (pay && pay.status === 'finance_approved') return '8. Payment awaiting authorisation';
        if (pay && pay.status === 'paid' && !ret) return '9. Paid — retirement outstanding';
        if (ret && ret.status === 'pending')  return '10. Retirement submitted';
        if (ret && ret.status === 'approved') return '11. Complete — retirement approved';
        if (ret && ret.status === 'rejected') return '12. Retirement rejected';
        if (!pay)                             return '5. Approved — payment not raised';
        return '—';
    };

    const headers = [
        'Concept Note','Stage','Project Code','Staff Name','Activity','Estimated Cost',
        'Requires Procurement','Travel','Security Status','Security Risk','Security Cleared By',
        'Approved By','Approved Date',
        'PO Number','PO Generated','GRR Number','Actual Procurement Cost','Variance',
        'Payment Ref','Payment Amount','Payment Status','Reviewed By','Approved By (Finance)','Authorised/Paid By','Paid Date',
        'Retirement Ref','Retirement Status','Actual Spent','Amount Returned',
        'Retirement Submitted','Retirement Decision'
    ];
    const periodLabel = (fromVal || toVal)
        ? `${fromVal || 'earliest'} to ${toVal || 'today'}`
        : 'All time';
    let csv = [
        ['RAHAMA Girl Child & Women Empowerment Initiative'].map(csvEscape).join(','),
        ['Concept Note Pipeline Report'].map(csvEscape).join(','),
        ['Reporting period', periodLabel].map(csvEscape).join(','),
        ['Date basis', basisLbl].map(csvEscape).join(','),
        ['Generated', fmt(new Date().toISOString())].map(csvEscape).join(','),
        ['Generated by', this.currentUser || ''].map(csvEscape).join(','),
        ['Records', inScope.length].map(csvEscape).join(','),
        '',
        headers.map(csvEscape).join(',')
    ];

    inScope.forEach(cn => {
        const pay = pays.find(p => p.conceptNoteRef === cn.refNumber);
        const ret = pay ? rets.find(r => r.paymentRef === pay.refNumber) : null;
        csv.push([
            cn.refNumber || '',
            stageOf(cn, pay, ret),
            cn.projectCode || '',
            cn.staffName || '',
            cn.activityTitle || '',
            cn.estimatedCost || 0,
            cn.requiresProcurement === 'yes' ? 'Yes' : 'No',
            cn.travelRequired === 'yes' ? 'Yes' : 'No',
            cn.securityStatus || '',
            cn.securityRiskLevel || '',
            cn.securityClearedBy || '',
            cn.approvedBy || cn.budgetOwnerApprovedBy || '',
            fmt(cn.approvedDate || cn.budgetOwnerSignedAt),
            cn.poNumber || '',
            fmt(cn.poGeneratedAt),
            cn.grrNumber || '',
            cn.actualProcurementCost || '',
            cn.procurementVariance || '',
            pay ? pay.refNumber : '',
            pay ? pay.amount : '',
            pay ? pay.status : 'no payment raised',
            pay ? (pay.reviewedBy || '') : '',
            pay ? (pay.financeApprovedBy || '') : '',
            pay ? (pay.processedBy || '') : '',
            pay ? fmt(pay.paidDate) : '',
            ret ? ret.refNumber : '',
            ret ? ret.status : (pay && pay.status === 'paid' ? 'not retired' : ''),
            ret ? ret.actualSpent : '',
            ret ? ret.amountReturned : '',
            ret ? fmt(ret.submittedDate) : '',
            ret ? fmt(ret.approvedDate || ret.rejectedDate) : ''
        ].map(csvEscape).join(','));
    });

    const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const link = document.createElement('a');
    const fileTag = (fromVal || toVal) ? `${fromVal||'start'}_to_${toVal||'today'}` : 'all_time';
    link.href = url; link.download = `rahama_pipeline_report_${fileTag}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    window.URL.revokeObjectURL(url);
    alert(`Report downloaded.\n\nPeriod: ${periodLabel}\nBasis: ${basisLbl}\nRecords: ${inScope.length}`);
},

            async downloadConceptNoteFile(refNumber) {

                const { data: payments = [] } = await supabaseClient.from('payments').select('*').eq('conceptNoteRef', cn.refNumber);
                const paymentRefs = (payments || []).map(p => p.refNumber);
                let retirements = [];
                if (paymentRefs.length > 0) {
                    const { data: ret = [] } = await supabaseClient.from('retirements').select('*').in('paymentRef', paymentRefs);
                    retirements = ret || [];

                // Fetch ALL signatures: by CN ref, payment refs, and by PO/GRR docRef
                const docRefs = [cn.refNumber, ...(cn.poNumber ? [cn.poNumber] : []), ...(cn.grrNumber ? [cn.grrNumber] : []), ...paymentRefs];
                const { data: docSigsRaw = [] } = await supabaseClient
                    .from('document_signatures').select('*')
                    .in('relatedRef', [cn.refNumber, ...paymentRefs]);
                const { data: docSigsByDocRef = [] } = docRefs.length > 0
                    ? await supabaseClient.from('document_signatures').select('*').in('docRef', docRefs)
                    : { data: [] };
                // Merge deduplicated by id
                const sigMap = new Map();
                [...(docSigsRaw||[]), ...(docSigsByDocRef||[])].forEach(s => sigMap.set(s.id, s));
                const docSigs = Array.from(sigMap.values()).sort((a,b) => new Date(a.signedAt)-new Date(b.signedAt));

                const fmt  = d => d ? new Date(d).toLocaleString('en-NG') : 'N/A';
                const fmtD = d => d ? new Date(d).toLocaleDateString('en-NG', { day:'numeric', month:'long', year:'numeric' }) : 'N/A';
                const money = n => n != null && n !== '' ? '\u20a6' + Number(n).toLocaleString() : 'N/A';

                const poSigs   = docSigs.filter(s => s.docType === 'purchase_order');

                const vendorSig    = vendorSigs[0] || null; // kept for compat
                const poStaffSig   = poSigs.find(s => s.pageContext === 'staff_po');
                const poBoSig      = poSigs.find(s => s.pageContext === 'budget_owner_po' || s.signerRole === 'budgetOwner');
                const poFinSig     = poSigs.find(s => s.pageContext === 'finance_sign' && s.docType === 'purchase_order');

            _initVendorCanvas() {
                const c = document.getElementById('vendorSigCanvas');
                if (!c) return;
                const ctx = c.getContext('2d');
                ctx.clearRect(0,0,c.width,c.height);
                ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                let drawing = false, hasMark = false;
                c._hasMark = false;
                const pos = e => { const r=c.getBoundingClientRect(); const s=e.touches?e.touches[0]:e; return {x:(s.clientX-r.left)*(c.width/r.width),y:(s.clientY-r.top)*(c.height/r.height)}; };
                const fresh = c.cloneNode(false);
                c.parentNode.replaceChild(fresh, c);
                const fc = document.getElementById('vendorSigCanvas');
                fc._hasMark = false;
                const fctx = fc.getContext('2d');
                fctx.strokeStyle='#1a1a2e'; fctx.lineWidth=2.4; fctx.lineCap='round'; fctx.lineJoin='round';
                let d2=false;

                fc.addEventListener('mousedown', e=>{e.preventDefault();d2=true;const p=p2(e);fctx.beginPath();fctx.moveTo(p.x,p.y);});
                fc.addEventListener('mousemove', e=>{e.preventDefault();if(!d2)return;fc._hasMark=true;const p=p2(e);fctx.lineTo(p.x,p.y);fctx.stroke();});
                fc.addEventListener('mouseup',   e=>{d2=false;});
                fc.addEventListener('mouseleave',e=>{d2=false;});
                fc.addEventListener('touchstart',e=>{e.preventDefault();d2=true;const p=p2(e);fctx.beginPath();fctx.moveTo(p.x,p.y);},{passive:false});
                fc.addEventListener('touchmove', e=>{e.preventDefault();if(!d2)return;fc._hasMark=true;const p=p2(e);fctx.lineTo(p.x,p.y);fctx.stroke();},{passive:false});

            async _showRemoteVendorSign(refNumber, vendorIndex) {
                let _grrVendorsAll = [];
                try { if (this.data.conceptNotes.find(x => x.refNumber === refNumber)?.vendorsJson) _grrVendorsAll = JSON.parse(this.data.conceptNotes.find(x => x.refNumber === refNumber).vendorsJson); } catch(e) {}
                const _gvIdx = (vendorIndex !== undefined && _grrVendorsAll.length > 1) ? vendorIndex : null;
                const _grrSingleJson = (_gvIdx !== null && _grrVendorsAll[_gvIdx])
                    ? JSON.stringify([_grrVendorsAll[_gvIdx]])
                    : (this.data.conceptNotes.find(x => x.refNumber === refNumber)?.vendorsJson || '');
                let cn = this.data.conceptNotes.find(c => c.refNumber === refNumber);
                if (!cn) {
                    const { data: cnFresh, error: cnErr } = await supabaseClient
                        .from('concept_notes').select('*').eq('refNumber', refNumber).single();
                    if (cnErr || !cnFresh) { alert('Could not load concept note: ' + (cnErr?.message||'not found')); return; }
