            _showSignaturePad(title, declaration) {
                return new Promise(resolve => {
                    // Build or reuse overlay
                    let overlay = document.getElementById('sigModalOverlay');
                    if (!overlay) {
                        overlay = document.createElement('div');
                        overlay.id = 'sigModalOverlay';
                        overlay.className = 'sig-modal-overlay';
                        overlay.innerHTML = `
                            <div class="sig-modal">
                                <h3 id="sigModalTitle"></h3>
                                <p id="sigModalDeclaration"></p>
                                <canvas id="sigCanvas" width="480" height="180"></canvas>
                                <div class="sig-canvas-hint">Draw your signature above using mouse or touch</div>
                                <div class="sig-modal-actions">
                                    <button class="btn btn-primary" id="sigConfirmBtn">✓ Confirm &amp; Sign</button>
                                    <button class="btn btn-secondary" id="sigClearBtn">Clear</button>
                                    <button class="btn btn-secondary" id="sigCancelBtn" style="margin-left:auto;">Cancel</button>
                                </div>
                            </div>`;
                        document.body.appendChild(overlay);
                    }

                    document.getElementById('sigModalTitle').textContent = title;
                    document.getElementById('sigModalDeclaration').textContent = declaration;
                    overlay.classList.add('open');

                    const canvas = document.getElementById('sigCanvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#1a1a2e';
                    ctx.lineWidth = 2.2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    let drawing = false, hasMark = false;
                    const pos = (e) => {
                        const r = canvas.getBoundingClientRect();
                        const src = e.touches ? e.touches[0] : e;
                        return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
                    };
                    const start = e => { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
                    const move  = e => { e.preventDefault(); if (!drawing) return; hasMark = true; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
                    const stop  = e => { drawing = false; };

                    // Clone canvas to remove old listeners
                    const fresh = canvas.cloneNode(true);
                    canvas.parentNode.replaceChild(fresh, canvas);
                    const c2 = document.getElementById('sigCanvas');
                    const ctx2 = c2.getContext('2d');
                    ctx2.strokeStyle = '#1a1a2e'; ctx2.lineWidth = 2.2; ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
                    let drawing2 = false, hasMark2 = false;
                    const pos2 = (e) => { const r = c2.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: (s.clientX-r.left)*(c2.width/r.width), y:(s.clientY-r.top)*(c2.height/r.height) }; };
                    c2.addEventListener('mousedown',  e => { e.preventDefault(); drawing2=true; const p=pos2(e); ctx2.beginPath(); ctx2.moveTo(p.x,p.y); });
                    c2.addEventListener('mousemove',  e => { e.preventDefault(); if(!drawing2)return; hasMark2=true; const p=pos2(e); ctx2.lineTo(p.x,p.y); ctx2.stroke(); });
                    c2.addEventListener('mouseup',    e => { drawing2=false; });
                    c2.addEventListener('mouseleave', e => { drawing2=false; });
                    c2.addEventListener('touchstart', e => { e.preventDefault(); drawing2=true; const p=pos2(e); ctx2.beginPath(); ctx2.moveTo(p.x,p.y); }, {passive:false});
                    c2.addEventListener('touchmove',  e => { e.preventDefault(); if(!drawing2)return; hasMark2=true; const p=pos2(e); ctx2.lineTo(p.x,p.y); ctx2.stroke(); }, {passive:false});
                    c2.addEventListener('touchend',   e => { drawing2=false; });

                    const close = (result) => {
                        overlay.classList.remove('open');
                        resolve(result);
                    };

                    document.getElementById('sigClearBtn').onclick   = () => { ctx2.clearRect(0,0,c2.width,c2.height); hasMark2=false; };
                    document.getElementById('sigCancelBtn').onclick  = () => close(null);
                    document.getElementById('sigConfirmBtn').onclick = () => {
                        if (!hasMark2) { alert('Please draw your signature first.'); return; }
                        close(c2.toDataURL('image/png'));
                    };
                });

  h1{color:#285B3C;font-size:20px;margin:0;}
  table{width:100%;border-collapse:collapse;margin-top:16px;}
  th{background:#285B3C;color:#fff;padding:10px 12px;text-align:left;font-size:12px;}
  td{padding:9px 12px;border-bottom:1px solid #ddd;vertical-align:top;}
  tfoot td{background:#E8F5E9;font-weight:700;}
  .label{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .value{font-weight:600;font-size:13px;}
  .sig-grid{margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;}
</style></head><body>
<button class="no-print" onclick="window.print()" style="margin-bottom:20px;padding:10px 24px;background:#285B3C;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;">🖨 Print / Save as PDF</button>
<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #285B3C;padding-bottom:16px;margin-bottom:24px;">
  <div style="display:flex;align-items:center;gap:14px;">
    <img src="RAHAMA Empowerment Logo Design (3).png" alt="RAHAMA Logo" style="width:64px;height:64px;object-fit:contain;" onerror="this.style.display='none'">
    <div>
      <h1>GOODS / SERVICES RECEIVING REPORT</h1>
      <div style="font-size:12px;color:#555;margin-top:4px;">RAHAMA Girl Child &amp; Women Empowerment Initiative</div>
    </div>
  </div>
  <div style="text-align:right;">
    <div class="label">GRR Number</div><div class="value" style="font-size:16px;color:#285B3C;">${grrNum}</div>
    <div class="label" style="margin-top:8px;">Date</div>
    <div class="value">${new Date(cn.grrGeneratedAt||Date.now()).toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'})}</div>
    <div class="label" style="margin-top:8px;">PO Ref</div>
    <div class="value">${cn.poNumber||'N/A'}</div>
  </div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;padding:16px;background:#f9f9f9;border:1px solid #ddd;border-radius:6px;">
  <div><div class="label">Concept Note / Activity</div><div class="value">${cn.activityTitle}</div></div>
  <div><div class="label">Project Code</div><div class="value">${cn.projectCode}</div></div>
  <div><div class="label">CN Ref</div><div class="value">${refNumber}</div></div>
  <div><div class="label">Staff / Requester</div><div class="value">${cn.staffName}</div></div>
</div>
<table>
  <thead><tr><th>Item / Service Description</th><th>Vendor &amp; Phone</th><th>Invoice No.</th><th>Qty Ordered</th><th>Qty Received</th><th style="text-align:right;">Cost (₦)</th><th>Condition</th></tr></thead>
  <tbody>${vRows}</tbody>
  <tfoot><tr><td colspan="5" style="text-align:right;">${_gv2?'Received from this Vendor':'Total Received'}</td><td style="text-align:right;">₦${vTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td></td></tr>
  ${_gv2?`<tr><td colspan="5" style="text-align:right;color:#285B3C;">Grand Total (All Vendors — CN ${refNumber})</td><td style="text-align:right;color:#285B3C;">₦${totalAmt.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td></td></tr>`:''}</tfoot>
</table>
<div class="sig-grid">
  ${_sigBox('1. Received By (Procurement)', procSig)}
  ${_sigBox('2. Verified By (Programme Staff)', staffSig)}
  ${_sigBox('3. Vendor — ' + (_gv2 ? _gv2.name : 'Representative'), vVendorSig)}
  ${_sigBox('4. Finance Confirmation', finSig)}
</div>
<div style="margin-top:40px;font-size:11px;color:#aaa;border-top:1px solid #eee;padding-top:12px;">
  Generated by RAHAMA Financial Management System · GRR Ref: ${vGrrNum}${_gv2?` · Document ${gi+1} of ${_grrDocs.length}`:''} · CN Ref: ${refNumber} · PO Ref: ${cn.poNumber||'N/A'}
  ${allSigs.length > 0 ? ' · <strong style="color:#285B3C;">✓ Digitally signed</strong>' : ' · <em>Pending signatures</em>'}
</div>
</body></html>`;
                    const w = window.open('', '_blank', 'width=1000,height=780');
                    if (w) { w.document.write(html); w.document.close(); }

                    // Slight delay between windows so browsers don't suppress them
                    if (gi < _grrDocs.length - 1) {
                        await new Promise(r => setTimeout(r, 500));
                    }
                }
            },

            // ══════════════════════════════════════════════════════════════
            // SIGNING VIEW (post-procurement PO signing)
            // ══════════════════════════════════════════════════════════════
            // showSigningView — handles multi-step signing chain for PO and GRR
            // pageContext values: 'procurement_received' | 'staff_po' | 'staff_grr_verify' | 'budget_owner_po' | 'finance_sign'
            async showSigningView(docRef, docType, paymentRef, pageContext, cnRef) {
                // Resolve concept note
                let cn = null;
                if (cnRef) {
                    cn = this.data.conceptNotes.find(c => c.refNumber === cnRef);
                }
                if (!cn) {
                    const pay = this.data.payments.find(p => p.refNumber === paymentRef);
                    if (pay) cn = this.data.conceptNotes.find(c => c.refNumber === pay.conceptNoteRef);
                }

                const roleLabels = {
                    'security_clearance':   'Security Clearance Officer',
                    'procurement_received': 'Received By (Procurement)',
                    'staff_po':             'Staff Authorisation (Requester)',
                    'staff_grr_verify':     'Verified By Programme Staff',
                    'budget_owner_po':      'Budget Owner Authorisation',
                    'finance_sign':         'Finance Confirmation'
                };

                const title = docType === 'purchase_order'
                    ? `Sign Purchase Order — ${roleLabels[pageContext] || 'Sign'}`
                    : `Sign GRR — ${roleLabels[pageContext] || 'Sign'}`;

                const declaration = docType === 'purchase_order'
                    ? `I, ${this.currentUser}, confirm that Purchase Order ${docRef} is accurate, the procurement was duly authorised, and the details therein are correct.`
                    : `I, ${this.currentUser}, confirm that the goods/services described in GRR ${docRef} were ${pageContext === 'procurement_received' ? 'received by RAHAMA procurement' : pageContext === 'staff_grr_verify' ? 'verified by programme staff and match what was requested' : 'confirmed as received and complete'}.`;

                const sigData = await this._showSignaturePad(title, declaration);
                if (!sigData) { this.showView('approvals'); return; }

                try {
                    const resolvedCnRef = cnRef || cn?.refNumber || paymentRef;
                    await supabaseClient.from('document_signatures').insert([{
                        docRef, docType, relatedRef: resolvedCnRef,
                        signerName: this.currentUser,
                        signerRole: this.data.roles[this.currentUser] || 'unknown',
                        signatureData: sigData,
                        signedAt: new Date().toISOString(),
                        pageContext: pageContext || 'sign'
                    }]);
                    const sigLabel = {'procurement_received':'Received by Procurement','staff_po':'Staff signed PO','staff_grr_verify':'Programme Staff verified GRR','budget_owner_po':'Budget Owner/ED authorised PO','finance_sign':'Finance confirmed'}[pageContext] || pageContext;
                    await this._logAudit('document_signatures', docRef, 'signed',
                        `${sigLabel} — ${docType === 'purchase_order' ? 'Purchase Order' : 'GRR'} ${docRef}. Signed by ${this.currentUser}. CN Ref: ${resolvedCnRef}.`);;

                    // ── SIGNING CHAIN LOGIC ──────────────────────────────────
                    // GRR Step 1: Procurement received → notify staff to verify
                    if (pageContext === 'procurement_received') {
                        if (cn) {
                            await this.createNotification(cn.staffName,
                                `GRR ${docRef} has been signed by Procurement (received). Please open concept note ${cn.refNumber} to verify goods/services received and sign the GRR.`,
                                'info', cn.refNumber);
                        }
                        alert('GRR signed (Procurement received). Staff has been notified to verify and sign.');
                        // Notify staff to sign PO too
                        if (cn) {
                            await this.createNotification(cn.staffName,
                                `Purchase Order ${cn.poNumber || docRef.replace('GRR','PO')} for ${cn.refNumber} is awaiting your signature. Please open the concept note to sign.`,
                                'info', cn.refNumber);
                        }
                        this.showView('approvals');
                        return;
                    }

                    // PO Step 1: Staff signs PO → notify Budget Owner (or ED if BO was the submitter)
                    if (pageContext === 'staff_po') {
                        const cnStaffRole = cn ? (this.data.roles[cn.staffName] || 'staff') : 'staff';
                        if (cnStaffRole === 'budgetOwner') {
                            // BO submitted this CN — ED must authorise the PO
                            const edUsers = Object.entries(this.data.roles)
                                .filter(([,r]) => r === 'ed').map(([u]) => u);
                            for (const ed of edUsers) {
                                await this.createNotification(ed,
                                    `Purchase Order ${docRef} has been signed by staff and is awaiting your authorisation (submitted by Budget Owner). Please open concept note ${cn ? cn.refNumber : ''} to sign.`,
                                    'info', cn ? cn.refNumber : paymentRef);
                            }
                            alert('PO signed. ED has been notified to authorise (Budget Owner submitted this CN).');
                        } else {
                            const boUsers = Object.entries(this.data.roles)
                                .filter(([,r]) => r === 'budgetOwner').map(([u]) => u);
                            for (const bo of boUsers) {
                                await this.createNotification(bo,
                                    `Purchase Order ${docRef} has been signed by staff (${this.currentUser}) and is awaiting your authorisation. Please open concept note ${cn ? cn.refNumber : ''} to sign.`,
                                    'info', cn ? cn.refNumber : paymentRef);
                            }
                            alert('PO signed. Budget Owner has been notified to authorise.');
                        }
                        this.showView('approvals');
                        return;
                    }

                    // GRR Step 2: Staff verifies GRR → prompt vendor signing
                    if (pageContext === 'staff_grr_verify') {
                        alert('GRR verified by staff. Vendor signing is the next step — use the "Vendor Sign GRR" button to get vendor signature.');
                        this.showView('approvals');
                        return;
                    }

                    // Budget Owner signs PO → notify Finance
                    if (pageContext === 'budget_owner_po') {
                        const finUsers = Object.entries(this.data.roles)
                            .filter(([,r]) => r === 'finance').map(([u]) => u);
                        for (const fin of finUsers) {
                            await this.createNotification(fin,
                                `Purchase Order ${docRef} has been fully signed (Staff + Budget Owner) for concept note ${cn ? cn.refNumber : ''}. Payment of ₦${cn ? Number(cn.actualProcurementCost || cn.estimatedCost).toLocaleString() : ''} is awaiting Finance processing.`,
                                'info', cn ? cn.refNumber : paymentRef);
                        }
                        alert('PO fully signed. Finance has been notified for payment processing.');
                        this.showView('approvals');
                        return;
                    }

                    // Default fallback
                    alert('Document signed successfully.');
                    this.showView('approvals');

                } catch(e) { alert('Signing error: ' + e.message); }
            },

            // Staff signs PO (requester authorisation)
            async _staffSignPO(cnRef) {
                // Fetch fresh from DB — local cache may not have procurement-created CNs
                let cn = this.data.conceptNotes.find(c => c.refNumber === cnRef);
                if (!cn) {
                    const { data } = await supabaseClient.from('concept_notes').select('*').eq('refNumber', cnRef).single();
                    if (!data) { alert('Concept note not found.'); return; }
                    cn = data; this.data.conceptNotes.push(cn);
                }
                if (!cn.poNumber) { alert('PO has not been generated yet — procurement must complete the form first.'); return; }
                // Check if already signed by this user
                const { data: existing } = await supabaseClient.from('document_signatures')
                    .select('id').eq('docRef', cn.poNumber).eq('signerName', this.currentUser).eq('pageContext', 'staff_po');
                if (existing && existing.length > 0) { alert('You have already signed this Purchase Order.'); return; }
                // Find payment via DB — procurement-created payments use original staffName so they may not be in local cache
                let pay = this.data.payments.find(p => p.conceptNoteRef === cnRef);
                if (!pay) {
                    const { data: payDb } = await supabaseClient.from('payments').select('refNumber').eq('conceptNoteRef', cnRef).limit(1);
                    pay = payDb && payDb[0];
                }
                await this.showSigningView(cn.poNumber, 'purchase_order', pay?.refNumber || cnRef, 'staff_po', cnRef);
            },

            _onLimitedMarketToggle(on) {
                const box = document.getElementById('qaLimitedMarketBox');
                if (box) box.style.display = on ? '' : 'none';
            },

            // Procurement declares a limited market up front, rather than
            // discovering the option only after the three-quote rule blocks them.
            async requestQuoteException(refNumber) {
                const why = (document.getElementById('qaLimitedMarketReason')?.value || '').trim();
                if (why.length < 25) {
                    alert('Please explain how many providers exist and why the others aren\'t viable.\n\nThis bypasses a procurement control, so the Budget Owner needs enough to decide on.');
                    return;
                }
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber);
                if (!cn) { alert('Concept note not found.'); return; }
                if (!confirm(`Send this to the Budget Owner for approval?\n\n"${why}"\n\nThe PO can't be raised until they approve it.`)) return;
                try {
                    const now = new Date().toISOString();
                    const { error } = await supabaseClient.from('concept_notes').update({
                        quoteExceptionReason: why,
                        quoteExceptionRequestedBy: this.currentUser,
                        quoteExceptionRequestedAt: now,
                        quoteExceptionStatus: 'pending'
                    }).eq('refNumber', refNumber);
                    if (error) throw error;
                    await this._logAudit('concept_notes', refNumber, 'quote_exception_requested',
                        `${this.currentUser} declared a limited market for ${cn.activityTitle}. Reason: ${why}`);
                    const bos = Object.entries(this.data.roles).filter(([,r]) => r === 'budgetOwner').map(([n]) => n);
                    for (const bo of bos) {
                        await this.createNotification(bo,
                            `Procurement has requested a 3-quote exception on ${refNumber} (${cn.activityTitle}) — limited market. Approve or decline it from your Approvals screen.`,
                            'warning', refNumber);
                    }
                    const li = this.data.conceptNotes.findIndex(x => x.refNumber === refNumber);
                    if (li !== -1) Object.assign(this.data.conceptNotes[li], { quoteExceptionStatus: 'pending', quoteExceptionReason: why, quoteExceptionRequestedBy: this.currentUser });
                    this.clearCache();
                    alert('Sent to the Budget Owner.\n\nYou can still enter the quotes you do have — the PO can be raised once the exception is approved.');
                    await this.loadData();
                    this.showView('approvals');
                } catch(e) { alert('Error: ' + e.message); }
            },

            // Budget Owner decides on a 3-quote exception. Procurement can't
            // self-certify a control bypass.
            async resolveQuoteException(refNumber, approve) {
                if (this.getUserRole() !== 'budgetOwner') { alert('Only the Budget Owner can decide this.'); return; }
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber)
                        || (await supabaseClient.from('concept_notes').select('*').eq('refNumber', refNumber).single()).data;
                if (!cn) { alert('Concept note not found.'); return; }
                const now = new Date().toISOString();
                if (approve) {
                    const sig = await this._showSignaturePad('Approve 3-Quote Exception',
                        `I, ${this.currentUser}, accept that fewer than 3 quotes could be obtained for ${refNumber}, for the reason stated by Procurement.`);
                    if (!sig) return;
                    await supabaseClient.from('concept_notes').update({
                        quoteExceptionStatus: 'approved',
                        quoteExceptionApprovedBy: this.currentUser,
                        quoteExceptionApprovedAt: now
                    }).eq('refNumber', refNumber);
                    await supabaseClient.from('document_signatures').insert([{
                        docRef: refNumber, docType: 'quote_exception', relatedRef: refNumber,
                        signerName: this.currentUser, signerRole: 'budgetOwner',
                        signatureData: sig, signedAt: now, pageContext: 'quote_exception'
                    }]);
                    await this._logAudit('concept_notes', refNumber, 'quote_exception_approved',
                        `3-quote exception approved by ${this.currentUser}.`);
                    const procs = Object.entries(this.data.roles).filter(([,r]) => r === 'procurement').map(([n]) => n);
                    for (const p of procs) await this.createNotification(p,
                        `Your 3-quote exception for ${refNumber} was approved. You can now raise the PO.`, 'success', refNumber);
                    alert('Exception approved. Procurement can now raise the PO.');
                } else {
                    const why = prompt('Why is the exception being declined?');
                    if (why === null) return;
                    if (!why.trim()) { alert('A reason is required.'); return; }
                    await supabaseClient.from('concept_notes').update({
                        quoteExceptionStatus: 'declined',
                        quoteExceptionApprovedBy: this.currentUser,
                        quoteExceptionApprovedAt: now,
                        quoteExceptionDeclineReason: why.trim()
                    }).eq('refNumber', refNumber);
                    await this._logAudit('concept_notes', refNumber, 'quote_exception_declined',
                        `Declined by ${this.currentUser}. Reason: ${why.trim()}`);
                    const procs = Object.entries(this.data.roles).filter(([,r]) => r === 'procurement').map(([n]) => n);
                    for (const p of procs) await this.createNotification(p,
                        `Your 3-quote exception for ${refNumber} was declined: ${why.trim()}`, 'error', refNumber);
                    alert('Exception declined.');
                }
                this.clearCache();
                await this.loadData();
                this.showView('approvals');
            },

            // ── PO amendment ──────────────────────────────────────────────
            // A PO is editable only until the first signature. Once anyone has
            // signed, the document is an accepted agreement and must not change
            // underneath them — corrections go through Cancel & Reissue instead.
            _poRefs(cn) {
                if (!cn || !cn.poNumber) return [];
                let vendors = [];
                try { if (cn.vendorsJson) vendors = JSON.parse(cn.vendorsJson); } catch(e) {}
                return vendors.length > 1
                    ? [cn.poNumber, ...vendors.map((_,i) => cn.poNumber + '-V' + (i+1))]
                    : [cn.poNumber];
            },
            async _poSignatureCount(cn) {
                const refs = this._poRefs(cn);
                if (!refs.length) return 0;
                const { data } = await supabaseClient.from('document_signatures')
                    .select('id').in('docRef', refs);
                return (data || []).length;
            },
            // A PO is only locked once a SECOND party has signed. Procurement's own
            // signature doesn't lock the document they raised — it's re-taken when
            // they amend it — but staff, budget owner, vendor or finance signing
            // makes it an agreed document that must not change underneath them.
            async _poExternalSignatures(cn) {
                const refs = this._poRefs(cn);
                if (!refs.length) return [];
                const { data } = await supabaseClient.from('document_signatures')
                    .select('id,pageContext,signerName').in('docRef', refs);
                return (data || []).filter(s => s.pageContext !== 'procurement_po');
            },

            async editPO(refNumber) {
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber);
                if (!cn) { alert('Concept note not found.'); return; }
                if (!cn.poNumber) { alert('No PO has been raised yet.'); return; }
                const ext = await this._poExternalSignatures(cn);
                if (ext.length > 0) {
                    const who = [...new Set(ext.map(s => s.signerName).filter(Boolean))].join(', ');
                    alert(`This Purchase Order has been signed by ${who || 'another party'} and can no longer be edited.\n\nChanging it now would mean they appear to have agreed to terms they never saw.\n\nUse "Cancel & Reissue PO" instead.`);
                    return;
                }
                app._poEditMode = true;
                this.showPOCreationForm(refNumber);
            },

            async cancelAndReissuePO(refNumber) {
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber);
                if (!cn) { alert('Concept note not found.'); return; }
                if (!cn.poNumber) { alert('No PO to cancel.'); return; }
                const n = await this._poSignatureCount(cn);
                const reason = prompt(
                    `Cancel Purchase Order ${cn.poNumber}?\n\n` +
                    (n > 0 ? `⚠️ This PO carries ${n} signature${n!==1?'s':''}. Cancelling voids it — everyone must sign the replacement.\n\n` : '') +
                    `The cancelled PO stays in the audit trail.\n\nReason for cancellation:`);
                if (reason === null) return;
                if (!reason.trim()) { alert('A reason is required.'); return; }
                try {
                    const now = new Date().toISOString();
                    await this._logAudit('concept_notes', refNumber, 'po_cancelled',
                        `PO ${cn.poNumber} cancelled by ${this.currentUser}${n>0?` (voiding ${n} signature(s))`:''}. Reason: ${reason.trim()}`);
                    const { error } = await supabaseClient.from('concept_notes').update({
                        poNumber: null, poGeneratedAt: null,
                        poCancelledNumber: cn.poNumber, poCancelledAt: now,
                        poCancelledBy: this.currentUser, poCancelReason: reason.trim()
                    }).eq('refNumber', refNumber);
                    if (error) throw error;
                    const i = this.data.conceptNotes.findIndex(x => x.refNumber === refNumber);
                    if (i !== -1) Object.assign(this.data.conceptNotes[i], { poNumber: null, poGeneratedAt: null });
                    this.clearCache();
                    alert(`PO ${cn.poNumber} cancelled.\n\nRaise a replacement from the Approvals screen.`);
                    this.showView('approvals');
                } catch(e) { alert('Error cancelling PO: ' + e.message); }
            },

            // Procurement confirms receipt on the GRR.
            // This normally happens automatically at the end of receipt confirmation,
            // but if that signing view was closed there was previously no way back —
            // the GRR would sit unsigned permanently.
            async _procurementSignGRR(cnRef) {
                let cn = this.data.conceptNotes.find(c => c.refNumber === cnRef);
                if (!cn) {
                    const { data } = await supabaseClient.from('concept_notes').select('*').eq('refNumber', cnRef).single();
                    if (!data) { alert('Concept note not found.'); return; }
                    cn = data; this.data.conceptNotes.push(cn);
                }
                if (!cn.grrNumber) { alert('GRR has not been generated yet. Confirm receipt first.'); return; }
                const { data: existing } = await supabaseClient.from('document_signatures')
                    .select('id').eq('relatedRef', cnRef).eq('pageContext', 'procurement_received');
                if (existing && existing.length > 0) { alert('Receipt has already been signed for on this GRR.'); return; }
                let pay = this.data.payments.find(p => p.conceptNoteRef === cnRef);
                if (!pay) {
                    const { data: payDb } = await supabaseClient.from('payments').select('refNumber').eq('conceptNoteRef', cnRef).limit(1);
                    pay = payDb && payDb[0];
                }
                await this.showSigningView(cn.grrNumber, 'grr', pay?.refNumber || cnRef, 'procurement_received', cnRef);
            },

            // Procurement signs the PO they raised.
            async _procurementSignPO(cnRef) {
                let cn = this.data.conceptNotes.find(c => c.refNumber === cnRef);
                if (!cn) {
                    const { data } = await supabaseClient.from('concept_notes').select('*').eq('refNumber', cnRef).single();
                    if (!data) { alert('Concept note not found.'); return; }
                    cn = data; this.data.conceptNotes.push(cn);
                }
                if (!cn.poNumber) { alert('PO has not been generated yet.'); return; }
                const { data: existing } = await supabaseClient.from('document_signatures')
                    .select('id').eq('docRef', cn.poNumber).eq('signerName', this.currentUser).eq('pageContext', 'procurement_po');
                if (existing && existing.length > 0) { alert('You have already signed this Purchase Order.'); return; }
                await this.showSigningView(cn.poNumber, 'purchase_order', cnRef, 'procurement_po', cnRef);
            },

            // Finance confirms the PO at commitment stage.
            // Previously Finance only signed a PO implicitly when authorising the
            // payment — but under PO-first there is no payment until goods are
            // received, so the Finance slot sat empty for the whole procurement.
            async _financeSignPO(cnRef) {
                let cn = this.data.conceptNotes.find(c => c.refNumber === cnRef);
                if (!cn) {
                    const { data } = await supabaseClient.from('concept_notes').select('*').eq('refNumber', cnRef).single();
                    if (!data) { alert('Concept note not found.'); return; }
                    cn = data; this.data.conceptNotes.push(cn);
                }
                if (!cn.poNumber) { alert('PO has not been generated yet.'); return; }
                const { data: existing } = await supabaseClient.from('document_signatures')
                    .select('id').eq('docRef', cn.poNumber).eq('signerName', this.currentUser).eq('pageContext', 'finance_sign');
                if (existing && existing.length > 0) { alert('You have already confirmed this Purchase Order.'); return; }
                let pay = this.data.payments.find(p => p.conceptNoteRef === cnRef);
                if (!pay) {
                    const { data: payDb } = await supabaseClient.from('payments').select('refNumber').eq('conceptNoteRef', cnRef).limit(1);
                    pay = payDb && payDb[0];
                }
                await this.showSigningView(cn.poNumber, 'purchase_order', pay?.refNumber || cnRef, 'finance_sign', cnRef);

            async _boSignPO(cnRef) {
                let cn = this.data.conceptNotes.find(c => c.refNumber === cnRef);

                    if (!data) { alert('Concept note not found.'); return; }

                if (!cn.poNumber) { alert('PO not generated yet.'); return; }
                const myRole = this.getUserRole();
                if (myRole !== 'budgetOwner' && myRole !== 'ed') { alert('Only Budget Owner or ED can authorise the PO.'); return; }
                // BO cannot self-authorise a CN they submitted (those go to ED anyway, but guard it)
                if (myRole === 'budgetOwner' && cn.staffName === this.currentUser) { alert('You cannot authorise a PO for a concept note you submitted.'); return; }
                // Check if PO already has a BO/ED authorisation
                const { data: existing } = await supabaseClient.from('document_signatures')
                    .select('id,signerName').eq('docRef', cn.poNumber).eq('pageContext', 'budget_owner_po');
                if (existing && existing.length > 0) { alert(`This PO has already been authorised by ${existing[0].signerName}.`); return; }
                let pay = this.data.payments.find(p => p.conceptNoteRef === cnRef);
                if (!pay) {
                    const { data: payDb } = await supabaseClient.from('payments').select('refNumber').eq('conceptNoteRef', cnRef).limit(1);
                    pay = payDb && payDb[0];
                }
                await this.showSigningView(cn.poNumber, 'purchase_order', pay?.refNumber || cnRef, 'budget_owner_po', cnRef);
            },

            async resolveVarianceEscalation(refNumber, action) {
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber)
                    || (await supabaseClient.from('concept_notes').select('*').eq('refNumber', refNumber).single()).data;
                if (!cn) { alert('Concept note not found.'); return; }

                const over = cn.estimatedCost > 0
                    ? (((cn.actualProcurementCost - cn.estimatedCost) / cn.estimatedCost) * 100).toFixed(1) : '?';

                if (action === 'approve') {
                    // Require BO signature before approving excess
                    const sigData = await this._showSignaturePad(
                        'Approve Variance Excess',
                        `I, ${this.currentUser}, approve the cost increase of ${over}% for ${refNumber} (₦${Number(cn.estimatedCost).toLocaleString()} → ₦${Number(cn.actualProcurementCost).toLocaleString()}).`
                    );
                    if (!sigData) return;

                    try {
                        // PO-first flow: approving the variance unlocks PO generation only.
                        // No payment is created here — nothing has been purchased/received yet.
                        const projCode  = (cn.projectCode || 'GEN').replace(/[^A-Z0-9]/gi,'').toUpperCase();
                        const yearMonth = new Date().toISOString().slice(0,7).replace('-','');
                        const serial    = Date.now().toString().slice(-5);
                        const poNumber  = cn.poNumber || `PO-${projCode}-${yearMonth}-${serial}`;
                        const now       = new Date().toISOString();

                        await supabaseClient.from('concept_notes').update({
                            status: 'pending',
                            currentApprover: 'procurement',
                            poNumber, poGeneratedAt: cn.poGeneratedAt || now,
                            varianceApprovedBy: this.currentUser,
                            varianceApprovedAt: now,
                            varianceApprovalSignature: sigData
                        }).eq('refNumber', refNumber);

                        await this.createNotification(cn.staffName,
                            `Your concept note ${refNumber} (${cn.activityTitle}) had its cost variance approved by the Budget Owner. PO ${poNumber} has been generated and is ready for your signature.`,
                            'info', refNumber);
                        const procUsers = Object.entries(this.data.roles).filter(([,r]) => r === 'procurement').map(([n]) => n);
                        for (const p of procUsers) {
                            await this.createNotification(p,
                                `Variance approved for ${refNumber}. PO ${poNumber} is ready — preview/share it with the vendor(s), then confirm receipt once goods arrive.`,
                                'success', refNumber);
                        }

                        await supabaseClient.from('document_signatures').insert([{
                            docRef: refNumber, docType: 'variance_approval', relatedRef: refNumber,
                            signerName: this.currentUser, signerRole: this.getUserRole(),
                            signatureData: sigData, signedAt: now,
                            pageContext: 'variance_escalation_approval'
                        }]);

                        await this._logAudit('concept_notes', refNumber, 'variance_approved',
                            `${over}% variance approved by ${this.currentUser}. PO ${poNumber} generated. No payment created yet — pending receipt confirmation.`);
                        this.clearCache();
                        alert(`✅ Variance approved.\n\nPO ${poNumber} has been generated. You can now preview/share it with the vendor(s). No payment is created until receipt is confirmed.`);
                        this.showView('approvals');
                    } catch(e) { alert('Error: ' + e.message); }

                } else {
                    // Reject — send back to procurement with reason
                    const reason = prompt(
                        `Reject variance for ${refNumber}?\n\n` +
                        `Procurement will be sent back to re-source at or within the original estimate of ₦${Number(cn.estimatedCost).toLocaleString()}.\n\n` +
                        `Enter rejection reason for procurement:`
                    );
                    if (reason === null) return;
                    if (!reason.trim()) { alert('Please provide a rejection reason.'); return; }

                    try {
                        await supabaseClient.from('concept_notes').update({
                            status: 'variance_rejected',
                            currentApprover: 'procurement',
                            rejectionReason: reason.trim(),
                            rejectedBy: this.currentUser,
                            rejectedDate: new Date().toISOString()
                        }).eq('refNumber', refNumber);

                        await this._logAudit('concept_notes', refNumber, 'variance_rejected',
                            `Rejected by ${this.currentUser}. Reason: ${reason.trim()}`);
                        this.clearCache();
                        alert(`Variance rejected. Procurement has been notified to re-source within the original budget.`);
                        this.showView('approvals');
                    } catch(e) { alert('Error: ' + e.message); }
                }
            },

                const code     = document.getElementById('pCode')?.value?.trim().toUpperCase();

                const active   = document.getElementById('pActive')?.checked !== false;
                if (!code || !name || !budget) { alert('Code, Name and Budget are required.'); return; }
                const payload  = { code, name, budget, budgetLimit_bo: boLimit, donor, endDate, active };
                try {
                    if (existingCode) {
                        const { error } = await supabaseClient.from('projects').update(payload).eq('code', existingCode);
                        if (error) throw error;
                        const idx = this.data.projects.findIndex(p => p.code === existingCode);
                        if (idx >= 0) this.data.projects[idx] = { ...this.data.projects[idx], ...payload };
                    } else {
                        const { error } = await supabaseClient.from('projects').insert([{ ...payload, createdBy: this.currentUser, createdAt: new Date().toISOString() }]);
                        if (error) throw error;
                        this.data.projects.push(payload);
                    }
                    await this._logAudit('projects', code, existingCode ? 'updated' : 'created', `${existingCode?'Updated':'Created'} by ${this.currentUser}. Budget: ₦${budget.toLocaleString()}`);
                    alert(`Project ${code} ${existingCode?'updated':'created'} successfully!`);
                    this.showView('superAdmin');

            async _sendOverdueRetirementReminders() {
                // Called after loadData — sends in-app notifications for overdue retirements
                const myPayments = this.getMyPayments().filter(p =>
                    p.status === 'paid'
                    && (p.retirementresponsibility === 'staff' || !p.retirementresponsibility)
                    && !this.getMyRetirements().find(r => r.paymentRef === p.refNumber && r.status !== 'rejected')
                );
                const alreadyNotified = JSON.parse(localStorage.getItem('_remindedRefs')||'[]');
                for (const p of myPayments) {
                    if (!p.paidDate) continue;
                    const days = Math.floor((Date.now() - new Date(p.paidDate)) / 864e5);
                    const key = p.refNumber + '_' + days;
                    if ([3,5,7,14,30].includes(days) && !alreadyNotified.includes(key)) {
                        await this.createNotification(
                            this.currentUser,
                            `Reminder: Payment ${p.refNumber} (₦${Number(p.amount).toLocaleString()}) was made ${days} days ago and has not been retired yet.${days >= 7 ? ' ⚠️ OVERDUE — please retire immediately.' : ''}`,
                            days >= 7 ? 'danger' : 'warning',
                            p.refNumber
                        );
                        alreadyNotified.push(key);
                    }
                }
                localStorage.setItem('_remindedRefs', JSON.stringify(alreadyNotified.slice(-100)));
            },

                let visible   = 0;
                document.querySelectorAll('.'+cls).forEach(row => {
                    const search    = row.dataset.search||'';
                    const date      = row.dataset.date||'';
                    const rowStatus = row.dataset.status||row.dataset.action||'';
                    const rowProj   = row.dataset.project||'';
                    const show = (!q       || search.includes(q))
                              && (!from    || date >= from)
                              && (!to      || date <= to)
                              && (!status  || rowStatus.includes(status))
                              && (!project || rowProj === project);
                    row.style.display = show ? '' : 'none';
                    if (show) visible++;
                });
                if (countEl) countEl.textContent = `Showing ${visible} record${visible===1?'':'s'}`;
            },

            _exportAuditCSV(prefix) {
                let rows, filename, headers;
                if (prefix === 'act') {
                    rows = (this._auditData||[]).filter(r => {
                        const el = document.querySelector('._actRow[style=""]') || document.querySelector('._actRow:not([style*="none"])');
                        return true; // export all filtered visible
                    });
                    // Re-filter by visible rows
                    const visibleRefs = new Set([...document.querySelectorAll('._actRow')].filter(r=>r.style.display!=='none').map(r=>r.dataset.search?.split(' ')[0]));
                    rows = (this._auditData||[]);
                    headers = ['When','Record Type','Ref','Action','Details','By'];
                    const csv = [headers, ...rows.map(r => [new Date(r.changedAt).toLocaleString('en-NG'),r.tableName||'',r.refNumber||'',r.action||'',`"${(r.details||'').replace(/"/g,'""')}"`,r.changedBy||''])].map(r=>r.join(',')).join('\n');
                    filename = 'audit_activity.csv';
                    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = filename; a.click(); return;
                }
                if (prefix === 'pay') {
                    rows = [...document.querySelectorAll('._payRow')].filter(r=>r.style.display!=='none');
                    const allPay = this._auditPayments||[];
                    const visibleRefs = new Set(rows.map(r=>r.dataset.search?.split(' ')[0]));
                    const data = allPay.filter(p=>visibleRefs.has(p.refNumber?.toLowerCase()));
                    headers = ['Payment Ref','CN Ref','Staff','Project','Amount','Account Name','Account No','Bank','Status','Paid Date','Processed By'];
                    const csv = [headers, ...data.map(p=>[p.refNumber,p.conceptNoteRef||'',p.staffName,p.projectCode||'',p.amount,`"${p.accountName||''}"`,p.accountNumber||'',`"${p.bankName||''}"`,p.status,p.paidDate||'',p.processedBy||''])].map(r=>r.join(',')).join('\n');
                    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'payments_ledger.csv'; a.click(); return;
                }
                if (prefix === 'ret') {
                    const allRet = this._auditRetirements||[];
                    const allPay = this._auditPayments||[];
                    headers = ['Retirement Ref','Payment Ref','CN Ref','Staff','Advance','Spent','Returned','Variance','Status','Approved Date','Approved By','Rejection Reason'];
                    const csv = [headers, ...allRet.map(r=>{
                        const pay = allPay.find(p=>p.refNumber===r.paymentRef);
                        const advance = pay?.amount||0;
                        const variance = (r.actualSpent||0)-advance;
                        return [r.refNumber,r.paymentRef||'',pay?.conceptNoteRef||'',r.staffName,advance,r.actualSpent||0,r.amountReturned||0,variance,r.status,r.approvedDate||'',r.approvedBy||'',`"${r.rejectionReason||''}"`];
                    })].map(r=>r.join(',')).join('\n');
                    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'retirements_ledger.csv'; a.click(); return;
                }
            },

            _renderAuditRows(rows) { this._renderAuditActivity(document.getElementById('auditTabContent')); },
            _filterAudit() { this._applyAuditFilter('act'); },

            async _logAudit(table, refNumber, action, details) {
                try {
                    const { error } = await supabaseClient.from('audit_log').insert([{
                        tableName: table,
                        refNumber,
                        action,
                        details,
                        changedBy: this.currentUser,
                        changedAt: new Date().toISOString()
                    }]);
                    if (error) console.warn('Audit log write failed:', error.message);
                } catch(e) {
                    console.warn('Audit log write failed:', e.message);
                }
            },

            async createNotification(recipientName, message, type, refNumber) {
                await supabaseClient.from('notifications').insert([{ recipientName, message, type, refNumber, isRead: false, createdAt: new Date().toISOString() }]);
            },

            _addVendorBlock() {
                app._vendorCount = (app._vendorCount || 1) + 1;
                const id = app._vendorCount;
                const s = 'width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;';
                const container = document.getElementById('vendorBlocksContainer');
                if (!container) return;
                const div = document.createElement('div');
                div.id = 'vendorBlock_' + id;
                div.style.cssText = 'background:#F0FDF4;border:1px solid #A7F3D0;border-radius:10px;padding:16px;margin-bottom:12px;';
                div.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        <strong style="color:#047857;font-size:13px;">Vendor ${id}</strong>
                        <button type="button" onclick="app._removeVendorBlock(${id})" style="background:none;border:none;color:#EF4444;cursor:pointer;font-size:13px;font-weight:600;">✕ Remove</button>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Name *</label><input type="text" id="vName_${id}" placeholder="Vendor/company name" style="${s}"></div>
                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Phone *</label><input type="text" id="vPhone_${id}" placeholder="e.g. 08012345678" style="${s}"></div>
                        <div style="grid-column:1/-1"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Goods/Services Supplied *</label><input type="text" id="vItems_${id}" placeholder="What was purchased" style="${s}"></div>
                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Invoice No.</label><input type="text" id="vInvoice_${id}" placeholder="Invoice number" style="${s}"></div>
                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Amount (₦)</label><input type="number" id="vAmount_${id}" min="0" step="0.01" placeholder="0" style="${s}" oninput="app._recalcVendorTotal()"></div>
                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Quantity Received *</label><input type="number" id="vQty_${id}" min="1" step="1" value="1" placeholder="e.g. 10" style="${s}"></div>
                        <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Quality / Condition *</label><select id="vQuality_${id}" style="${s}background:white;"><option value="Good">✅ Good</option><option value="Partial">⚠️ Partial / Minor Issues</option><option value="Poor">❌ Poor / Rejected</option></select></div>
                        <div style="grid-column:1/-1"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Address/Contact</label><textarea id="vAddress_${id}" rows="2" placeholder="Optional" style="${s}resize:vertical;min-height:60px;"></textarea></div>
                    </div>`;
                container.appendChild(div);
            },

            _removeVendorBlock(id) {
                const block = document.getElementById('vendorBlock_' + id);
                if (block) block.remove();
                app._recalcVendorTotal();
            },

            // fixed
_recalcVendorTotal() {
    let total = 0, count = 0;
    document.querySelectorAll('[id^="vAmount_"]').forEach(el => {
        const m = el.id.match(/vAmount_(\d+)/);
        if (!m) return;
        const amt = parseFloat(el.value) || 0;
        const qty = parseFloat(document.getElementById('vQty_' + m[1])?.value) || 1;
        if (amt > 0) { total += amt * qty; count++; }
    });
    const display = document.getElementById('vendorTotalDisplay');
    if (!display) return;
    if (count > 1) {
        display.style.display = 'block';
        display.textContent = `Combined total across ${count} vendors: ₦${total.toLocaleString(undefined, {minimumFractionDigits:2,maximumFractionDigits:2})}`;
    } else {
        display.style.display = 'none';
    }
},

            _collectVendors() {
                // Collect all vendor blocks currently visible in the DOM
                const vendors = [];
                document.querySelectorAll('[id^="vendorBlock_"]').forEach(block => {
                    const m = block.id.match(/vendorBlock_(\d+)/);
                    if (!m) return;
                    const id = m[1];
                    vendors.push({
                        id,
                        name:      (document.getElementById('vName_'    + id)?.value || '').trim(),
                        phone:     (document.getElementById('vPhone_'   + id)?.value || '').trim(),
                        items:     (document.getElementById('vItems_'   + id)?.value || '').trim(),
                        invoiceNo: (document.getElementById('vInvoice_' + id)?.value || '').trim(),
                        acctName:  (document.getElementById('vAcctName_' + id)?.value || '').trim(),
                        acctNo:    (document.getElementById('vAcctNo_'   + id)?.value || '').trim(),
                        bank:      (document.getElementById('vBank_'     + id)?.value || '').trim(),
                        amount:    parseFloat(document.getElementById('vAmount_'  + id)?.value) || 0,
                        qty:       parseInt(document.getElementById('vQty_'     + id)?.value)   || 1,
                        quality:   (document.getElementById('vQuality_' + id)?.value || 'Good'),
                        address:   (document.getElementById('vAddress_' + id)?.value || '').trim(),
                    });
                });
                return vendors;
            },

            async _uploadVendorInvoices(vendors) {
                const enriched = [];
                for (const v of vendors) {
                    // Vendor 1 uses procInvoiceFile (the global upload); dynamic blocks use vInvoiceFile_{id}
                    const fileInput = document.getElementById('vInvoiceFile_' + v.id)
                                   || (v.id === '1' ? document.getElementById('procInvoiceFile') : null);
                    const file = fileInput?.files[0];
                    let invoiceUrl = null, invoiceFileName = null;
                    if (file) {
                        try {
                            const d = await this.uploadFile(file, 'procurement');
                            invoiceUrl = d?.url || null;
                            invoiceFileName = d?.fileName || null;
                        } catch(e) { console.warn('Invoice upload failed for vendor', v.id, e); }
                    }
                    enriched.push({ ...v, invoiceUrl, invoiceFileName });
                }
                return enriched;
            },

            logout() {
                if (confirm('Are you sure you want to logout?')) {
                    const session = localStorage.getItem('pms_user');
                    if (session && pmsAuthClient) {
                        try {
                            const { access_token, refresh_token } = JSON.parse(session);
                            if (access_token && refresh_token) {
                                pmsAuthClient.auth.setSession({ access_token, refresh_token })
                                    .then(() => pmsAuthClient.auth.signOut())
                                    .catch(() => {});
                            }
                        } catch (e) {}
                    }
                    if (supabaseClient) { try { supabaseClient.auth.signOut(); } catch (e) {} }
                    localStorage.removeItem('pms_user');
                    window.location.href = 'https://rahamaorg.github.io/appraisal-system/';
                }
            }
        };
        
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
            // Strip commas from number inputs globally — prevents "1,000" being read as "1"
            document.addEventListener('input', (e) => {
                if (e.target.type === 'number' || e.target.dataset.numericInput) {
                    const v = e.target.value;
                    if (v.includes(',')) e.target.value = v.replace(/,/g, '');
                }
            });
            document.addEventListener('keydown', (e) => {
                if ((e.target.type === 'number' || e.target.dataset.numericInput) && e.key === ',') {
                    e.preventDefault();
                }
                if (e.altKey) {
                    switch(e.key.toLowerCase()) {
                        case 'd': e.preventDefault(); app.showView('dashboard'); break;
                        case 'c': e.preventDefault(); app.showView('conceptNote'); break;
                        case 'a': e.preventDefault(); app.showView('approvals'); break;
                        case 'p': e.preventDefault(); app.showView('payment'); break;
                        case 'r': e.preventDefault(); app.showView('retirement'); break;
                        case 't': e.preventDefault(); app.showView('auditTrail'); break;
                    }
                }
            });
        });
    </script>
</body>
</html>
