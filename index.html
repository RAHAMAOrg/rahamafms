<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahama Financial Management System</title>
    <link rel="icon" type="image/png" href="RAHAMA Empowerment Logo Design (3).png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Archivo:wght@600;700&display=swap');
        
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #10b981;
            --accent: #34d399;
            --danger: #D32F2F;
            --warning: #F57C00;
            --success: #059669;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --text: #1A1A1A;
            --text-muted: #616161;
            --border: #E0E0E0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            box-shadow: var(--shadow);
        }
        
        .logo { padding: 0 24px 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .logo h1 { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 700; color: #059669; margin-bottom: 4px; }
        .logo p { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        
        .user-info { padding: 16px 24px; background: var(--bg); margin: 0 16px 24px; border-radius: 8px; border: 1px solid var(--border); }
        .user-info label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; }
        
        .nav { list-style: none; }
        .nav button { width: 100%; padding: 12px 24px; text-align: left; background: none; border: none; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text); transition: all 0.2s; position: relative; }
        .nav button:hover { background: var(--bg); color: var(--primary); }
        .nav button.active { background: linear-gradient(90deg, rgba(0,121,107,0.1) 0%, transparent 100%); color: var(--primary); font-weight: 600; }
        .nav button.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); }
        
        .portal-link { margin: 24px 16px 0; padding: 12px; background: linear-gradient(135deg, #059669, #047857); color: white; text-align: center; border-radius: 8px; text-decoration: none; display: block; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .portal-link:hover { background: linear-gradient(135deg, #047857, #065f46); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
        
        .main { padding: 32px 48px; max-width: 1400px; }
        .header { margin-bottom: 32px; }
        .header h2 { font-family: 'Archivo', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .header p { color: var(--text-muted); font-size: 14px; }
        
        .loading-spinner { text-align: center; padding: 64px; }
        .loading-spinner i { font-size: 32px; color: #059669; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        
        .alert-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-bottom: 24px; }
        .alert-badge.warning { background: #FFF3E0; color: var(--warning); border: 1px solid #FFE0B2; }
        .alert-badge.danger { background: #FFEBEE; color: var(--danger); border: 1px solid #FFCDD2; }
        
        .form-grid { display: grid; gap: 20px; background: var(--surface); padding: 32px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .form-grid.two-col { grid-template-columns: 1fr 1fr; }
        /* Stack the two-column layout on phones — the tracking view carries the
           travel security briefing, which staff read on the road. */
        @media (max-width: 720px) {
            .form-grid.two-col { grid-template-columns: 1fr; }
            .form-grid { padding: 18px; }
        }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text); }
        .form-group label .required { color: var(--danger); }
        .form-group input, .form-group select, .form-group textarea { padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--surface); transition: all 0.2s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
        .form-group input.error, .form-group select.error, .form-group textarea.error { border-color: var(--danger); }
        .form-error { color: var(--danger); font-size: 12px; margin-top: -4px; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .form-hint { font-size: 12px; color: var(--text-muted); font-style: italic; }
        .threshold-info { padding: 16px; background: #E8F5E9; border: 1px solid #C8E6C9; border-radius: 8px; font-size: 13px; color: var(--success); font-weight: 500; }
        .threshold-info.high { background: #FFF3E0; border-color: #FFE0B2; color: var(--warning); }
        
        .file-upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .file-upload-area:hover { border-color: #059669; background: rgba(5,150,105,0.05); }
        .file-upload-area.has-file { border-color: var(--success); background: #E8F5E9; }
        
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, #059669, #047857); color: white; }
        .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #047857, #065f46); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(5,150,105,0.4); }
        .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .table-container { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--bg); }
        th { padding: 16px; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        /* Header rows painted a dark colour inline need light text — the rule above
           would otherwise leave grey-on-dark and make the headings unreadable. */
        thead tr[style*="#1B4D8E"] th, thead tr[style*="#285B3C"] th,
        thead tr[style*="#047857"] th { color: #fff; }
        td { padding: 16px; border-top: 1px solid var(--border); font-size: 14px; }
        tr:hover { background: var(--bg); }
        
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-pending { background: #FFF3E0; color: var(--warning); }
        .status-approved { background: #E8F5E9; color: var(--success); }
        .status-paid { background: #E3F2FD; color: #1976D2; }
        .status-retired { background: #F3E5F5; color: #7B1FA2; }
        .status-rejected { background: #FFEBEE; color: var(--danger); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--surface); padding: 24px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .stat-card h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; }
        .stat-value { font-size: 32px; font-weight: 700; font-family: 'Archivo', sans-serif; color: var(--text); margin-bottom: 8px; }
        .stat-label { font-size: 13px; color: var(--text-muted); }
        .stat-card.danger .stat-value { color: var(--danger); }
        .stat-card.warning .stat-value { color: var(--warning); }
        .stat-card.success .stat-value { color: var(--success); }
        
        .budget-bar { margin-top: 12px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .budget-fill { height: 100%; background: var(--primary); transition: width 0.3s; }
        .budget-fill.warning { background: var(--warning); }
        .budget-fill.danger { background: var(--danger); }
        
        .action-btn { padding: 12px 18px; background: none; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-right: 8px; min-width: 180px; }
        .action-btn:hover { background: var(--bg); }
        .action-btn.approve { border-color: var(--success); color: var(--success); }
        .action-btn.approve:hover { background: var(--success); color: white; }
        .action-btn.reject { border-color: var(--danger); color: var(--danger); }
        .action-btn.reject:hover { background: var(--danger); color: white; }
        
        .empty-state { text-align: center; padding: 64px 32px; color: var(--text-muted); }
        
        .workflow-diagram { background: var(--surface); padding: 32px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 32px; }
        .workflow-step { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; padding: 16px; background: var(--bg); border-radius: 8px; }
        .workflow-number { width: 32px; height: 32px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .workflow-content { flex: 1; }
        .workflow-content strong { display: block; margin-bottom: 4px; color: var(--text); }
        .workflow-content span { font-size: 13px; color: var(--text-muted); }
        
        .progress-tracker { background: var(--surface); padding: 24px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; }
        .progress-timeline { display: flex; justify-content: space-between; align-items: center; position: relative; margin: 32px 0; }
        .progress-timeline::before { content: ''; position: absolute; top: 20px; left: 40px; right: 40px; height: 4px; background: var(--border); z-index: 0; }
        .progress-line { position: absolute; top: 20px; left: 40px; height: 4px; background: linear-gradient(90deg, #059669, #10b981); z-index: 1; transition: width 0.5s ease; }
        .progress-step { display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; z-index: 2; flex: 1; }
        .progress-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 3px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--text-muted); transition: all 0.3s; }
        .progress-step.completed .progress-icon { background: linear-gradient(135deg, #059669, #047857); border-color: #059669; color: white; }
        .progress-step.active .progress-icon { background: #10b981; border-color: #059669; color: white; animation: pulse 2s infinite; }
        .progress-step.rejected .progress-icon { background: var(--danger); border-color: var(--danger); color: white; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(5,150,105,0.4); } 50% { box-shadow: 0 0 0 8px rgba(5,150,105,0); } }
        .progress-label { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); max-width: 100px; }
        .progress-step.completed .progress-label, .progress-step.active .progress-label { color: var(--text); }
        .progress-step.rejected .progress-label { color: var(--danger); }
        .progress-date { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
        .progress-note { background: var(--bg); padding: 12px 16px; border-radius: 8px; border-left: 4px solid #059669; margin-top: 16px; }
        .progress-note.warning { border-left-color: var(--warning); background: #FFF3E0; }
        .progress-note.danger { border-left-color: var(--danger); background: #FFEBEE; }
        
        .tracking-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; transition: all 0.2s; }
        .tracking-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
        .tracking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tracking-ref { font-weight: 700; color: #059669; }
        .tracking-amount { font-weight: 700; color: var(--text); }
    
        /* ── Signature Pad Modal ── */
        .sig-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:10000; align-items:center; justify-content:center; }
        .sig-modal-overlay.open { display:flex; }
        .sig-modal { background:#fff; border-radius:16px; padding:32px; max-width:560px; width:96%; box-shadow:0 20px 60px rgba(0,0,0,.25); }
        .sig-modal h3 { font-family:'Archivo',sans-serif; font-size:18px; margin-bottom:6px; color:var(--text); }
        .sig-modal p  { font-size:13px; color:var(--text-muted); margin-bottom:20px; }
        #sigCanvas { border:2px solid var(--border); border-radius:8px; width:100%; touch-action:none; cursor:crosshair; display:block; background:#fafafa; }
        .sig-canvas-hint { font-size:11px; color:var(--text-muted); margin-top:6px; text-align:center; }
        .sig-modal-actions { display:flex; gap:10px; margin-top:20px; }
        /* ── Audit Trail ── */
        .audit-row { display:grid; grid-template-columns:160px 120px 120px 1fr 140px; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; align-items:start; }
        .audit-row.head { background:var(--bg); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); border-radius:8px 8px 0 0; }
        .audit-action-badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:700; background:#E8F5E9; color:#1B5E20; }
        .audit-action-badge.reject  { background:#FFEBEE; color:#B71C1C; }
        .audit-action-badge.paid    { background:#E3F2FD; color:#0D47A1; }

        
        /* ── Vendor Sign Fullscreen ── */
        .vendor-sign-overlay { display:none; position:fixed; inset:0; background:#fff; z-index:20000; flex-direction:column; overflow-y:auto; }
        .vendor-sign-overlay.open { display:flex; }
        .vendor-sign-header { background:#285B3C; color:#fff; padding:20px 24px; display:flex; align-items:center; gap:16px; flex-shrink:0; }
        .vendor-sign-header h2 { font-family:'Archivo',sans-serif; font-size:18px; margin:0; }
        .vendor-sign-body { flex:1; padding:24px; max-width:680px; margin:0 auto; width:100%; }
        .vendor-items-table { width:100%; border-collapse:collapse; margin:16px 0; font-size:13px; }
        .vendor-items-table th { background:#285B3C; color:#fff; padding:10px 12px; text-align:left; }
        .vendor-items-table td { padding:9px 12px; border-bottom:1px solid #e0e0e0; }
        .vendor-items-table tr:nth-child(even) td { background:#f9f9f9; }
        .vendor-confirm-box { background:#E8F5E9; border:1px solid #A5D6A7; border-radius:10px; padding:16px 20px; margin:20px 0; font-size:13px; }
        #vendorSigCanvas { border:2px solid #285B3C; border-radius:8px; width:100%; touch-action:none; cursor:crosshair; display:block; background:#fafafa; }
        .remote-sign-modal { background:#fff; border-radius:16px; padding:28px; max-width:480px; width:96%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
        /* PO vendor sign overlay — reuses same fullscreen style as GRR */
        .po-sign-overlay { display:none; position:fixed; inset:0; background:#fff; z-index:20000; flex-direction:column; overflow-y:auto; }
        .po-sign-overlay.open { display:flex; }
        #poVendorSigCanvas { border:2px solid #1B4D8E; border-radius:8px; width:100%; touch-action:none; cursor:crosshair; display:block; background:#fafafa; }

        </style>
</head>

            async init() {
                this.loadStartTime = Date.now();
                // ── Guard: show error if Supabase CDN failed to load ──
                if (!supabaseClient) {
                    document.getElementById('mainContent').innerHTML = `
                        <div style="padding:48px;text-align:center;">
                            <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                            <h2 style="font-family:'Archivo',sans-serif;color:#D32F2F;margin-bottom:12px;">Database connection unavailable</h2>
                            <p style="color:#616161;max-width:480px;margin:0 auto;">The Supabase library could not be loaded. This usually happens in sandboxed preview environments.<br><br>Please open the file directly in your browser or deploy it to your server to use the full app.</p>
                        </div>`;
                    return;
                }
                // ── Vendor signing intercept — no login needed ──
                const _initParams = new URLSearchParams(window.location.search);
                const _vendorToken = _initParams.get('vendorSign');
                if (_vendorToken) { this._renderVendorSignPage(_vendorToken); return; }
                const _poVendorToken = _initParams.get('poVendorSign');
                if (_poVendorToken) { this._renderVendorPOSignPage(_poVendorToken); return; }
                this._setupOfflineDetection();
                this._setupSessionTimeout();
                const params = new URLSearchParams(window.location.search);
                const urlSession = params.get('session');
                if (urlSession) {
                    // A session handed over in the URL is accepted once, then the
                    // parameter is stripped from the address bar and from history.
                    // Previously such a link could be copied from a screenshot or a
                    // browser history and reused by anyone, with any name and role.
                    try {
                        const handed = JSON.parse(decodeURIComponent(urlSession));
                        if (handed && handed.name && handed.email) {
                            handed.issuedAt = Date.now();
                            localStorage.setItem('pms_user', JSON.stringify(handed));
                        }
                    } catch(e) { console.warn('Invalid session handover'); }
                    // Remove ?session= so the address bar no longer carries credentials
                    try {
                        const clean = window.location.origin + window.location.pathname + window.location.hash;
                        window.history.replaceState({}, document.title, clean);
                    } catch(e) {}
                }
                const session = localStorage.getItem('pms_user');
                if (session) {
                    let user = JSON.parse(session);
                    // The name/role/email inside this object are no longer
                    // trusted on their own — they're only accepted once the
                    // accompanying access_token is confirmed, by PMS's own
                    // Supabase Auth server, to be a real, unexpired token for
                    // that same email. A hand-edited localStorage entry (or a
                    // pre-migration session with no token at all) is rejected.
                    user = await this._establishVerifiedSession(user);
                    if (!user) {
                        localStorage.removeItem('pms_user');
                        alert('Your session could not be verified. Please sign in again through the Staff Portal.');
                        window.location.href = 'https://rahamaorg.github.io/appraisal-system/';
                        return;
                    }
                    this.currentUser = user.name;
                    // PMS verification above only proves who you are to PMS.
                    // FMS is a separate Supabase project and needs its own
                    // signed-in session before auth.uid() exists for any
                    // RLS policy to check — this establishes that session,
                    // prompting once for the password if one isn't already
                    // live (e.g. a fresh browser / after the refresh token
                    // has expired).
                    const fmsUnlocked = await this._establishFmsSession(user.email);
                    if (!fmsUnlocked) return;
                    const el = document.getElementById('loggedInUser');
                    if (el) el.innerText = user.name;
                    const role = this.getUserRole();
                    const btn = document.getElementById('reportsBtn');
                    if (!['budgetOwner','ed','procurement','finance','finance_manager','donor','reconciliation'].includes(role)) {
                        if (btn) btn.style.display = 'none';
                    }
                    const auditBtn      = document.getElementById('auditTrailBtn');
                    const superBtn      = document.getElementById('superAdminBtn');
                    const quarterlyBtn  = document.getElementById('quarterlyReportBtn');
                    const reconcBtn     = document.getElementById('reconciliationBtn');
                    const donorBtn      = document.getElementById('donorPortalBtn');
                    // BO + ED: full access
                    if (role === 'budgetOwner' || role === 'ed') {
                        [auditBtn, superBtn, quarterlyBtn].forEach(b => b && (b.style.display = ''));
                    }
                    // Finance + Finance Manager: audit + reconciliation + quarterly
                    if (role === 'finance' || role === 'finance_manager') {
                        [auditBtn, reconcBtn, quarterlyBtn].forEach(b => b && (b.style.display = ''));
                    }
                    // Reconciliation role: only reconciliation view
                    if (role === 'reconciliation') {
                        if (reconcBtn) reconcBtn.style.display = '';
                        if (btn) btn.style.display = 'none';
                    }
                    // Donor role: only donor portal
                    if (role === 'donor') {
                        if (donorBtn) donorBtn.style.display = '';
                        if (btn) btn.style.display = 'none';
                    }
                }
                this.showView('dashboard');
                this.loadData().then(() => {

                }).catch(error => console.error('Background data load error:', error));
            },
            
            _setupOfflineDetection() {
                const banner = document.createElement('div');
                banner.id = 'offlineBanner';
                banner.style.cssText = 'display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#B71C1C;color:white;text-align:center;padding:10px 16px;font-size:13px;font-weight:600;';
                banner.textContent = '⚠️ No internet connection — changes cannot be saved until you reconnect.';
                document.body.prepend(banner);
                const update = () => { banner.style.display = navigator.onLine ? 'none' : 'block'; };
                window.addEventListener('online', update);
                window.addEventListener('offline', update);
                update();
            },

            _setupSessionTimeout() {
                const TIMEOUT_MS = 60 * 60 * 1000; // 60 minutes
                let timer;
                const reset = () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        alert('Your session has expired due to inactivity. You will be logged out.');
                        this.logout();
                    }, TIMEOUT_MS);
                };
                ['mousemove','keydown','click','touchstart','scroll'].forEach(e => document.addEventListener(e, reset, { passive: true }));
                reset();
            },

            // Confirms a handed-off session by checking its access_token
            // against PMS's own Supabase Auth server, via the supabase-js
            // SDK (pmsAuthClient, a client instance pointed at PMS's
            // project). If the access token has expired, refreshes it once
            // via the refresh_token before giving up.
            //
            // Critically: only the EMAIL that comes back from getUser() is
            // trusted. name/role/id in the handed-off object are editable
            // in localStorage by anyone, token or no token, so they are
            // discarded here and re-fetched from PMS's users table keyed
            // by the verified email. A valid token for a real employee can
            // no longer be paired with a forged name to pose as someone
            // else.
            async _establishVerifiedSession(user) {
                if (!user || !user.access_token || !pmsAuthClient) return null;

                let accessToken = user.access_token;
                let refreshToken = user.refresh_token;
                let { data, error } = await pmsAuthClient.auth.getUser(accessToken);

                if ((error || !data?.user) && refreshToken) {
                    const { data: rdata, error: rerr } = await pmsAuthClient.auth.refreshSession({ refresh_token: refreshToken });
                    if (rerr || !rdata?.session) return null;
                    accessToken = rdata.session.access_token;
                    refreshToken = rdata.session.refresh_token;
                    ({ data, error } = await pmsAuthClient.auth.getUser(accessToken));
                }

                const verifiedEmail = data && data.user && data.user.email;
                if (error || !verifiedEmail) return null;

                const profile = await this._pmsProfileByEmail(verifiedEmail);
                if (!profile || !profile.name) return null;

                const verifiedUser = {
                    email: verifiedEmail, name: profile.name,
                    access_token: accessToken, refresh_token: refreshToken,
                    issuedAt: Date.now()
                };
                localStorage.setItem('pms_user', JSON.stringify(verifiedUser));
                return verifiedUser;
            },

            // The one piece of identity FMS still needs that Supabase Auth
            // itself doesn't hold: the human name PMS's own users table has
            // on file for this email. This is a DB read, not a browser
            // read — the caller passes in an email that was just proven
            // genuine by getUser() above, not anything from localStorage.
            async _pmsProfileByEmail(email) {
                try {
                    const r = await fetch(`${PMS_AUTH_URL}/rest/v1/users?email=eq.${encodeURIComponent(email.toLowerCase())}&select=name,role`, {
                        headers: { apikey: PMS_ANON_KEY, Authorization: `Bearer ${PMS_ANON_KEY}` }
                    });
                    if (!r.ok) return null;
                    const rows = await r.json();
                    return Array.isArray(rows) && rows.length ? rows[0] : null;
                } catch (e) { return null; }
            },

            // Signs `supabaseClient` (FMS's own project) into a real session
            // for this verified email. Without this, every FMS query runs
            // as the anonymous role no matter how thoroughly PMS verified
            // the person — RLS policies scoped `to authenticated` see
            // nothing until this resolves. Skips the prompt entirely if a
            // live FMS session for this exact email already exists (e.g.
            // page refresh) — the password is asked for once per session,
            // not once per page load.
            async _establishFmsSession(email) {
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session && session.user && session.user.email &&
                        session.user.email.toLowerCase() === email.toLowerCase()) {
                        return true;
                    }
                } catch (e) {}

                return new Promise((resolve) => {
                    const content = document.getElementById('mainContent');
                    const render = (errorMsg) => {
                        content.innerHTML = `
                            <div style="max-width:360px;margin:80px auto;padding:32px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);text-align:center;">
                                <div style="font-size:32px;margin-bottom:12px;">🔒</div>
                                <h2 style="font-family:'Archivo',sans-serif;margin-bottom:8px;">Confirm your password</h2>
                                <p style="color:#616161;font-size:13px;margin-bottom:20px;">Signed in to the Staff Portal as <strong>${email}</strong>. Enter your password once to unlock FMS.</p>
                                ${errorMsg ? `<p style="color:#D32F2F;font-size:13px;margin-bottom:12px;">${errorMsg}</p>` : ''}
                                <input type="password" id="_fmsPw" placeholder="Password" style="width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;" autofocus />
                                <button id="_fmsPwSubmit" class="action-btn approve" style="width:100%;margin-bottom:8px;">Unlock FMS</button>
                                <button id="_fmsPwCancel" style="width:100%;background:none;border:none;color:#616161;font-size:12px;cursor:pointer;">Not you? Return to Staff Portal</button>
                            </div>`;
                        const pwField = document.getElementById('_fmsPw');
                        document.getElementById('_fmsPwSubmit').onclick = submit;
                        pwField.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
                        document.getElementById('_fmsPwCancel').onclick = () => {
                            localStorage.removeItem('pms_user');
                            window.location.href = 'https://rahamaorg.github.io/appraisal-system/';
                        };
                        pwField.focus();
                    };
                    const submit = async () => {
                        const pwField = document.getElementById('_fmsPw');
                        const pw = pwField.value;
                        if (!pw) return;
                        const btn = document.getElementById('_fmsPwSubmit');
                        btn.disabled = true; btn.textContent = 'Checking…';
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pw });
                        if (error) { render('Incorrect password. Try again.'); return; }
                        resolve(true);
                    };
                    render(null);
                });
            },

            _isOnline() {
                if (!navigator.onLine) { alert('No internet connection. Please check your network and try again.'); return false; }
                return true;
            },

            showLoading() {
                const content = document.getElementById('mainContent');

            },
            
            clearCache() {
                this.cache = { myConceptNotes: null, myPayments: null, myRetirements: null };
            },
            
            async loadData() {
                try {
                    // Load projects from DB (falls back to hardcoded if table doesn't exist)
                    try {
                        const { data: dbProjects } = await supabaseClient
                            .from('projects')
                            .select('*')
                            .eq('active', true)
                            .order('code');
                        if (dbProjects && dbProjects.length > 0) {
                            this.data.projects = dbProjects.map(p => ({
                                code: p.code, name: p.name, budget: Number(p.budget||0),
                                donor: p.donor||'', startDate: p.startDate||'', endDate: p.endDate||'',
                                budgetLimit_bo: Number(p.budgetLimit_bo||1000000),
                                id: p.id
                            }));
                        }
                    } catch(e) { /* use hardcoded projects */ }

                    // Load roles from DB if available
                    try {
                        const { data: dbRoles } = await supabaseClient.from('user_roles').select('*');
                        if (dbRoles && dbRoles.length > 0) {
                            dbRoles.forEach(r => { this.data.roles[r.name] = r.role; });
                        }
                    } catch(e) { /* use hardcoded roles */ }

                    const role = this.getUserRole();
                    if (role === 'staff') {
                        const [cnResult, payResult, retResult] = await Promise.all([
                            supabaseClient.from('concept_notes').select('*').eq('staffName', this.currentUser).order('submittedDate', { ascending: false }),
                            supabaseClient.from('payments').select('*').eq('staffName', this.currentUser).order('requestDate', { ascending: false }),
                            supabaseClient.from('retirements').select('*').eq('staffName', this.currentUser).order('submittedDate', { ascending: false })
                        ]);
                        this.data.conceptNotes = cnResult.data || [];
                        this.data.payments = payResult.data || [];
                        this.data.retirements = retResult.data || [];
                    } else {
                        const queries = [];
                        if (!['finance','finance_manager'].includes(role)) {
                            queries.push(supabaseClient.from('concept_notes').select('*').eq('staffName', this.currentUser).order('submittedDate', { ascending: false }));
                        }
                        if (['budgetOwner','ed','procurement','finance_manager'].includes(role)) {
                            queries.push(supabaseClient.from('concept_notes').select('*').eq('status', 'pending').order('submittedDate', { ascending: false }).limit(50));
                        }
                        // Finance confirms POs as a budget commitment, before any
                        // payment exists — so they need the concept notes carrying a
                        // PO, which the payment-linked fetch below would never return.
                        if (['finance','finance_manager'].includes(role)) {
                            queries.push(supabaseClient.from('concept_notes').select('*')
                                .not('poNumber','is',null)
                                .not('status','in','("rejected","variance_rejected")')
                                .order('poGeneratedAt', { ascending: false }).limit(200));
                            // Which POs Finance has already confirmed — used to drop
                            // them out of the queue rather than listing them as done.
                            try {
                                const { data: finSigs } = await supabaseClient.from('document_signatures')
                                    .select('docRef,signerName').eq('pageContext','finance_sign');
                                this.data.confirmedPOs = new Set((finSigs || []).map(s => s.docRef));
                            } catch(e) { this.data.confirmedPOs = new Set(); }
                        }
                        // Security officers hold clearance independently of their
                        // finance/procurement role, so fetch travel awaiting clearance
                        // regardless of which role they carry.
                        if (this._isSecurityOfficer()) {
                            queries.push(supabaseClient.from('concept_notes').select('*').eq('status', 'security_review').order('submittedDate', { ascending: false }).limit(50));
                        }
                        if (['budgetOwner','ed','finance','finance_manager'].includes(role)) {
                            queries.push(supabaseClient.from('retirements').select('*').in('status', ['pending','reviewed','finance_approved']).order('submittedDate', { ascending: false }).limit(50));
                        }
                        queries.push(supabaseClient.from('payments').select('*').eq('staffName', this.currentUser).order('requestDate', { ascending: false }));
                        queries.push(supabaseClient.from('retirements').select('*').eq('staffName', this.currentUser).order('submittedDate', { ascending: false }));
                        const results = await Promise.all(queries);
                        let conceptNotes = [], payments = [], retirements = [];
                        results.forEach(result => {
                            if (!result.data) return;
                            result.data.forEach(item => {
                                if (item.activityTitle) conceptNotes.push(item);
                                else if (item.paymentMethod) payments.push(item);
                                else if (item.expenditureDetails) retirements.push(item);
                            });
                        });
                        this.data.conceptNotes = conceptNotes;
                        this.data.payments = payments;
                        this.data.retirements = retirements;
                    }
                    if (['budgetOwner','ed','finance','finance_manager'].includes(this.getUserRole())) {
                        const { data: allPaymentsForReports } = await supabaseClient.from('payments').select('*');
                        if (allPaymentsForReports) {
                            const paymentMap = new Map();
                            [...this.data.payments, ...allPaymentsForReports].forEach(p => paymentMap.set(p.refNumber, p));
                            this.data.payments = Array.from(paymentMap.values());
                        }
                        // Also load ALL retirements so reports are complete
                        const { data: allRetsForReports } = await supabaseClient.from('retirements').select('*');
                        if (allRetsForReports) {
                            const retMap = new Map();
                            [...this.data.retirements, ...allRetsForReports].forEach(r => retMap.set(r.id||r.refNumber, r));
                            this.data.retirements = Array.from(retMap.values());
                        }
                    }
                    if (['finance','finance_manager'].includes(this.getUserRole())) {
                        // Load ALL pending payments (includes procurement)
                        const { data: allPendingPay } = await supabaseClient.from('payments').select('*').in('status', ['pending','reviewed','finance_approved']);
                        if (allPendingPay) {
                            const pMap = new Map();
                            [...this.data.payments, ...allPendingPay].forEach(p => pMap.set(p.refNumber, p));
                            this.data.payments = Array.from(pMap.values());
                        }
                        // Load ALL pending retirements (includes procurement)
                        const { data: allPendingRet } = await supabaseClient.from('retirements').select('*').in('status', ['pending','reviewed','finance_approved']);
                        if (allPendingRet) {
                            const rMap = new Map();
                            [...this.data.retirements, ...allPendingRet].forEach(r => rMap.set(r.id||r.refNumber, r));
                            this.data.retirements = Array.from(rMap.values());
                        }
                        // Load ALL concept notes that Finance has ever touched (paid or rejected payments, approved retirements)
                        const { data: allFinancePay } = await supabaseClient.from('payments').select('*').eq('processedBy', this.currentUser);
                        const { data: allFinanceRejPay } = await supabaseClient.from('payments').select('*').eq('rejectedBy', this.currentUser);
                        const { data: allFinanceRet } = await supabaseClient.from('retirements').select('*').eq('approvedBy', this.currentUser);
                        const allFinancePayments = [...(allFinancePay||[]), ...(allFinanceRejPay||[])];
                        if (allFinancePayments.length) {
                            const pMap = new Map();
                            [...this.data.payments, ...allFinancePayments].forEach(p => pMap.set(p.refNumber, p));
                            this.data.payments = Array.from(pMap.values());
                        }
                        // Collect all CN refs Finance has ever been involved with
                        const allFinanceCNRefs = [
                            ...this.data.payments.map(p => p.conceptNoteRef),
                            ...(allFinanceRet||[]).map(r => r.paymentRef)
                        ].filter(Boolean);
                        const uniqueCNRefs = [...new Set(allFinanceCNRefs)];
                        if (uniqueCNRefs.length > 0) {
                            const { data: linkedCNs } = await supabaseClient.from('concept_notes').select('*').in('refNumber', uniqueCNRefs);
                            if (linkedCNs) {
                                const cMap = new Map();
                                [...this.data.conceptNotes, ...linkedCNs].forEach(c => cMap.set(c.refNumber, c));
                                this.data.conceptNotes = Array.from(cMap.values());
                            }
                        }
                        const pendingPaymentRefs = this.data.payments.filter(p => ['pending','reviewed','finance_approved'].includes(p.status) && p.conceptNoteRef).map(p => p.conceptNoteRef);
                        if (pendingPaymentRefs.length > 0) {
                            const { data: linkedCNs } = await supabaseClient.from('concept_notes').select('*').in('refNumber', pendingPaymentRefs);
                            if (linkedCNs) {
                                const cMap = new Map();
                                [...this.data.conceptNotes, ...linkedCNs].forEach(c => cMap.set(c.refNumber, c));
                                this.data.conceptNotes = Array.from(cMap.values());
                            }
                        }
                    }
                    const { data: notifs } = await supabaseClient.from('notifications').select('*').eq('recipientName', this.currentUser).eq('isRead', false).order('createdAt', { ascending: false });
                    this.data.notifications = notifs || [];
                    this.renderNotificationBadge();
                    this.clearCache();
                    if (document.querySelector('.nav button[data-view="dashboard"]')?.classList.contains('active')) {
                        this.renderDashboard(document.getElementById('mainContent'));
                    }
                } catch (error) {
                    console.error('Data load error:', error);
                    if (this.data.conceptNotes.length === 0) alert('Error loading data. Please refresh the page.');
                }
            },
            
            getUserRole() { return this.data.roles[this.currentUser] || 'staff'; },
            getFinanceStage(name) { return this.data.financeStages[name || this.currentUser] || null; },
            _financeStageLabel(s) { return { reviewer: 'Review', approver: 'Approve', authorizer: 'Authorize & Pay' }[s] || s; },
            _financeStatusAfterStage(s) { return { reviewer: 'reviewed', approver: 'finance_approved', authorizer: 'paid' }[s]; },
            _financeStageForCurrentStatus(status) { return { pending: 'reviewer', reviewed: 'approver', finance_approved: 'authorizer' }[status] || null; },
            _financeOfficerForStage(stage) { return Object.entries(this.data.financeStages).find(([, s]) => s === stage)?.[0] || null; },
            _canActOnFinanceStage(stage) { return this.getFinanceStage(this.currentUser) === stage; },
            _financeStatusLabel(status) {
                return { pending: 'Awaiting Review', reviewed: 'Awaiting Approval', finance_approved: 'Awaiting Authorization', paid: 'Paid', approved: 'Approved', rejected: 'Rejected' }[status] || status;
            },
            _renderFinancePaymentActions(p) {
                const stage = this._financeStageForCurrentStatus(p.status);
                if (!stage) return `<span style="font-size:12px;color:var(--text-muted);">${this._financeStatusLabel(p.status)}</span>`;
                const officer = this._financeOfficerForStage(stage);
                const iCanAct = this._canActOnFinanceStage(stage);
                const badge = `<div style="font-size:11px;font-weight:600;color:${iCanAct ? '#047857' : '#9CA3AF'};margin-bottom:6px;">Stage: ${this._financeStatusLabel(p.status)}${!iCanAct ? ` (awaiting ${officer})` : ''}</div>`;
                if (!iCanAct) return badge;
                return badge +
                    `<button class="action-btn approve" onclick="app.advancePaymentStage('${p.refNumber}')">✓ ${this._financeStageLabel(stage)}</button>` +
                    `<button class="action-btn reject" onclick="app.rejectPayment('${p.refNumber}')">✗ Reject</button>`;
            },
            _renderFinanceRetirementActions(r) {
                const stage = this._financeStageForCurrentStatus(r.status);
                if (!stage) return `<span style="font-size:12px;color:var(--text-muted);">${this._financeStatusLabel(r.status)}</span>`;
                const officer = this._financeOfficerForStage(stage);
                const iCanAct = this._canActOnFinanceStage(stage);
                const badge = `<div style="font-size:11px;font-weight:600;color:${iCanAct ? '#047857' : '#9CA3AF'};margin-bottom:6px;">Stage: ${this._financeStatusLabel(r.status)}${!iCanAct ? ` (awaiting ${officer})` : ''}</div>`;
                if (!iCanAct) return badge;
                return badge +
                    `<button class="action-btn approve" onclick="app.advanceRetirementStage('${r.refNumber}')">✓ ${this._financeStageLabel(stage)}</button>` +
                    `<button class="action-btn reject" onclick="app.rejectRetirement('${r.refNumber}')">✗ Reject</button>`;
            },
            async advancePaymentStage(refNumber) {
                const payment = this.data.payments.find(p => p.refNumber === refNumber);
                if (!payment) return;
                const stage = this._financeStageForCurrentStatus(payment.status);
                if (!stage) { alert('This payment is not currently awaiting a finance action.'); return; }
                if (!this._canActOnFinanceStage(stage)) {
                    alert(`Only ${this._financeOfficerForStage(stage)} (Finance ${stage}) can ${this._financeStageLabel(stage).toLowerCase()} this payment.`);
                    return;
                }
                if (stage === 'authorizer') {
                    if (payment.payMode === 'vendors' && payment.paymentScheduleJson) {
                        // Procurement payments settle several vendors from one authorisation —
                        // each vendor's account lives in paymentScheduleJson, not in the
                        // single accountName/accountNumber/bankName fields on the payment
                        // itself (those are just a placeholder label for this payment type).
                        let schedule = [];
                        try { schedule = JSON.parse(payment.paymentScheduleJson); } catch(e) {}
                        const badLines = schedule.filter(s => !s.accountName || !s.accountNumber || !s.bankName);
                        if (schedule.length === 0 || badLines.length > 0) {
                            alert('Error: Payment account details are missing for one or more vendors on this payment schedule.' +
                                (badLines.length ? '\n\n' + badLines.map(s => '  • ' + (s.vendor || 'Unknown vendor')).join('\n') : ''));
                            return;
                        }
                        const lines = schedule.map(s => `${s.vendor} — ₦${Number(s.amount||0).toLocaleString()} (${s.accountName}, ${s.accountNumber}, ${s.bankName})`).join('\n');
                        if (!confirm(`Authorize payment of ₦${payment.amount.toLocaleString()} across ${schedule.length} vendor(s)?\n\n${lines}\n\nConfirm payment?`)) return;
                    } else if (payment.beneficiaryFileUrl) {
                        if (!confirm(`Authorize batch payment of ₦${payment.amount.toLocaleString()}?\n\nBeneficiary file attached.\n\nConfirm payment?`)) return;
                    } else {
                        if (!payment.accountName || !payment.accountNumber || !payment.bankName) { alert('Error: Account details not provided by staff member.'); return; }
                        if (!confirm(`Authorize payment of ₦${payment.amount.toLocaleString()} to:\n\nAccount Name: ${payment.accountName}\nAccount Number: ${payment.accountNumber}\nBank: ${payment.bankName}\n\nConfirm payment?`)) return;
                    }
                }
                const sigData = await this._showSignaturePad(
                    `Finance ${this._financeStageLabel(stage)} Signature`,
                    stage === 'reviewer'
                        ? `I, ${this.currentUser}, confirm I have reviewed payment ${refNumber} (₦${payment.amount.toLocaleString()}) and it is in order to proceed to approval.`
                        : stage === 'approver'
                        ? `I, ${this.currentUser}, approve payment ${refNumber} (₦${payment.amount.toLocaleString()}) to proceed to final authorization.`
                        : `I, ${this.currentUser}, authorize payment ${refNumber} (₦${payment.amount.toLocaleString()}) and confirm it has been duly released.`
                );
                if (!sigData) return;
                const now = new Date().toISOString();
                const newStatus = this._financeStatusAfterStage(stage);
                try {
                    const updates = { status: newStatus };
                    const conceptNote = this.data.conceptNotes.find(cn => cn.refNumber === payment.conceptNoteRef);
                    if (stage === 'reviewer') {
                        Object.assign(updates, { reviewedBy: this.currentUser, reviewedAt: now, reviewSignatureData: sigData });
                    } else if (stage === 'approver') {
                        Object.assign(updates, { financeApprovedBy: this.currentUser, financeApprovedAt: now, financeApproveSignatureData: sigData });

                            paidDate: now, processedBy: this.currentUser, authorizeSignatureData: sigData,

                    if (error) throw error;
                    if (stage === 'authorizer') {
                        if (conceptNote?.poNumber) await supabaseClient.from('document_signatures').insert([{ docRef: conceptNote.poNumber, docType: 'purchase_order', relatedRef: conceptNote.refNumber, signerName: this.currentUser, signerRole: 'finance_authorizer', signatureData: sigData, signedAt: now, pageContext: 'finance_sign' }]);
                        if (conceptNote?.grrNumber) await supabaseClient.from('document_signatures').insert([{ docRef: conceptNote.grrNumber, docType: 'grr', relatedRef: conceptNote.refNumber, signerName: this.currentUser, signerRole: 'finance_authorizer', signatureData: sigData, signedAt: now, pageContext: 'finance_sign' }]);
                    }
                    await supabaseClient.from('document_signatures').insert([{
                        docRef: refNumber, docType: 'payment', relatedRef: payment.conceptNoteRef || refNumber,
                        signerName: this.currentUser, signerRole: `finance_${stage}`, signatureData: sigData, signedAt: now,
                        pageContext: `payment_${stage}`
                    }]);
                    await this._logAudit('payments', refNumber, `payment_${stage}ed`, `${this._financeStageLabel(stage)} by ${this.currentUser} (Finance ${stage}). Amount: ₦${payment.amount.toLocaleString()}. Staff: ${payment.staffName}.`);
                    if (stage === 'authorizer') {
                        await this.createNotification(payment.staffName, `Your payment of ₦${payment.amount.toLocaleString()} (${refNumber}) has been processed!`, 'success', refNumber);

                    } else {
                        const nextOfficer = this._financeOfficerForStage(stage === 'reviewer' ? 'approver' : 'authorizer');
                        if (nextOfficer) await this.createNotification(nextOfficer, `Payment ${refNumber} (₦${payment.amount.toLocaleString()}) has been ${stage === 'reviewer' ? 'reviewed' : 'approved'} and is awaiting your ${stage === 'reviewer' ? 'approval' : 'authorization'}.`, 'info', refNumber);

                    }
                    await this.loadData(); this.showView('approvals');

            async advanceRetirementStage(refNumber) {

                const newStatus = stage === 'reviewer' ? 'reviewed'

                try {

                    if (stage === 'authorizer') {

                        if (nextOfficer) await this.createNotification(nextOfficer, `Retirement ${refNumber} has been ${stage === 'reviewer' ? 'reviewed' : 'approved'} and is awaiting your ${stage === 'reviewer' ? 'approval' : 'authorization'}.`, 'info', retirement.paymentRef || refNumber);
                        alert(`Retirement ${this._financeStageLabel(stage).toLowerCase()}d. ${nextOfficer ? nextOfficer + ' has been notified.' : ''}`);
                    }
                    await this.loadData(); this.showView('approvals');
                } catch (error) { console.error('Finance stage error:', error); alert('Error processing: ' + error.message); }
            },

            // Compress photos in the browser before upload. Phone cameras produce
            // 3–5MB images; receipts remain perfectly legible at ~1600px wide and
            // 72% JPEG quality, which is typically a 90% size reduction.
            // Non-images (PDF, DOC, XLS) are returned untouched.
            async _compressImage(file, maxDim = 1600, quality = 0.72) {
                if (!file || !file.type || !file.type.startsWith('image/')) return file;
                if (file.type === 'image/gif') return file;           // don't flatten animations
                if (file.size < 400 * 1024) return file;              // already small enough
                try {
                    const dataUrl = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = () => res(r.result); r.onerror = rej;
                        r.readAsDataURL(file);
                    });
                    const img = await new Promise((res, rej) => {
                        const i = new Image();
                        i.onload = () => res(i); i.onerror = rej;
                        i.src = dataUrl;
                    });
                    let { width: w, height: h } = img;
                    if (w > maxDim || h > maxDim) {
                        if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                        else        { w = Math.round(w * (maxDim / h)); h = maxDim; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h);  // flatten transparency
                    ctx.drawImage(img, 0, 0, w, h);
                    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
                    if (!blob || blob.size >= file.size) return file;      // no gain — keep original
                    const newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                    const out = new File([blob], newName, { type: 'image/jpeg' });
                    console.log(`Compressed ${file.name}: ${(file.size/1024).toFixed(0)}KB → ${(out.size/1024).toFixed(0)}KB`);
                    return out;
                } catch (e) {
                    console.warn('Image compression failed, uploading original:', e);
                    return file;
                }
            },

            async uploadFile(file, type = 'general') {
                if (!file) return null;
                if (file.size > MAX_FILE_SIZE) throw new Error(`File too large. Maximum size is ${MAX_FILE_SIZE / 1024 / 1024}MB`);
                const original = file;
                file = await this._compressImage(file);
                const timestamp = Date.now();
                const sanitizedName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                const fileName = `${type}/${timestamp}_${sanitizedName}`;
                try {
                    const { data, error } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(fileName, file);
                    if (error) throw error;
                    const { data: urlData } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
                    return { url: urlData.publicUrl, fileName: original.name, size: file.size, type: file.type };
                } catch (error) {
                    console.error('Upload error:', error);
                    throw new Error('Failed to upload file: ' + error.message);
                }
            },
            
            async downloadFile(fileUrl, fileName) {
                try {
                    const response = await fetch(fileUrl);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url; link.download = fileName || 'download';
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                } catch (error) { console.error('Download error:', error); alert('Failed to download file'); }
            },

            getConceptNoteProgress(cn) {
                const steps = [
                    { id: 'submitted', label: 'Submitted', icon: '📝', date: cn.submittedDate },
                    { id: 'budgetOwner', label: 'Budget Owner', icon: '👤', date: null },
                    { id: 'ed', label: 'Executive Director', icon: '👔', date: cn.forwardedToED },
                    { id: 'procurement', label: 'Procurement', icon: '🛒', date: cn.sentToProcurement },
                    { id: 'approved', label: 'Approved', icon: '✓', date: cn.approvedDate }
                ];
                let progress = { steps: [], currentStep: '', percentComplete: 0, message: '' };
                let activeSteps = [steps[0]];
                if (cn.status === 'pending' && cn.currentApprover === 'budgetOwner') { activeSteps.push({ ...steps[1], status: 'active' }); progress.currentStep = 'Budget Owner Review'; progress.message = 'Awaiting Budget Owner approval'; }
                if (cn.forwardedToED || (cn.status === 'pending' && cn.currentApprover === 'ed')) { activeSteps.push({ ...steps[1], status: 'completed', date: cn.submittedDate }); activeSteps.push({ ...steps[2], status: cn.currentApprover === 'ed' ? 'active' : 'completed' }); if (cn.currentApprover === 'ed') { progress.currentStep = 'Executive Director Review'; progress.message = 'Awaiting ED approval'; } }
                if (cn.sentToProcurement || (cn.status === 'pending' && cn.currentApprover === 'procurement')) { if (!cn.forwardedToED) activeSteps.push({ ...steps[1], status: 'completed', date: cn.submittedDate }); activeSteps.push({ ...steps[3], status: cn.currentApprover === 'procurement' ? 'active' : 'completed' }); if (cn.currentApprover === 'procurement') { progress.currentStep = 'Procurement Processing'; progress.message = 'Items being procured'; } }
                if (cn.status === 'approved') { if (!cn.sentToProcurement && !cn.forwardedToED) activeSteps.push({ ...steps[1], status: 'completed', date: cn.submittedDate }); activeSteps.push({ ...steps[4], status: 'completed' }); progress.currentStep = 'Approved'; progress.message = '✓ Concept note approved! Payment can be requested.'; }
                if (cn.status === 'rejected') { const lastStep = activeSteps[activeSteps.length - 1]; lastStep.status = 'rejected'; progress.currentStep = 'Rejected'; progress.message = `❌ Rejected: ${cn.rejectionReason || 'See comments'}`; }
                progress.steps = activeSteps;
                progress.percentComplete = ((activeSteps.filter(s => s.status === 'completed').length) / activeSteps.length) * 100;
                return progress;
            },

                        </div>
                        <div style="background:#fff;border:1px solid ${bd};border-radius:8px;padding:14px 16px;">
                            <div style="font-size:11px;font-weight:700;color:${hd};text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">🛡️ Security Advice</div>
                            <div style="font-size:13px;white-space:pre-wrap;line-height:1.7;">${cn.securityAdvice||'—'}</div>
                        </div>
                    </div>` : denied ? `
                    <div style="border-top:1px solid ${bd};margin-top:18px;padding-top:16px;">
                        <div style="font-size:11px;font-weight:700;color:#B71C1C;text-transform:uppercase;letter-spacing:.4px;">Reason for Denial</div>

            },

                    const { data: pLive } = await supabaseClient
                        .from('payments')
                        .select('*')
                        .eq('staffName', this.currentUser)
                        .eq('status', 'paid');
                    livePayments = pLive || [];
                    const payRefs = livePayments.map(p => p.refNumber);
                    if (payRefs.length > 0) {
                        const { data: rLive } = await supabaseClient
                            .from('retirements')
                            .select('*')
                            .in('paymentRef', payRefs);

                    }

                    // Fallback to cache on network error

                    <form class="form-grid" onsubmit="app.submitSecurityClearance(event,'${refNumber}')">
                        <div class="form-group full-width">
                            <label>Risk Level <span class="required">*</span></label>
                            <select id="secRisk" required>
                                <option value="">Select risk level</option>
                                <option value="Low">🟢 Low — routine travel, no known threat</option>
                                <option value="Medium">🟡 Medium — proceed with stated precautions</option>
                                <option value="High">🔴 High — significant risk</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>Approved Route <span class="required">*</span></label>
                            <textarea id="secRoute" rows="2" required placeholder="The route that must be followed — may differ from the route proposed">${t.route||''}</textarea>
                            <span class="form-hint">Staff are required to follow this route</span>
                        </div>
                        <div class="form-group full-width">
                            <label>Security Advice <span class="required">*</span></label>
                            <textarea id="secAdvice" rows="5" required placeholder="Movement timings, checkpoints, contacts, communication protocol, no-go areas, curfew, escort requirements…"></textarea>
                        </div>
                        <div class="btn-group full-width" style="flex-wrap:wrap;gap:10px;">
                            <button type="submit" class="btn btn-primary" id="secClearBtn">🛡️ Grant Clearance &amp; Sign</button>
                            <button type="button" class="btn btn-secondary" style="border-color:var(--danger);color:var(--danger);" onclick="app.denySecurityClearance('${refNumber}')">✗ Deny Clearance</button>
                            <button type="button" class="btn btn-secondary" onclick="app.showView('approvals')">Cancel</button>

            },

            async submitSecurityClearance(event, refNumber) {
                event.preventDefault();
                const risk   = document.getElementById('secRisk').value;
                const route  = document.getElementById('secRoute').value.trim();
                const advice = document.getElementById('secAdvice').value.trim();
                if (!risk || !route || !advice) { alert('Risk level, approved route and security advice are all required.'); return; }
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber)
                        || (await supabaseClient.from('concept_notes').select('*').eq('refNumber', refNumber).single()).data;
                if (!cn) { alert('Concept note not found.'); return; }

                const sig = await this._showSignaturePad('Security Clearance',
                    `I, ${this.currentUser}, have assessed this travel request and grant clearance at ${risk} risk, subject to the advice and route stated.`);
                if (!sig) return;

                const btn = document.getElementById('secClearBtn');
                if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
                try {
                    const now = new Date().toISOString();
                    // Cleared — resume the normal route: procurement, or straight to payment
                    const onward = cn.requiresProcurement === 'yes'
                        ? { status: 'pending', currentApprover: 'procurement', sentToProcurement: now, retirementresponsibility: 'procurement' }
                        : { status: 'approved', approvedDate: now, approvedBy: cn.approvedBy || cn.edApprovedBy || this.currentUser, retirementresponsibility: 'staff' };
                    const { error } = await supabaseClient.from('concept_notes').update({
                        securityStatus: 'cleared', securityRiskLevel: risk,
                        securityApprovedRoute: route, securityAdvice: advice,
                        securityClearedBy: this.currentUser, securityClearedAt: now,
                        securityDenialReason: null, ...onward
                    }).eq('refNumber', refNumber);
                    if (error) throw error;

                    await supabaseClient.from('document_signatures').insert([{
                        docRef: refNumber, docType: 'security_clearance', relatedRef: refNumber,
                        signerName: this.currentUser, signerRole: 'security',
                        signatureData: sig, signedAt: now, pageContext: 'security_clearance'
                    }]);

                    await this._logAudit('concept_notes', refNumber, 'security_cleared',
                        `Security clearance granted by ${this.currentUser}. Risk: ${risk}. Route: ${route}.`);
                    await this.createNotification(cn.staffName,
                        `Security clearance granted for ${refNumber} (${cn.activityTitle}) — risk level ${risk}. Approved route: ${route}. Open the concept note to read the full security advice before you travel.`,
                        'success', refNumber);
                    this.clearCache();
                    alert(`Clearance granted (${risk} risk).\n\n${cn.requiresProcurement === 'yes' ? 'Sent to Procurement.' : 'Staff can now request payment.'}`);
                    await this.loadData();
                    this.showView('approvals');
                } catch(e) {
                    alert('Error saving clearance: ' + e.message);
                } finally {
                    if (btn) { btn.disabled = false; btn.textContent = '🛡️ Grant Clearance & Sign'; }
                }
            },

            async denySecurityClearance(refNumber) {
                const reason = prompt('Reason for denying security clearance:\n\nThe concept note will be closed and the staff member must submit a new one.');
                if (reason === null) return;
                if (!reason.trim()) { alert('A reason is required.'); return; }
                const cn = this.data.conceptNotes.find(c => c.refNumber === refNumber)
                        || (await supabaseClient.from('concept_notes').select('*').eq('refNumber', refNumber).single()).data;
                if (!confirm(`Deny clearance for ${refNumber}?\n\nThis closes the concept note permanently. ${cn?.staffName||'The staff member'} will need to submit a new one.`)) return;
                try {
                    const now = new Date().toISOString();
                    const { error } = await supabaseClient.from('concept_notes').update({
                        securityStatus: 'denied', securityDenialReason: reason.trim(),
                        securityClearedBy: this.currentUser, securityClearedAt: now,
                        status: 'rejected', currentApprover: null,
                        rejectedBy: this.currentUser, rejectedDate: now,
                        rejectionReason: 'Security clearance denied: ' + reason.trim()
                    }).eq('refNumber', refNumber);
                    if (error) throw error;
                    await this._logAudit('concept_notes', refNumber, 'security_denied',
                        `Security clearance DENIED by ${this.currentUser}. Reason: ${reason.trim()}`);
                    if (cn) await this.createNotification(cn.staffName,
                        `Security clearance was denied for ${refNumber} (${cn.activityTitle}). Reason: ${reason.trim()} — this concept note is closed; please submit a new one if the travel is still required.`,
                        'error', refNumber);
                    this.clearCache();
                    alert('Clearance denied. The concept note is now closed.');
                    await this.loadData();
                    this.showView('approvals');
                } catch(e) { alert('Error: ' + e.message); }
            },

            // approved route and risk level are added by the security officer

            _saveTravelDetails() {

                    departDate: g('tvDepart'), returnDate: g('tvReturn'),
                    travellerNames: g('tvNames'), accommodation: g('tvStay'), purpose: g('tvPurpose')
                };
                if (!d.destination) { alert('Destination is required.'); return; }
                if (!d.route)       { alert('Proposed route is required.'); return; }
                if (!d.departDate || !d.returnDate) { alert('Departure and return dates are required.'); return; }
                if (new Date(d.returnDate) < new Date(d.departDate)) { alert('Return date cannot be before the departure date.'); return; }
                app._travelDetails = d;
                document.getElementById('travelModalOverlay')?.remove();
                this._refreshTravelSummary();

            async submitConceptNote(event) {
                event.preventDefault(); this.clearErrors();
                const form = event.target; const formData = new FormData(form);
                const amount = parseFloat(document.getElementById('estimatedCost')?.value) || 0;
                if (amount <= 0) { alert('Please fill in at least one budget line item before submitting.'); return; }
                if (formData.get('travelRequired') === 'yes' && !app._travelDetails) {
                    alert('You indicated this activity involves travel.\n\nPlease enter the travel details before submitting — they are needed for security clearance.');
                    this._showTravelModal(); return;
                }

                // ── Capture staff signature before proceeding ──
                const sigData = await this._showSignaturePad(
                    'Staff Declaration',
                    `I, ${this.currentUser}, confirm that the information in this concept note is accurate and complete.`
                );
                if (!sigData) return; // user cancelled

                const submitBtn = form.querySelector('[type="submit"]');
                if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Submitting...'; }
                try {
                    // If the submitter is the Budget Owner, route directly to ED (can't self-approve)
                    const submitterRole = this.getUserRole();
                    const firstApprover = submitterRole === 'budgetOwner' ? 'ed' : 'budgetOwner';
                    // Collect budget line items as text for storage
                    const budgetLinesText = this.getCNBudgetLinesText();
                    const conceptNote = { refNumber: 'CN' + Date.now(), staffName: this.currentUser, projectCode: formData.get('projectCode'), activityTitle: formData.get('activityTitle'), objective: formData.get('objective'), description: formData.get('description'), estimatedCost: amount, budgetBreakdown: budgetLinesText || null, implementation_date: formData.get('implementation_date') || null, requiresProcurement: formData.get('requiresProcurement'), travelRequired: formData.get('travelRequired') || 'no', travelDetailsJson: (formData.get('travelRequired') === 'yes' && app._travelDetails) ? JSON.stringify(app._travelDetails) : null, securityStatus: (formData.get('travelRequired') === 'yes') ? 'pending' : null, status: 'pending', currentApprover: firstApprover, submittedDate: new Date().toISOString(), staffSignatureData: sigData, staffSignedAt: new Date().toISOString() };
                    const { data, error } = await supabaseClient.from('concept_notes').insert([conceptNote]).select();
                    if (error) throw error;
                    // Upload optional budget document
                    const cnRef = data[0].refNumber;
                    const budgetFile = app._cnBudgetFile;
                    if (budgetFile) {
                        try {
                            const ext = budgetFile.name.split('.').pop();
                            const path = `budgets/${cnRef}_budget.${ext}`;
                            const { data: upData, error: upErr } = await supabaseClient.storage.from('documents').upload(path, budgetFile, { upsert: true });
                            if (!upErr) {
                                const { data: { publicUrl } } = supabaseClient.storage.from('documents').getPublicUrl(path);
                                await supabaseClient.from('concept_notes').update({ budgetDocUrl: publicUrl, budgetDocName: budgetFile.name }).eq('refNumber', cnRef);
                                data[0].budgetDocUrl = publicUrl; data[0].budgetDocName = budgetFile.name;
                            }
                        } catch(ue) { console.warn('Budget file upload failed (non-critical):', ue.message); }
                        app._cnBudgetFile = null;
                    }
                    this.data.conceptNotes.unshift(data[0]); this.clearCache();
                    // Notify the right approver
                    if (firstApprover === 'ed') {
                        const edUsers = Object.entries(this.data.roles).filter(([,r]) => r === 'ed').map(([n]) => n);
                        for (const ed of edUsers) {
                            await this.createNotification(ed, `New concept note ${data[0].refNumber} submitted by ${this.currentUser} (Budget Owner) for your approval.`, 'info', data[0].refNumber);
                        }
                    } else {
                        const budgetOwners = Object.entries(this.data.roles).filter(([,r]) => r === 'budgetOwner').map(([n]) => n);
                        for (const bo of budgetOwners) {
                            await this.createNotification(bo, `New concept note ${data[0].refNumber} submitted by ${this.currentUser} for review.`, 'info', data[0].refNumber);
                        }
                    }
                    await this._logAudit('concept_notes', data[0].refNumber, 'submitted', `Submitted by ${this.currentUser}. Activity: ${conceptNote.activityTitle}. Amount: ₦${Number(conceptNote.estimatedCost).toLocaleString()}. Project: ${conceptNote.projectCode}. Requires procurement: ${conceptNote.requiresProcurement}. Sent to: ${firstApprover}.`);
                    alert('Concept note submitted successfully!'); this.showView('dashboard');
                } catch (error) { console.error('Submit error:', error); alert('Error submitting concept note: ' + error.message); if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Concept Note'; } }
            },
            
            // ── BO approve button renderer (avoids nested backtick syntax error) ──
            _renderBOApproveButtons(cn) {

                const lim = (proj && proj.budgetLimit_bo) || 1000000;

            // ── Procurement action button renderer — routes to PO creation (Stage 1)

                if (cn.quoteExceptionStatus === 'declined') {

                if (cn.financeRejectionReason) {
