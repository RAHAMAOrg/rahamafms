<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHAMA FMS · Move beneficiary lists (one-time)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #F4F7F5; color: #1F2937; margin: 0; padding: 16px; }
  .card { max-width: 560px; margin: 24px auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
  h1 { font-size: 20px; margin: 0 0 6px; color: #1B4332; }
  p { font-size: 14px; line-height: 1.5; color: #4B5563; }
  input { width: 100%; padding: 11px; margin: 6px 0; border: 1px solid #D1D5DB; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
  button { width: 100%; padding: 13px; margin-top: 10px; border: 0; border-radius: 8px; background: #285B3C; color: #fff; font-size: 15px; font-weight: 600; }
  button:disabled { opacity: .5; }
  .log { margin-top: 16px; font: 12px/1.5 ui-monospace, monospace; background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 10px; max-height: 300px; overflow: auto; white-space: pre-wrap; }
  .ok { color: #047857; } .bad { color: #B91C1C; }
  .sum { font-size: 15px; font-weight: 600; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Move beneficiary lists to the private folder</h1>
  <p>One-time tool for the Budget Owner. It <b>copies</b> every old beneficiary list from the public folder into the private one. It deletes nothing and changes no payment, so it is safe to run more than once.</p>
  <div id="loginBox">
    <input id="email" type="email" placeholder="Your RAHAMA email" autocomplete="username">
    <input id="pw" type="password" placeholder="Your FMS password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
  </div>
  <button id="runBtn" style="display:none">Copy all beneficiary lists</button>
  <div id="sum" class="sum"></div>
  <div id="log" class="log" style="display:none"></div>
</div>
<script>
const SUPABASE_URL = "https://sqygmoxpegbfxddglhbx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__nPBgo9IeeU4Mrk_ggEeTg_YEkWrB24";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const log = (msg, cls) => { const l = $('log'); l.style.display = 'block'; const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = msg; l.appendChild(d); l.scrollTop = l.scrollHeight; };

async function checkBudgetOwner() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return false;
  const { data } = await sb.from('user_roles').select('name,role').eq('auth_user_id', user.id).maybeSingle();
  if (!data || data.role !== 'budgetOwner') { $('sum').textContent = 'Only the Budget Owner can run this tool.'; $('sum').className = 'sum bad'; return false; }
  $('sum').textContent = 'Signed in as ' + data.name + '.'; $('sum').className = 'sum ok';
  $('loginBox').style.display = 'none'; $('runBtn').style.display = 'block';
  return true;
}

$('loginBtn').onclick = async () => {
  $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  $('loginBtn').disabled = false;
  if (error) { $('sum').textContent = 'Sign-in failed: ' + error.message; $('sum').className = 'sum bad'; return; }
  await checkBudgetOwner();
};

$('runBtn').onclick = async () => {
  $('runBtn').disabled = true; $('runBtn').textContent = 'Copying…';
  // List every file in the old public folder (in pages of 100)
  const files = [];
  for (let offset = 0; ; offset += 100) {
    const { data, error } = await sb.storage.from('fms-documents').list('beneficiaries', { limit: 100, offset, sortBy: { column: 'name', order: 'asc' } });
    if (error) { log('Could not list files: ' + error.message, 'bad'); $('runBtn').textContent = 'Stopped — see log'; return; }
    (data || []).filter(f => f.id).forEach(f => files.push('beneficiaries/' + f.name));
    if (!data || data.length < 100) break;
  }
  log('Found ' + files.length + ' files in the public folder.');
  let copied = 0, already = 0, failed = 0;
  for (const path of files) {
    const { error } = await sb.storage.from('fms-documents').copy(path, path, { destinationBucket: 'fms-beneficiaries' });
    if (!error) { copied++; log('✓ ' + path, 'ok'); }
    else if (/exist|duplicate/i.test(error.message || '')) { already++; log('= already copied: ' + path); }
    else { failed++; log('✗ ' + path + ' — ' + error.message, 'bad'); }
  }
  $('sum').textContent = `Done. Copied ${copied}, already there ${already}, failed ${failed} (of ${files.length}).`;
  $('sum').className = 'sum ' + (failed ? 'bad' : 'ok');
  $('runBtn').textContent = failed ? 'Run again (retries only the failed ones)' : 'Finished';
  $('runBtn').disabled = !failed;
};

checkBudgetOwner();
</script>
</body>
</html>
