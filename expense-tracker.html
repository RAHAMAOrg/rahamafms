<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAHAMA Expense Tracker (Finance)</title>
<link rel="icon" type="image/png" href="RAHAMA Empowerment Logo Design (3).png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark-green sidebar for views, sticky slicer bar, KPI strip, chart grid, ledger table. */
:root{--bg:#F4F7F5;--panel:#FFFFFF;--ink:#14201A;--mute:#5C6B62;--line:#E2E9E4;--g:#2d7a52;--g2:#40C078;--g3:#DDEFE4;--side:#14432B;--side2:#1a4d32;--sideink:#DCEBE2;--warn:#B7791F;--bad:#C4432A;--good:#2d7a52;--c1:#2d7a52;--c2:#40C078;--c3:#D9A21B;--c4:#3F7CAC;--c5:#8E6BB5;--c6:#C4432A;--chip:#EAF3EE;--shadow:0 1px 2px rgba(16,40,32,0.06),0 4px 14px rgba(16,40,32,0.08);--f1:'Plus Jakarta Sans',system-ui,sans-serif;--f2:'Plus Jakarta Sans',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f2);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(180deg,var(--side) 0%,var(--side2) 100%);color:var(--sideink);padding:22px 0 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.brand{text-align:center;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:12px}
.brand img{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 12px;filter:brightness(0) invert(1)}
.brand b{font-family:var(--f1);font-size:18px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.15;color:#fff}
.brand small{display:block;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.75);margin-top:4px}
.who{margin:0 16px 14px;padding:16px 24px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:#fff}
.who small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:6px}.who b{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.back{margin:14px 16px 0;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:600;font-size:13px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:block}
.back:hover{background:rgba(255,255,255,.2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:10px 20px;margin:0 10px;border-radius:8px;font-weight:500;font-size:13.5px;color:#DCEBE2;display:flex;gap:10px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="true"]{background:#fff;color:var(--side);font-weight:700}
.nav button:focus-visible,.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
.sidefoot{margin-top:auto;padding:14px 20px 0;font-size:11.5px;opacity:.75;line-height:1.5}
main{padding:28px max(16px,env(safe-area-inset-right,0px)) 40px 32px;min-width:0}
h1{font-family:var(--f1);font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.sub{color:var(--mute);font-size:12.5px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.slicers{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;display:grid;gap:8px}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srow>label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;min-width:62px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--chip);padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);min-width:0}
.kpi small{display:block;color:var(--mute);font-size:11.5px;font-weight:600}
.kpi b{font-family:var(--f1);font-size:21px;font-variant-numeric:tabular-nums;display:block;margin-top:2px;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:11.5px;color:var(--mute)}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden;position:relative}
.bar span{display:block;height:100%;background:var(--g2)}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-family:var(--f1);font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 span{font-family:var(--f2);font-weight:500;font-size:11.5px;color:var(--mute)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.cv{position:relative;height:270px}
.cv.tall{height:330px}
.tw{overflow:auto;max-width:100%;max-height:560px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--g);color:#fff;text-align:left;padding:7px 9px;white-space:nowrap;cursor:pointer;user-select:none}
td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.idc td{background:var(--g3)} tr.out td{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--chip);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}.pill.wa{background:color-mix(in srgb,var(--warn) 24%,transparent);color:var(--warn)}.pill.bd{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;overflow:auto}
.modal>div{background:var(--panel);border-radius:14px;padding:18px;width:min(640px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}.form .w{grid-column:span 2}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;font-weight:600}
.empty{padding:26px;text-align:center;color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);max-width:78ch}
.note li{margin:3px 0}
@media (max-width:980px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px))}.brand{margin:0;padding:0;border:0;display:flex;gap:10px;align-items:center;text-align:left}.brand img{width:38px;height:38px;margin:0}.who{display:none}.back{margin:0;padding:8px 12px}.nav{flex-direction:row;flex-wrap:wrap}.sidefoot{display:none}main{padding-left:max(16px,env(safe-area-inset-left,0px))}.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
@media (max-width:520px){.form{grid-template-columns:1fr}.form .w{grid-column:span 1}.srow>label{min-width:100%}}
</style>
<div class="app">
<aside>
 <div class="brand"><img alt="RAHAMA" src="RAHAMA Empowerment Logo Design (3).png" onerror="this.style.display='none'"><div><b>RAHAMA FMS</b><small>Expense Tracker</small></div></div>
 <div class="who"><small>Signed in as</small><b id="who"></b></div>
 <nav class="nav" id="nav"></nav>
 <a class="back" href="index.html">← Back to FMS</a>
 <div class="sidefoot">Finance and named viewers only.</div>
</aside>
<main>
 <div class="top"><div><h1 id="ttl">Expense dashboard</h1><div class="sub" id="sub"></div></div>
  <div class="srow"><button class="btn pri" id="addBtn">+ Add expense</button><button class="btn" id="csvBtn">Download CSV</button><button class="btn" id="resetBtn">Clear slicers</button></div></div>
 <div class="slicers" id="slicers"></div>
 <div id="view"></div>
</main></div>
<div id="modalHost"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let BASE=[];
const PROJECTS=['ECHO HIP','GEPP','ASCENT DR-TB','FIFSAN','Core (ADM001)','Other codes'];
const DEF={};
const TYPES=['Direct','Outside budget'];
const RST=['Retired','Retirement submitted','Retirement rejected','Not retired'];
const N=v=>Math.round(v||0).toLocaleString('en-NG');
const M=v=>{v=v||0;const a=Math.abs(v);return (v<0?'-':'')+'₦'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(0)+'k':a.toFixed(0))};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ML=m=>m?MN[(m%100)-1]+' '+Math.floor(m/100):'';
const nextM=m=>m%100===12?m+89:m+1;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catOf=l=>!l?'':/^admin/i.test(l)?'ADMIN':(/^[14]\./.test(l)?l.slice(0,3):l[0]);
const SB=supabase.createClient("https://sqygmoxpegbfxddglhbx.supabase.co","sb_publishable__nPBgo9IeeU4Mrk_ggEeTg_YEkWrB24");
let CAN_WRITE=false,PROJ_LIST=[],QUEUE=[];
const fromDb=r=>({id:r.id,p:r.project_name,d:r.expense_date||'',m:r.cost_month||0,l:r.budget_line||'',c:r.category||catOf(r.budget_line||''),v:r.voucher_ref||'',n:r.description||'',s:r.payee||'',a:Number(r.amount||0),t:r.expense_type,r:r.retirement_status||'',o:r.source||'',k:r.comment||''});
async function pageAll(q){let out=[],from=0;for(;;){const {data,error}=await q().range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return out}
async function loadAll(){
 const [ex,pr,bl,qu]=await Promise.all([pageAll(()=>SB.from('fin_expenses').select('*').order('id')),SB.from('fin_projects').select('*'),SB.from('fin_budget_lines').select('*').order('sort_order',{nullsFirst:false}).order('category_key'),
  SB.from('fin_fms_queue').select('*').eq('status','pending').order('queued_at').then(r=>r,()=>({data:[]}))]);
 QUEUE=(qu&&!qu.error&&qu.data)||[];
 if(pr.error)throw pr.error;
 BASE=ex.map(fromDb);dbRows=[];SET={};PROJ_LIST=(pr.data||[]).map(p=>p.project_name);
 (pr.data||[]).forEach(p=>{SET[p.project_name]={project:p.project_name,budget:Number(p.direct_budget||0),cash:Number(p.cash_received||0),start:p.start_month||0,dur:p.duration_months||0,idc:Number(p.indirect_rate||0),opening:Number(p.opening_spend||0),cats:[]}});
 ((bl&&bl.data)||[]).forEach(b=>{if(SET[b.project_name])SET[b.project_name].cats.push([b.category_key,b.category_name||'',Number(b.budget||0)])});
 BASE.forEach(r=>{r.key=keyOf(r);r.g=r.key||r.c||'None'});
 setMonths();render()}
let DB=null,dbRows=[],SET={},st={view:'dash',proj:['ECHO HIP'],from:0,to:0,types:[],status:[],src:[],cats:[],q:'',sort:'d',dir:-1,page:0,months:[]};
try{const s=JSON.parse(localStorage.getItem('rahama_slicers')||'null');if(s&&s.proj)Object.assign(st,{proj:s.proj,view:s.view||'dash'})}catch(e){}
const slug=p=>p.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const cfg=p=>Object.assign({budget:0,start:0,dur:0,idc:0,cash:0,opening:0,cats:[]},DEF[p]||{},SET[p]||{});
const all=()=>BASE.concat(dbRows);
// Which budget line an expense belongs to: the most specific line code that matches its budget line
// (4.1.14 → 4.1 or 4; 1.1.1 → 1.1.1), else its category, else a line with the same name. Old IDC rows → Admin cost.
function keyOf(r){const cats=(SET[r.p]||{}).cats||[];if(!cats.length)return null;const K=cats.map(c=>String(c[0]));
 if(r.t==='IDC'&&K.some(k=>k.toUpperCase()==='ADMIN'))return K.find(k=>k.toUpperCase()==='ADMIN');
 const l=String(r.l||'').trim().toUpperCase();if(l){let best=null;K.forEach(k=>{const u=k.toUpperCase();if(l===u||l.startsWith(u+'.')||l.startsWith(u+' ')||l.startsWith(u+'-'))if(!best||k.length>best.length)best=k});if(best)return best}
 const c=String(r.c||'').trim().toUpperCase();if(c){const m=K.find(k=>k.toUpperCase()===c);if(m)return m;const n=cats.find(x=>String(x[1]||'').trim().toUpperCase()===c);if(n)return n[0]}
 return null}
const lineName=(p,k)=>{const c=((SET[p]||{}).cats||[]).find(x=>x[0]===k);return c?c[1]:''};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NOWM=(()=>{const d=new Date();return d.getFullYear()*100+d.getMonth()+1})();
// The month range covers all the data, from the earliest month to the current month (or later, if later rows exist).
// Until the data has loaded the range is provisional, and it is reset to the full range once the data arrives.
function setMonths(){const a=all().map(r=>r.m).filter(Boolean);let lo=a.length?Math.min(...a):NOWM,hi=Math.max(...a,NOWM),o=[];for(let m=lo;m<=hi;m=nextM(m))o.push(m);st.months=o;
 if(!st.from||!st._full&&a.length)st.from=o[0];if(!st.to||!st._full&&a.length)st.to=o.filter(m=>m<=NOWM).pop()||o[o.length-1];if(a.length)st._full=true;
 if(!o.includes(st.from))st.from=o[0];if(!o.includes(st.to))st.to=o.filter(m=>m<=NOWM).pop()||o[o.length-1]}
function base(){return all().filter(r=>st.proj.includes(r.p)&&(!r.m||(r.m>=st.from&&r.m<=st.to)))}
function filt(skip){let q=st.q.toLowerCase();return base().filter(r=>(skip==='types'||!st.types.length||st.types.includes(r.t))&&(!st.status.length||st.status.includes(r.r||'No status'))&&(!st.src.length||st.src.includes(r.o))&&(skip==='cats'||!st.cats.length||st.cats.includes(r.g))&&(!q||(r.n+' '+r.s+' '+r.v+' '+r.l).toLowerCase().includes(q)))}
const sum=(a,f)=>a.reduce((s,r)=>s+(f?f(r):r.a),0);
const grp=(a,k,v)=>{const o={};a.forEach(r=>{const x=k(r);o[x]=(o[x]||0)+(v?v(r):r.a)});return o};
// ---------- UI shell
const NAV=[['dash','Dashboard'],['ledger','Expense list'],['confirm','To confirm'],['budget','Budgets and cash'],['history','Change history'],['notes','Data notes']];
function drawNav(){document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<button data-v="${k}" aria-current="${st.view===k}">${k==='confirm'&&QUEUE.length?l+' ('+QUEUE.length+')':l}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;save();render()})}
function save(){try{localStorage.setItem('rahama_slicers',JSON.stringify({proj:st.proj,view:st.view}))}catch(e){}}
function tog(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)}
function chips(label,opts,sel,key){return `<div class="srow"><label>${label}</label>${opts.map(o=>`<button class="chip" data-k="${key}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>`}
function drawSlicers(){
 const cats=[...new Set(base().map(r=>r.g))].sort();
 const stat=[...new Set(base().map(r=>r.r||'No status'))];
 const srcs=[...new Set(base().map(r=>r.o))];
 const opt=sel=>st.months.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${ML(m)}</option>`).join('');
 document.getElementById('slicers').innerHTML=
  chips('Project',PROJECTS,st.proj,'proj')+
  `<div class="srow"><label>Months</label><select id="mf" aria-label="From month">${opt(st.from)}</select><span class="sub">to</span><select id="mt" aria-label="To month">${opt(st.to)}</select><label style="min-width:auto;margin-left:10px">Search</label><input id="q" placeholder="Description, supplier, CN..." value="${esc(st.q)}" style="flex:1;min-width:150px;max-width:300px"></div>`+
  chips('Type',TYPES,st.types,'types')+chips('Retirement',[...new Set(RST.concat(stat))],st.status,'status')+chips('Source',srcs,st.src,'src')+(cats.length>1?chips('Category',cats,st.cats,'cats'):'');
 document.querySelectorAll('#slicers .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;if(k==='proj'){if(st.proj.includes(v)&&st.proj.length===1)return;tog(st.proj,v);save()}else tog(st[k],v);st.page=0;render()});
 document.getElementById('mf').onchange=e=>{st.from=+e.target.value;if(st.from>st.to)st.to=st.from;render()};
 document.getElementById('mt').onchange=e=>{st.to=+e.target.value;if(st.to<st.from)st.from=st.to;render()};
 const q=document.getElementById('q');q.oninput=e=>{st.q=e.target.value;st.page=0;clearTimeout(window._qt);window._qt=setTimeout(()=>{render(true)},250)};
}
document.getElementById('resetBtn').onclick=()=>{Object.assign(st,{from:st.months[0],to:st.months.filter(m=>m<=NOWM).pop()||st.months[st.months.length-1],types:[],status:[],src:[],cats:[],q:'',page:0});render()};
// ---------- charts
let CH={};
function mk(id,cfg){if(CH[id])CH[id].destroy();const c=document.getElementById(id);if(!c)return;CH[id]=new Chart(c,cfg)}
function baseOpts(){const tick=css('--mute'),grid=css('--line');return {responsive:true,maintainAspectRatio:false,animation:{duration:350},plugins:{legend:{labels:{color:tick,boxWidth:10,font:{size:11}}},tooltip:{callbacks:{label:c=>(c.dataset.label?c.dataset.label+': ':'')+'₦'+N(c.parsed.y!==undefined&&c.chart.options.indexAxis!=='y'?c.parsed.y:c.parsed.x!==undefined?c.parsed.x:c.parsed)}}},scales:{x:{ticks:{color:tick,font:{size:10.5}},grid:{color:grid}},y:{ticks:{color:tick,font:{size:10.5},callback:v=>M(v)},grid:{color:grid}}}}}
function pal(){return [css('--c1'),css('--c2'),css('--c3'),css('--c4'),css('--c5'),css('--c6')]}
function drawKpis(F,B){
 const dir=sum(B.filter(r=>r.t!=='Outside budget')),out=sum(B.filter(r=>r.t==='Outside budget'));
 const adm=sum(B.filter(r=>r.key&&r.key.toUpperCase()==='ADMIN')),admB=st.proj.reduce((s,p)=>s+((cfg(p).cats.find(c=>String(c[0]).toUpperCase()==='ADMIN')||[])[2]||0),0);
 let bud=0,cash=0,open=0,el=0,dur=0,one=st.proj.length===1;
 st.proj.forEach(p=>{const c=cfg(p);bud+=c.budget;cash+=c.cash;open+=c.opening});
 const c0=cfg(st.proj[0]);if(one&&c0.start&&c0.dur){el=Math.min(1,((Math.floor(st.to/100)-Math.floor(c0.start/100))*12+st.to%100-c0.start%100+1)/c0.dur);dur=c0.dur}
 const dirAll=dir+open,use=bud?dirAll/bud:null;
 const unret=sum(B.filter(r=>r.o!=='MdM tracker'&&r.r&&r.r!=='Retired'));
 const flag=use!=null&&el?(use>el+.15?['Ahead of pace','bd']:use<el-.3?['Behind pace','wa']:['On pace','ok']):null;
 const tot=dir+out+open;
 const K=[['Spent against budget',M(dirAll),open?`incl. ${M(open)} opening`:`${B.filter(r=>r.t!=='Outside budget').length} payments`],
 ['Budget',bud?M(bud):'Not entered',bud?`${M(bud-dirAll)} left`:'Upload it in Budgets and cash'],

 const guess=()=>{const H=(U.rows[U.hdr]||[]).map(x=>txt(x).toLowerCase());const f=re=>H.findIndex(x=>re.test(x));
  let amt=f(/naira|ngn|local/);if(amt<0)amt=H.reduce((b,x,i)=>/total|amount|budget|cost/.test(x)&&!/usd|us\$|\$|unit|rate/.test(x)?i:b,-1);
  U.cols={code:f(/^s\/?n$|^code$|line|^no\.?$|^ref|budget code|^#$/),desc:f(/desc|activit|item|particular|detail|narrat/),amt}};
 const ADM=/admin(istrative)?\s*(cost|fee|support|overhead|expense)|indirect|overhead|\bidc\b|\bicr\b/i;
 const parse=()=>{const out=[],seen={};let admin=0,adminN=0,inAdm=false;const C=U.cols;
  for(let i=U.hdr+1;i<U.rows.length;i++){const R=U.rows[i]||[];let d=C.desc>=0?txt(R[C.desc]):'';const a=C.amt>=0?num(R[C.amt]):null;let code=C.code>=0?txt(R[C.code]):'';
   if(!d&&!code)continue;if(/sub\s*-?\s*total|^total|grand\s*total|total\s+(objective|budget|cost)/i.test(d)||/^total/i.test(code)){inAdm=false;continue}
   // a heading row (text, no amount) starts a section; an admin heading sends its rows to the Admin cost line
   if(a==null||a<=0){if(d&&(a==null))inAdm=ADM.test(d);continue}
   if(!code){const m=d.match(/^\s*(\d+(?:\.\d+)+|\d+)[\s.):-]+(.*)$/);if(m){code=m[1];d=m[2]||d}}
   code=code.replace(/\.0+$/,'');
   if(inAdm||ADM.test(d+' '+code)){admin+=a;adminN++;continue}
   if(!code)code='L'+String(out.length+1).padStart(2,'0');let k=code,j=2;while(seen[k.toUpperCase()])k=code+'-'+(j++);seen[k.toUpperCase()]=1;
   out.push({key:k,name:d.slice(0,200),amount:Math.round(a*100)/100})}
  const old=(cur.cats.find(c=>String(c[0]).toUpperCase()==='ADMIN')||[])[2]||0;
  out.push({key:'ADMIN',name:'Admin cost',amount:adminN?admin:old,_auto:adminN?`from ${adminN} admin/indirect row${adminN===1?'':'s'} in the file`:old?'kept from the current budget':'no admin row found — set the amount here'});
  U.lines=out};
 const show=()=>{parse();const L=U.lines,tot=L.reduce((s,l)=>s+(+l.amount||0),0);
  $('uprev').innerHTML=`<div class="srow" style="margin-bottom:6px"><b>${L.length} lines · ₦${N(tot)}</b><span class="sub">${cur.budget?`current budget ₦${N(cur.budget)}`:'no budget yet'}${cur.budget&&Math.abs(cur.budget-tot)>1?` · difference ₦${N(tot-cur.budget)}`:''}</span></div>
   <div class="tw" style="max-height:340px"><table><thead><tr><th>Code</th><th>Line</th><th class="n">Amount (₦)</th></tr></thead><tbody>${L.map((l,i)=>`<tr><td>${esc(l.key)}</td><td>${esc(l.name)}${l._auto?`<div class="sub">${esc(l._auto)}</div>`:''}</td><td class="n">${l.key==='ADMIN'?`<input id="uadm" type="number" step="0.01" value="${l.amount}" style="width:150px;text-align:right">`:N(l.amount)}</td></tr>`).join('')}</tbody></table></div>`;
  $('usv').disabled=L.length<2;const ad=$('uadm');if(ad)ad.oninput=()=>{U.lines[U.lines.length-1].amount=+ad.value||0}};
 const cfgUI=()=>{const H=(U.rows[U.hdr]||[]),opt=(sel)=>`<option value="-1">(none)</option>`+H.map((x,i)=>`<option value="${i}" ${i===sel?'selected':''}>${esc(String.fromCharCode(65+(i%26))+': '+(txt(x)||'(blank)').slice(0,40))}</option>`).join('');
  $('ucfg').innerHTML=`<div class="form" style="grid-template-columns:repeat(5,minmax(0,1fr))">${U.wb.SheetNames.length>1?`<label>Sheet<select id="ush">${U.wb.SheetNames.map(n=>`<option ${n===U.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}
   <label>Header row<input id="uhr" type="number" min="1" value="${U.hdr+1}"></label><label>Line code<select id="uc">${opt(U.cols.code)}</select></label><label>Description<select id="ud">${opt(U.cols.desc)}</select></label><label>Amount in ₦<select id="ua">${opt(U.cols.amt)}</select></label></div>`;
  if($('ush'))$('ush').onchange=e=>loadSheet(e.target.value,true);
  $('uhr').onchange=e=>{U.hdr=Math.max(0,(+e.target.value||1)-1);guess();cfgUI();show()};
  [['uc','code'],['ud','desc'],['ua','amt']].forEach(([id,k])=>$(id).onchange=e=>{U.cols[k]=+e.target.value;show()})};
 const loadSheet=(name)=>{U.sheet=name;U.rows=XLSX.utils.sheet_to_json(U.wb.Sheets[name],{header:1,raw:true,defval:''});
  U.hdr=Math.max(0,U.rows.slice(0,40).findIndex(r=>r.filter(x=>txt(x)&&num(x)===null).length>=3&&r.some(x=>/desc|activit|item|total|amount|budget|cost|line/i.test(txt(x)))));
  guess();cfgUI();show()};
 $('uf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{U.wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const best=U.wb.SheetNames.map(n=>[n,XLSX.utils.sheet_to_json(U.wb.Sheets[n],{header:1}).length]).sort((a,b)=>b[1]-a[1])[0][0];loadSheet(best)}catch(err){msg('Could not read the file: '+err.message)}};
 $('usv').onclick=async()=>{const L=U.lines.map(({key,name,amount})=>({key,name,amount}));if(!L.length)return;$('usv').disabled=true;msg('Saving…');
  const r=await SB.rpc('fin_replace_budget',{p_project:p,p_lines:L,p_set_total:$('uset').checked,p_note:'Uploaded from '+(($('uf').files[0]||{}).name||'file')});
  if(r.error){$('usv').disabled=false;msg(/fin_replace_budget|function/i.test(r.error.message)?'Run expense_tracker_budget_lines.sql once first, then upload again.':'Not saved: '+r.error.message);return}
  h.innerHTML='';toast(`Budget saved: ${L.length} lines`);await loadAll()};
}
// ---------- change history of expenses (edits and deletions)
async function historyView(v){v.innerHTML='<div class="card"><div class="empty">Loading…</div></div>';
 const {data,error}=await SB.from('fin_expenses_audit').select('*').order('changed_at',{ascending:false}).limit(300);
 if(error){v.innerHTML='<div class="card"><div class="empty">The change history is switched on by expense_tracker_edit_history.sql. Run it once in the FMS SQL editor.</div></div>';return}
 const F=['project_name','expense_date','budget_line','voucher_ref','description','payee','amount','expense_type','retirement_status','comment','cost_month'];
 const lab={project_name:'project',expense_date:'date',budget_line:'line',voucher_ref:'voucher',expense_type:'type',retirement_status:'retirement',cost_month:'month'};
 const what=a=>{const b=a.before_data||{},n=a.after_data||{};if(a.action==='delete')return `Deleted: ${esc(b.description||'')} · ₦${N(b.amount)} (${esc(b.project_name||'')})`;
  const ch=F.filter(k=>JSON.stringify(b[k])!==JSON.stringify(n[k]));return `${esc(n.description||'')}: `+(ch.length?ch.map(k=>`<b>${lab[k]||k}</b> ${esc(b[k]==null||b[k]===''?'(blank)':b[k])} → ${esc(n[k]==null||n[k]===''?'(blank)':n[k])}`).join('; '):'saved with no changes')};
 v.innerHTML=`<div class="card"><h3>Expense changes<span>${(data||[]).length} shown</span></h3>${(data||[]).length?`<div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>Change</th></tr></thead><tbody>${data.map(a=>`<tr><td style="white-space:nowrap">${esc(new Date(a.changed_at).toLocaleString('en-GB'))}</td><td style="white-space:nowrap">${esc(a.changed_by||'–')}</td><td>${what(a)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No edits or deletions yet.</div>'}</div>`}
// ---------- add or edit an expense (Finance only)
const ym=d=>d&&/^\d{4}-\d{2}/.test(d)?(+d.slice(0,4))*100+ +d.slice(5,7):null;
function expenseForm(rec){const h=document.getElementById('modalHost'),x=rec||{},today=new Date().toISOString().slice(0,10),ed=!!rec;
 if(!CAN_WRITE){toast('Only Finance can '+(ed?'edit':'add')+' expenses');return}
 const projs=[...new Set(PROJECTS.concat(PROJ_LIST).concat(x.p?[x.p]:[]))];
 h.innerHTML=`<div class="modal"><div><h3 style="margin:0 0 10px;font-family:var(--f1)">${ed?'Edit expense':'Add expense'}</h3>${ed?`<p class="sub" style="margin:0 0 10px">Source: ${esc(x.o||'–')}. Every change is kept in the change history with who made it.</p>`:''}<form class="form" id="f">
 <label>Project<select id="fp">${projs.map(p=>`<option ${p===(x.p||st.proj[0])?'selected':''}>${esc(p)}</option>`).join('')}</select></label><label>Date<input id="fd" type="date" value="${esc(x.d||today)}" required></label>
 <label>Budget line<input id="fl" list="flList" value="${esc(x.l||'')}" placeholder="pick or type a line code"><datalist id="flList"></datalist></label><label>Voucher / CN number<input id="fv" value="${esc(x.v||'')}"></label>
 <label class="w">Description<input id="fn" required value="${esc(x.n||'')}"></label><label>Staff / supplier<input id="fs" value="${esc(x.s||'')}"></label><label>Amount (₦)<input id="fa" type="number" step="0.01" required value="${x.a!=null&&ed?x.a:''}"></label>
 <label>Type<select id="ft">${TYPES.map(t=>`<option ${t===x.t?'selected':''}>${t}</option>`).join('')}</select></label><label>Retirement status<select id="fr"><option value="">Not applicable</option>${RST.map(t=>`<option ${t===x.r?'selected':''}>${t}</option>`).join('')}</select></label>
 <label class="w">${ed?'Comment (say what was corrected)':'Comment'}<input id="fk" value="${esc(x.k||'')}"></label>
 <div class="w srow"><button class="btn pri" type="submit">${ed?'Save changes':'Save expense'}</button><button class="btn" type="button" id="cn">Cancel</button>${ed?'<button class="btn" type="button" id="dl" style="margin-left:auto;color:var(--bad)">Delete</button>':''}<span class="sub" id="msg"></span></div></form></div></div>`;
 const msg=t=>document.getElementById('msg').textContent=t;
 const fillLines=()=>{const p=document.getElementById('fp').value;document.getElementById('flList').innerHTML=((SET[p]||{}).cats||[]).map(c=>`<option value="${esc(c[0])}">${esc(c[0]+' · '+(c[1]||''))}</option>`).join('')};fillLines();document.getElementById('fp').onchange=fillLines;
 document.getElementById('cn').onclick=()=>h.innerHTML='';
 document.getElementById('f').onsubmit=async e=>{e.preventDefault();const g=i=>document.getElementById(i).value.trim();const d=g('fd'),l=g('fl'),amt=parseFloat(g('fa'));
  if(isNaN(amt)){msg('Enter the amount.');return}
  const row={project_name:g('fp'),expense_date:d||null,budget_line:l||null,category:catOf(l)||null,voucher_ref:g('fv')||null,description:g('fn'),payee:g('fs')||null,amount:amt,expense_type:g('ft'),retirement_status:g('fr')||null,comment:g('fk')||null};
  // the month follows the date for new rows, and for edited rows only when the date is changed
  if(!ed||d!==x.d)row.cost_month=ym(d);
  if(ed&&(x.c||'')===catOf(x.l||'')&&l===(x.l||''))delete row.category;
  try{const r=ed?await SB.from('fin_expenses').update(row).eq('id',x.id).select('id'):await SB.from('fin_expenses').insert({...row,source:'Finance entry'}).select('id');
   if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('the database did not accept the change (check your Finance access)');
   h.innerHTML='';toast(ed?'Expense updated':'Expense saved');await loadAll()}catch(err){msg('Not saved: '+(err.message||'error'))}};
 if(ed)document.getElementById('dl').onclick=async()=>{if(!confirm('Delete this expense?\n\n'+(x.n||'')+' · ₦'+N(x.a)+'\n\nIt stays in the change history.'))return;
  const r=await SB.from('fin_expenses').delete().eq('id',x.id).select('id');if(r.error||!r.data||!r.data.length){msg('Not deleted: '+((r.error&&r.error.message)||'not allowed'));return}h.innerHTML='';toast('Expense deleted');await loadAll()};
}
document.getElementById('addBtn').onclick=()=>expenseForm(null);
document.getElementById('csvBtn').onclick=async()=>{const F=filt();const cols=['p','d','m','l','v','n','s','a','t','r','o','k'];const csv=[['Project','Date','Month','Line','Voucher','Description','Supplier','Amount','Type','Retirement','Source','Comment'].join(',')].concat(F.map(r=>cols.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))).join('\n');
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rahama_expenses.csv';a.click();toast('CSV ready')}catch(e){toast('Download failed')}};
function render(light){document.getElementById('ttl').textContent={dash:'Expense dashboard',ledger:'Expense list',confirm:'FMS payments to confirm',history:'Change history',budget:'Budgets and cash',notes:'Data notes'}[st.view];
 document.getElementById('sub').textContent=st.proj.join(' · ')+' · '+ML(st.from)+' to '+ML(st.to);
 drawNav();if(!light||true){drawSlicers()}const qv=st.view==='confirm'||st.view==='history';document.getElementById('slicers').style.display=qv?'none':'';['csvBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display=qv?'none':'');
 if(qv)document.getElementById('sub').textContent=st.view==='history'?'Every edit and deletion of an expense, newest first':'Payments marked paid in the FMS, waiting for Finance';view();
 const q=document.getElementById('q');if(q&&light&&document.activeElement===document.body){}
}
// ---------- boot
setMonths();render();
(async()=>{
 const gate=m=>{document.body.innerHTML='<div style="max-width:420px;margin:90px auto;padding:28px;font-family:system-ui;text-align:center"><h2>RAHAMA Expense Tracker</h2><p>'+m+'</p><p><a href="index.html">Back to FMS</a></p></div>'};
 try{
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return gate('Please sign in through the FMS first, then open the tracker from the menu.');
  try{const u=JSON.parse(localStorage.getItem('pms_user')||'null');document.getElementById('who').textContent=(u&&u.name)||session.user.email||''}catch(e){document.getElementById('who').textContent=session.user.email||''}
  const w=await SB.rpc('fin_is_finance');CAN_WRITE=w.data===true;
  const addBtn=document.getElementById('addBtn');if(addBtn&&!CAN_WRITE)addBtn.style.display='none';
  document.querySelectorAll('[data-e]').forEach(b=>{if(!CAN_WRITE)b.style.display='none'});
  await loadAll();
  if(!BASE.length&&!Object.keys(SET).length)gate('No data to show. This page is for Finance only.');
 }catch(e){gate('Could not load the tracker: '+esc(e.message||e))}
})();
</script>
