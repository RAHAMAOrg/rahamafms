<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAHAMA Expense Tracker (Finance)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark-green sidebar for views, sticky slicer bar, KPI strip, chart grid, ledger table. */
:root{--bg:#F4F7F5;--panel:#FFFFFF;--ink:#14201A;--mute:#5C6B62;--line:#E2E9E4;--g:#2d7a52;--g2:#40C078;--g3:#DDEFE4;--side:#14432B;--side2:#1a4d32;--sideink:#DCEBE2;--warn:#B7791F;--bad:#C4432A;--good:#2d7a52;--c1:#2d7a52;--c2:#40C078;--c3:#D9A21B;--c4:#3F7CAC;--c5:#8E6BB5;--c6:#C4432A;--chip:#EAF3EE;--shadow:0 1px 2px rgba(16,40,32,0.06),0 4px 14px rgba(16,40,32,0.08);--f1:'Plus Jakarta Sans',system-ui,sans-serif;--f2:'Plus Jakarta Sans',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f2);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(180deg,var(--side) 0%,var(--side2) 100%);color:var(--sideink);padding:22px 0 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.brand{text-align:center;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:12px}
.brand img{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 12px;filter:brightness(0) invert(1)}
.brand b{font-family:var(--f1);font-size:18px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.15;color:#fff}
.brand small{display:block;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.75);margin-top:4px}
.who{margin:0 16px 14px;padding:16px 24px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:#fff}
.who small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:6px}.who b{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.back{margin:14px 16px 0;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:600;font-size:13px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:block}
.back:hover{background:rgba(255,255,255,.2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:10px 20px;margin:0 10px;border-radius:8px;font-weight:500;font-size:13.5px;color:#DCEBE2;display:flex;gap:10px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="true"]{background:#fff;color:var(--side);font-weight:700}
.nav button:focus-visible,.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
.sidefoot{margin-top:auto;padding:14px 20px 0;font-size:11.5px;opacity:.75;line-height:1.5}
main{padding:28px max(16px,env(safe-area-inset-right,0px)) 40px 32px;min-width:0}
h1{font-family:var(--f1);font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.sub{color:var(--mute);font-size:12.5px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.slicers{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;display:grid;gap:8px}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srow>label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;min-width:62px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--chip);padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);min-width:0}
.kpi small{display:block;color:var(--mute);font-size:11.5px;font-weight:600}
.kpi b{font-family:var(--f1);font-size:21px;font-variant-numeric:tabular-nums;display:block;margin-top:2px;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:11.5px;color:var(--mute)}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden;position:relative}
.bar span{display:block;height:100%;background:var(--g2)}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-family:var(--f1);font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 span{font-family:var(--f2);font-weight:500;font-size:11.5px;color:var(--mute)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.cv{position:relative;height:270px}
.cv.tall{height:330px}
.tw{overflow:auto;max-width:100%;max-height:560px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--g);color:#fff;text-align:left;padding:7px 9px;white-space:nowrap;cursor:pointer;user-select:none}
td{padding:6px 9px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.idc td{background:var(--g3)} tr.out td{background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--chip);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}.pill.wa{background:color-mix(in srgb,var(--warn) 24%,transparent);color:var(--warn)}.pill.bd{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;overflow:auto}
.modal>div{background:var(--panel);border-radius:14px;padding:18px;width:min(640px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}.form .w{grid-column:span 2}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;font-weight:600}
.empty{padding:26px;text-align:center;color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);max-width:78ch}
.note li{margin:3px 0}
@media (max-width:980px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px))}.brand{margin:0;padding:0;border:0;display:flex;gap:10px;align-items:center;text-align:left}.brand img{width:38px;height:38px;margin:0}.who{display:none}.back{margin:0;padding:8px 12px}.nav{flex-direction:row;flex-wrap:wrap}.sidefoot{display:none}main{padding-left:max(16px,env(safe-area-inset-left,0px))}.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
@media (max-width:520px){.form{grid-template-columns:1fr}.form .w{grid-column:span 1}.srow>label{min-width:100%}}
</style>
<div class="app">
<aside>
 <div class="brand"><img alt="RAHAMA" src="RAHAMA Empowerment Logo Design (3).png" onerror="this.style.display='none'"><div><b>RAHAMA FMS</b><small>Expense Tracker</small></div></div>
 <div class="who"><small>Signed in as</small><b id="who"></b></div>
 <nav class="nav" id="nav"></nav>
 <a class="back" href="index.html">← Back to FMS</a>
 <div class="sidefoot">Finance and named viewers only.</div>
</aside>
<main>
 <div class="top"><div><h1 id="ttl">Expense dashboard</h1><div class="sub" id="sub"></div></div>
  <div class="srow"><button class="btn pri" id="addBtn">+ Add expense</button><button class="btn" id="csvBtn">Download CSV</button><button class="btn" id="resetBtn">Clear slicers</button></div></div>
 <div class="slicers" id="slicers"></div>
 <div id="view"></div>
</main></div>
<div id="modalHost"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
let BASE=[];
const PROJECTS=['ECHO HIP','GEPP','ASCENT DR-TB','FIFSAN','Core (ADM001)','Other codes'];
const DEF={};
const TYPES=['Direct','IDC','Outside budget'];
const RST=['Retired','Retirement submitted','Retirement rejected','Not retired'];
const N=v=>Math.round(v||0).toLocaleString('en-NG');
const M=v=>{v=v||0;const a=Math.abs(v);return (v<0?'-':'')+'₦'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(0)+'k':a.toFixed(0))};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ML=m=>m?MN[(m%100)-1]+' '+Math.floor(m/100):'';
const nextM=m=>m%100===12?m+89:m+1;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catOf=l=>!l?'':(/^[14]\./.test(l)?l.slice(0,3):l[0]);
const SB=supabase.createClient("https://sqygmoxpegbfxddglhbx.supabase.co","sb_publishable__nPBgo9IeeU4Mrk_ggEeTg_YEkWrB24");
let CAN_WRITE=false,PROJ_LIST=[],QUEUE=[];
const fromDb=r=>({p:r.project_name,d:r.expense_date||'',m:r.cost_month||0,l:r.budget_line||'',c:r.category||catOf(r.budget_line||''),v:r.voucher_ref||'',n:r.description||'',s:r.payee||'',a:Number(r.amount||0),t:r.expense_type,r:r.retirement_status||'',o:r.source||'',k:r.comment||''});
async function pageAll(q){let out=[],from=0;for(;;){const {data,error}=await q().range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return out}
async function loadAll(){
 const [ex,pr,bl,qu]=await Promise.all([pageAll(()=>SB.from('fin_expenses').select('*').order('id')),SB.from('fin_projects').select('*'),SB.from('fin_budget_lines').select('*').order('category_key'),
  SB.from('fin_fms_queue').select('*').eq('status','pending').order('queued_at').then(r=>r,()=>({data:[]}))]);
 QUEUE=(qu&&!qu.error&&qu.data)||[];
 if(pr.error)throw pr.error;
 BASE=ex.map(fromDb);dbRows=[];SET={};PROJ_LIST=(pr.data||[]).map(p=>p.project_name);
 (pr.data||[]).forEach(p=>{SET[p.project_name]={project:p.project_name,budget:Number(p.direct_budget||0),cash:Number(p.cash_received||0),start:p.start_month||0,dur:p.duration_months||0,idc:Number(p.indirect_rate||0),opening:Number(p.opening_spend||0),cats:[]}});
 ((bl&&bl.data)||[]).forEach(b=>{if(SET[b.project_name])SET[b.project_name].cats.push([b.category_key,b.category_name||'',Number(b.budget||0)])});
 setMonths();render()}
let DB=null,dbRows=[],SET={},st={view:'dash',proj:['ECHO HIP'],from:0,to:0,types:[],status:[],src:[],cats:[],q:'',sort:'d',dir:-1,page:0,months:[]};
try{const s=JSON.parse(localStorage.getItem('rahama_slicers')||'null');if(s&&s.proj)Object.assign(st,{proj:s.proj,view:s.view||'dash'})}catch(e){}
const slug=p=>p.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const cfg=p=>Object.assign({budget:0,start:0,dur:0,idc:0,cash:0,opening:0,cats:[]},DEF[p]||{},SET[p]||{});
const all=()=>BASE.concat(dbRows);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setMonths(){const a=all().map(r=>r.m).filter(Boolean);let lo=Math.min(...a,202602),hi=Math.max(...a,202611),o=[];for(let m=lo;m<=hi;m=nextM(m))o.push(m);st.months=o;if(!st.from)st.from=o[0];if(!st.to)st.to=o.filter(m=>m<=202611).pop()}
function base(){return all().filter(r=>st.proj.includes(r.p)&&(!r.m||(r.m>=st.from&&r.m<=st.to)))}
function filt(skip){let q=st.q.toLowerCase();return base().filter(r=>(skip==='types'||!st.types.length||st.types.includes(r.t))&&(!st.status.length||st.status.includes(r.r||'No status'))&&(!st.src.length||st.src.includes(r.o))&&(skip==='cats'||!st.cats.length||st.cats.includes(r.c||'None'))&&(!q||(r.n+' '+r.s+' '+r.v+' '+r.l).toLowerCase().includes(q)))}
const sum=(a,f)=>a.reduce((s,r)=>s+(f?f(r):r.a),0);
const grp=(a,k,v)=>{const o={};a.forEach(r=>{const x=k(r);o[x]=(o[x]||0)+(v?v(r):r.a)});return o};
// ---------- UI shell
const NAV=[['dash','Dashboard'],['ledger','Expense list'],['confirm','To confirm'],['budget','Budgets and cash'],['notes','Data notes']];
function drawNav(){document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<button data-v="${k}" aria-current="${st.view===k}">${k==='confirm'&&QUEUE.length?l+' ('+QUEUE.length+')':l}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;save();render()})}
function save(){try{localStorage.setItem('rahama_slicers',JSON.stringify({proj:st.proj,view:st.view}))}catch(e){}}
function tog(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)}
function chips(label,opts,sel,key){return `<div class="srow"><label>${label}</label>${opts.map(o=>`<button class="chip" data-k="${key}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>`}
function drawSlicers(){
 const cats=[...new Set(base().map(r=>r.c||'None'))].sort();
 const stat=[...new Set(base().map(r=>r.r||'No status'))];
 const srcs=[...new Set(base().map(r=>r.o))];
 const opt=sel=>st.months.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${ML(m)}</option>`).join('');
 document.getElementById('slicers').innerHTML=
  chips('Project',PROJECTS,st.proj,'proj')+
  `<div class="srow"><label>Months</label><select id="mf" aria-label="From month">${opt(st.from)}</select><span class="sub">to</span><select id="mt" aria-label="To month">${opt(st.to)}</select><label style="min-width:auto;margin-left:10px">Search</label><input id="q" placeholder="Description, supplier, CN..." value="${esc(st.q)}" style="flex:1;min-width:150px;max-width:300px"></div>`+
  chips('Type',TYPES,st.types,'types')+chips('Retirement',[...new Set(RST.concat(stat))],st.status,'status')+chips('Source',srcs,st.src,'src')+(cats.length>1?chips('Category',cats,st.cats,'cats'):'');
 document.querySelectorAll('#slicers .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;if(k==='proj'){if(st.proj.includes(v)&&st.proj.length===1)return;tog(st.proj,v);save()}else tog(st[k],v);st.page=0;render()});
 document.getElementById('mf').onchange=e=>{st.from=+e.target.value;if(st.from>st.to)st.to=st.from;render()};
 document.getElementById('mt').onchange=e=>{st.to=+e.target.value;if(st.to<st.from)st.from=st.to;render()};
 const q=document.getElementById('q');q.oninput=e=>{st.q=e.target.value;st.page=0;clearTimeout(window._qt);window._qt=setTimeout(()=>{render(true)},250)};
}
document.getElementById('resetBtn').onclick=()=>{Object.assign(st,{from:st.months[0],to:st.months.filter(m=>m<=202611).pop(),types:[],status:[],src:[],cats:[],q:'',page:0});render()};
// ---------- charts
let CH={};
function mk(id,cfg){if(CH[id])CH[id].destroy();const c=document.getElementById(id);if(!c)return;CH[id]=new Chart(c,cfg)}
function baseOpts(){const tick=css('--mute'),grid=css('--line');return {responsive:true,maintainAspectRatio:false,animation:{duration:350},plugins:{legend:{labels:{color:tick,boxWidth:10,font:{size:11}}},tooltip:{callbacks:{label:c=>(c.dataset.label?c.dataset.label+': ':'')+'₦'+N(c.parsed.y!==undefined&&c.chart.options.indexAxis!=='y'?c.parsed.y:c.parsed.x!==undefined?c.parsed.x:c.parsed)}}},scales:{x:{ticks:{color:tick,font:{size:10.5}},grid:{color:grid}},y:{ticks:{color:tick,font:{size:10.5},callback:v=>M(v)},grid:{color:grid}}}}}
function pal(){return [css('--c1'),css('--c2'),css('--c3'),css('--c4'),css('--c5'),css('--c6')]}
function drawKpis(F,B){
 const dir=sum(B.filter(r=>r.t==='Direct')),idc=sum(B.filter(r=>r.t==='IDC')),out=sum(B.filter(r=>r.t==='Outside budget'));
 let bud=0,cash=0,open=0,el=0,dur=0,one=st.proj.length===1;
 st.proj.forEach(p=>{const c=cfg(p);bud+=c.budget;cash+=c.cash;open+=c.opening});
 const c0=cfg(st.proj[0]);if(one&&c0.start&&c0.dur){el=Math.min(1,((Math.floor(st.to/100)-Math.floor(c0.start/100))*12+st.to%100-c0.start%100+1)/c0.dur);dur=c0.dur}
 const dirAll=dir+open,use=bud?dirAll/bud:null;
 const unret=sum(B.filter(r=>r.o!=='MdM tracker'&&r.r&&r.r!=='Retired'));
 const flag=use!=null&&el?(use>el+.15?['Ahead of pace','bd']:use<el-.3?['Behind pace','wa']:['On pace','ok']):null;
 const tot=dir+idc+out+open;
 const K=[['Direct spend',M(dirAll),open?`incl. ${M(open)} opening`:`${B.filter(r=>r.t==='Direct').length} payments`],
 ['Direct budget',bud?M(bud):'Not entered',bud?`${M(bud-dirAll)} left`:'Set it in Budgets and cash'],
 ['Utilisation',use==null?'n/a':(use*100).toFixed(1)+'%',el?`${(el*100).toFixed(0)}% of time (${dur} mo) · ${flag?flag[0]:''}`:'one project, with start and duration set'],
 ['Indirect cost (IDC)',M(idc),idc&&dir?`${(idc/dir*100).toFixed(2)}% of direct`:'booked as rows'],
 ['Outside budget',M(out),'no budget line'],
 ['Total spend',M(tot),'direct + IDC + outside'],
 ['Cash received',cash?M(cash):'Not entered',cash?`${M(cash-tot)} cash balance`:'Set it in Budgets and cash'],
 ['Paid, not retired',M(unret),'FMS rows with open retirement']];
 document.getElementById('kpis').innerHTML=K.map((k,i)=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b><i>${esc(k[2])}</i>${i===2&&use!=null?`<div class="bar"><span style="width:${Math.min(100,use*100)}%;background:${flag&&flag[1]==='bd'?css('--bad'):css('--g2')}"></span>${el?`<em style="left:${el*100}%"></em>`:''}</div>`:''}</div>`).join('');
}
function drawCharts(F,B){
 const P=pal(),o=baseOpts();
 // monthly
 const mm=st.months.filter(m=>m>=st.from&&m<=st.to&&(B.some(r=>r.m===m)));
 const by=t=>mm.map(m=>sum(F.filter(r=>r.m===m&&r.t===t)));
 let cum=0;const cumv=mm.map((m,i)=>cum+=by('Direct')[i]);
 const o1=baseOpts();o1.scales.x.stacked=true;o1.scales.y.stacked=true;o1.scales.y1={position:'right',ticks:{color:css('--mute'),callback:v=>M(v),font:{size:10.5}},grid:{display:false}};
 o1.onClick=(e,els,ch)=>{if(els.length){const m=mm[els[0].index];st.from=st.to=m;render()}};
 mk('c1',{data:{labels:mm.map(ML),datasets:[{type:'bar',label:'Direct',data:by('Direct'),backgroundColor:P[0],stack:'a'},{type:'bar',label:'IDC',data:by('IDC'),backgroundColor:P[2],stack:'a'},{type:'bar',label:'Outside budget',data:by('Outside budget'),backgroundColor:P[5],stack:'a'},{type:'line',label:'Cumulative direct',data:cumv,yAxisID:'y1',borderColor:P[3],backgroundColor:P[3],tension:.25,pointRadius:3}]},options:o1});
 // categories
 const one=st.proj.length===1,c0=cfg(st.proj[0]);
 const Bn=filt('cats').filter(r=>r.t==='Direct');
 const spent=grp(Bn,r=>r.c||'None');
 let keys=Object.keys(spent).sort((a,b)=>spent[b]-spent[a]);
 const bud={};if(one)c0.cats.forEach(c=>bud[c[0]]=c[2]);
 if(one&&c0.cats.length)keys=[...new Set(c0.cats.map(c=>c[0]).concat(keys))];
 const nm=k=>one&&c0.cats.find(c=>c[0]===k)?k+' '+c0.cats.find(c=>c[0]===k)[1].split(/[:(]/)[0]:(k==='None'?'No line (FMS)':k);
 const o2=baseOpts();o2.indexAxis='y';o2.scales={x:{ticks:{color:css('--mute'),callback:v=>M(v),font:{size:10.5}},grid:{color:css('--line')}},y:{ticks:{color:css('--mute'),font:{size:10.5}},grid:{display:false}}};
 o2.onClick=(e,els)=>{if(els.length){const k=keys[els[0].index];tog(st.cats,k);render()}};
 const ds=[{label:'Spent',data:keys.map(k=>spent[k]||0),backgroundColor:keys.map(k=>st.cats.length&&!st.cats.includes(k)?P[1]+'55':P[0])}];
 if(Object.keys(bud).length)ds.unshift({label:'Budget',data:keys.map(k=>bud[k]||0),backgroundColor:css('--g3'),borderColor:P[1],borderWidth:1});
 mk('c2',{type:'bar',data:{labels:keys.map(nm),datasets:ds},options:o2});
 // type donut
 const tg=grp(F,r=>r.t);const tk=Object.keys(tg);
 const o3={responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{color:css('--mute'),boxWidth:10,font:{size:11}}},tooltip:{callbacks:{label:c=>c.label+': ₦'+N(c.parsed)}}},onClick:(e,els)=>{if(els.length){tog(st.types,tk[els[0].index]);render()}}};
 mk('c3',{type:'doughnut',data:{labels:tk,datasets:[{data:tk.map(k=>tg[k]),backgroundColor:[P[0],P[2],P[5]],borderColor:css('--panel')}]},options:o3});
 // retirement
 const rg=grp(F.filter(r=>r.o!=='MdM tracker'),r=>r.r||'No status');const rk=Object.keys(rg);
 const o4=baseOpts();o4.plugins.legend.display=false;o4.onClick=(e,els)=>{if(els.length){tog(st.status,rk[els[0].index]);render()}};
 const rc={'Retired':P[0],'Retirement submitted':P[3],'Retirement rejected':P[5],'Not retired':P[2]};
 mk('c4',{type:'bar',data:{labels:rk,datasets:[{data:rk.map(k=>rg[k]),backgroundColor:rk.map(k=>rc[k]||P[1])}]},options:o4});
 // payees
 const pg=grp(F.filter(r=>r.s),r=>r.s);const pk=Object.keys(pg).sort((a,b)=>pg[b]-pg[a]).slice(0,10);
 const o5=baseOpts();o5.indexAxis='y';o5.plugins.legend.display=false;o5.scales={x:{ticks:{color:css('--mute'),callback:v=>M(v),font:{size:10.5}},grid:{color:css('--line')}},y:{ticks:{color:css('--mute'),font:{size:10.5}},grid:{display:false}}};
 o5.onClick=(e,els)=>{if(els.length){st.q=pk[els[0].index];render()}};
 mk('c5',{type:'bar',data:{labels:pk.map(s=>s.length>22?s.slice(0,21)+'…':s),datasets:[{data:pk.map(k=>pg[k]),backgroundColor:P[1]}]},options:o5});
 // project compare
 if(st.proj.length>1){const g=grp(F.filter(r=>r.t==='Direct'),r=>r.p);const k=Object.keys(g);const o6=baseOpts();o6.plugins.legend.display=false;mk('c6',{type:'bar',data:{labels:k,datasets:[{data:k.map(x=>g[x]),backgroundColor:P}]},options:o6})}
}
// ---------- views

 if(st.view==='dash'){
  v.innerHTML=`<div class="kpis" id="kpis"></div><div class="grid">
   <div class="card s8"><h3>Spend by month<span>click a bar to filter to that month</span></h3><div class="cv tall"><canvas id="c1"></canvas></div></div>
   <div class="card s4"><h3>Spend by type<span>click to filter</span></h3><div class="cv tall"><canvas id="c3"></canvas></div></div>
   <div class="card s7"><h3>Budget against spend by category<span>click to filter</span></h3><div class="cv tall"><canvas id="c2"></canvas></div></div>
   <div class="card s5"><h3>Retirement status (FMS payments)<span>click to filter</span></h3><div class="cv"><canvas id="c4"></canvas></div></div>
   <div class="card s6"><h3>Top suppliers and staff<span>click to search</span></h3><div class="cv tall"><canvas id="c5"></canvas></div></div>
   ${st.proj.length>1?`<div class="card s6"><h3>Direct spend by project</h3><div class="cv tall"><canvas id="c6"></canvas></div></div>`:`<div class="card s6"><h3>Latest entries</h3><div id="latest"></div></div>`}
  </div>`;
  const F=filt(),B=filt('types');drawKpis(F,filt());drawCharts(F,F);
  const L=document.getElementById('latest');if(L){const r=F.slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')).slice(0,8);L.innerHTML=r.length?`<div class="tw" style="max-height:330px"><table>${r.map(x=>`<tr><td>${x.d.slice(5)}</td><td>${esc(x.n).slice(0,60)}</td><td class="n">${N(x.a)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No entries for these slicers.</div>'}
 }
 if(st.view==='ledger')ledger(v);
 if(st.view==='budget')budgetView(v);
 if(st.view==='notes')notes(v);
 if(st.view==='confirm')confirmView(v);
}
// ---------- FMS payments waiting for Finance to confirm
function confirmView(v){
 const L=QUEUE;
 v.innerHTML=`<div class="card"><h3>FMS payments to confirm<span>${L.length} waiting · ₦${N(L.reduce((s,r)=>s+Number(r.amount||0),0))}</span></h3>
 <p class="note">Each payment marked paid in the FMS appears here. It is <b>not</b> in the tracker or any total until Finance confirms it. Remove anything already in the tracker (for example on the MdM tracker or entered offline).</p>
 ${L.length?`<div class="tw"><table><thead><tr><th>Paid</th><th>Project</th><th>Payment / concept note</th><th>Description</th><th>Staff / supplier</th><th class="n">Amount (₦)</th><th>Retirement</th>${CAN_WRITE?'<th>Finance decision</th>':''}</tr></thead><tbody>
 ${L.map((r,i)=>`<tr><td style="white-space:nowrap">${esc(r.expense_date||'')}</td><td>${esc(r.project_name)}${r.source!=='FMS'?`<div class="sub">${esc(r.source)}</div>`:''}</td><td>${esc(r.payment_ref)}${r.fms_status&&r.fms_status!=='paid'?` <span class="pill bd">now ${esc(r.fms_status)} in FMS</span>`:''}<div class="sub">${esc(r.voucher_ref||'')}</div></td><td>${esc(r.description||'')}</td><td>${esc(r.payee||'')}</td><td class="n">${N(r.amount)}</td><td>${esc(r.retirement_status||'')}</td>
  ${CAN_WRITE?`<td style="min-width:250px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
   <select id="qt${i}" aria-label="Type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select><input id="ql${i}" placeholder="Budget line, e.g. 4.1.14" aria-label="Budget line">
   <input id="qk${i}" placeholder="Comment (reason needed to remove)" aria-label="Comment" style="grid-column:span 2">
   <button class="btn pri" data-qc="${i}">Confirm</button><button class="btn" data-qr="${i}">Remove</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`
 :'<div class="empty">Nothing waiting. New FMS payments appear here once they are marked paid.</div>'}</div>`;
 const busy=b=>{v.querySelectorAll('[data-qc],[data-qr]').forEach(x=>x.disabled=b)};
 v.querySelectorAll('[data-qc]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.qc,r=L[i],line=document.getElementById('ql'+i).value.trim();busy(true);
  const {error}=await SB.rpc('fin_fms_confirm',{p_ref:r.payment_ref,p_type:document.getElementById('qt'+i).value,p_line:line||null,p_category:catOf(line)||null,p_comment:document.getElementById('qk'+i).value.trim()||null});
  if(error){busy(false);toast('Not confirmed: '+error.message);return}toast('Added to the tracker');await loadAll()});
 v.querySelectorAll('[data-qr]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.qr,r=L[i],why=document.getElementById('qk'+i).value.trim();
  if(!why){toast('Write the reason in Comment first');document.getElementById('qk'+i).focus();return}busy(true);
  const {error}=await SB.rpc('fin_fms_remove',{p_ref:r.payment_ref,p_reason:why});
  if(error){busy(false);toast('Not removed: '+error.message);return}toast('Removed from the list');await loadAll()});
}
function ledger(v){
 const F=filt().slice();const cols=[['d','Date'],['p','Project'],['l','Line'],['v','Voucher / CN'],['n','Description'],['s','Staff / supplier'],['a','Amount (₦)'],['t','Type'],['r','Retirement'],['o','Source'],['k','Comment']];
 F.sort((a,b)=>{const x=a[st.sort],y=b[st.sort];return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*st.dir});
 const PS=60,pages=Math.max(1,Math.ceil(F.length/PS));st.page=Math.min(st.page,pages-1);
 const rows=F.slice(st.page*PS,st.page*PS+PS);
 v.innerHTML=`<div class="card"><h3>${F.length} entries · ₦${N(sum(F))}<span>${st.proj.join(', ')}</span></h3>
 <div class="tw"><table><thead><tr>${cols.map(c=>`<th data-s="${c[0]}" class="${c[0]==='a'?'n':''}">${c[1]}${st.sort===c[0]?(st.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.t==='IDC'?'idc':r.t==='Outside budget'?'out':''}"><td>${r.d}</td><td>${esc(r.p)}</td><td>${esc(r.l)}</td><td>${esc(r.v)}</td><td>${esc(r.n)}</td><td>${esc(r.s)}</td><td class="n">${N(r.a)}</td><td>${esc(r.t)}</td><td>${r.r?`<span class="pill ${r.r==='Retired'?'ok':r.r==='Retirement rejected'?'bd':'wa'}">${esc(r.r)}</span>`:''}</td><td>${esc(r.o)}</td><td>${esc(r.k)}</td></tr>`).join('')||`<tr><td colspan="11" class="empty">No entries match these slicers.</td></tr>`}</tbody></table></div>
 <div class="srow" style="margin-top:10px"><button class="btn" id="pv">Previous</button><span class="sub">Page ${st.page+1} of ${pages}</span><button class="btn" id="nx">Next</button></div></div>`;
 v.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.s;st.dir=st.sort===k?-st.dir:1;st.sort=k;render(true)});
 document.getElementById('pv').onclick=()=>{st.page=Math.max(0,st.page-1);render(true)};document.getElementById('nx').onclick=()=>{st.page=Math.min(pages-1,st.page+1);render(true)};
}
function budgetView(v){
 v.innerHTML=st.proj.map(p=>{const c=cfg(p),B=all().filter(r=>r.p===p&&r.m<=st.to),dir=sum(B.filter(r=>r.t==='Direct'));
  const g=grp(B.filter(r=>r.t==='Direct'),r=>r.c||'None');
  return `<div class="card" style="margin-bottom:12px"><h3>${esc(p)}<span><button class="btn" data-e="${esc(p)}">Edit budget and cash</button></span></h3>
  <div class="kpis"><div class="kpi"><small>Direct budget</small><b>${c.budget?M(c.budget):'Not entered'}</b></div><div class="kpi"><small>Direct spend to ${ML(st.to)}</small><b>${M(dir+c.opening)}</b><i>${c.opening?'incl. opening '+M(c.opening):''}</i></div><div class="kpi"><small>Cash received</small><b>${c.cash?M(c.cash):'Not entered'}</b></div><div class="kpi"><small>Start / duration</small><b>${c.start?ML(c.start)+' · '+c.dur+' mo':'Not entered'}</b></div></div>
  ${c.cats.length?`<div class="tw"><table><tr><th>Key</th><th>Category</th><th class="n">Budget</th><th class="n">Spent</th><th class="n">Balance</th><th class="n">Used</th></tr>${c.cats.map(k=>{const s=g[k[0]]||0;const u=k[2]?s/k[2]:0;return `<tr><td>${esc(k[0])}</td><td>${esc(k[1])}</td><td class="n">${N(k[2])}</td><td class="n">${N(s)}</td><td class="n">${N(k[2]-s)}</td><td class="n"><span class="pill ${u>1?'bd':u>.9?'wa':'ok'}">${(u*100).toFixed(0)}%</span></td></tr>`}).join('')}<tr><td></td><td>Spent with no category (FMS payments carry no budget line)</td><td></td><td class="n">${N(g['None']||0)}</td><td></td><td></td></tr></table></div>`:'<div class="empty">No category budget entered. Use Edit budget and cash.</div>'}</div>`}).join('');
 v.querySelectorAll('[data-e]').forEach(b=>{b.onclick=()=>editCfg(b.dataset.e);if(!CAN_WRITE)b.style.display='none'});
}
function editCfg(p){const c=cfg(p);const h=document.getElementById('modalHost');
 h.innerHTML=`<div class="modal"><div><h3 style="margin:0 0 10px;font-family:var(--f1)">${esc(p)}: budget and cash</h3><div class="form">
 <label>Direct budget (₦)<input id="b1" type="number" value="${c.budget}"></label><label>Cash received to date (₦)<input id="b2" type="number" value="${c.cash}"></label>
 <label>Start month (yymm, e.g. 202604)<input id="b3" type="number" value="${c.start||''}"></label><label>Duration (months)<input id="b4" type="number" value="${c.dur||''}"></label>
 <label>IDC rate (e.g. 0.0595)<input id="b5" type="number" step="0.0001" value="${c.idc||''}"></label><label>Opening spend before FMS (₦)<input id="b6" type="number" value="${c.opening||0}"></label>
 <label class="w">Category budgets, one per line: key | name | amount<textarea id="b7" rows="8">${esc(c.cats.map(k=>k.join(' | ')).join('\n'))}</textarea></label></div>
 <div class="srow" style="margin-top:12px"><button class="btn pri" id="sv">Save</button><button class="btn" id="cn">Cancel</button><span class="sub" id="msg"></span></div></div></div>`;
 document.getElementById('cn').onclick=()=>h.innerHTML='';
 document.getElementById('sv').onclick=async()=>{const g=i=>+document.getElementById(i).value||0;
  const cats=document.getElementById('b7').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]).map(a=>[a[0],a[1]||'',+(a[2]||'0').replace(/,/g,'')||0]);
  const d={budget:g('b1'),cash:g('b2'),start:g('b3'),dur:g('b4'),idc:g('b5'),opening:g('b6'),cats};
  if(!CAN_WRITE){document.getElementById('msg').textContent='Only Finance can change budgets and cash.';return}
  try{let r=await SB.from('fin_projects').upsert({project_name:p,direct_budget:d.budget,cash_received:d.cash,start_month:d.start||null,duration_months:d.dur||null,indirect_rate:d.idc||null,opening_spend:d.opening});if(r.error)throw r.error;
   r=await SB.from('fin_budget_lines').delete().eq('project_name',p);if(r.error)throw r.error;
   if(d.cats.length){r=await SB.from('fin_budget_lines').insert(d.cats.map(c=>({project_name:p,category_key:c[0],category_name:c[1],budget:c[2]})));if(r.error)throw r.error}
   }catch(e){document.getElementById('msg').textContent='Not saved: '+(e.message||'error');return}
  h.innerHTML='';toast('Saved');await loadAll()};
}
function notes(v){v.innerHTML=`<div class="card"><h3>How this works</h3><ul class="note">
<li><b>Finance only.</b> Figures are read from the FMS database after sign-in. Nothing is stored in this page.</li>
<li><b>Add expenses each month</b> with Add expense. Budgets, cash received, start month, duration and IDC rate are edited under Budgets and cash.</li>
<li><b>Type</b>: Direct is programme cost. IDC is the indirect cost row. Outside budget is spend with no budget line in the grant.</li>
<li><b>Source</b> shows where each row came from: MdM tracker, Financial Tracker (pre-FMS), FMS, or Finance entry.</li>
<li><b>FMS payments</b> paid from now on wait under To confirm. Finance confirms each one (it then joins the tracker and its retirement status updates by itself) or removes it with a reason.</li>
<li><b>Pace</b>: utilisation is compared with the grant's own duration. Ahead of pace means spend is 15 points above time elapsed.</li></ul></div>`}
// ---------- add expense
document.getElementById('addBtn').onclick=()=>{const h=document.getElementById('modalHost'),today=new Date().toISOString().slice(0,10);
 h.innerHTML=`<div class="modal"><div><h3 style="margin:0 0 10px;font-family:var(--f1)">Add expense</h3><form class="form" id="f">
 <label>Project<select id="fp">${PROJECTS.map(p=>`<option ${p===st.proj[0]?'selected':''}>${p}</option>`).join('')}</select></label><label>Date<input id="fd" type="date" value="${today}" required></label>
 <label>Budget line (e.g. 4.1.14)<input id="fl"></label><label>Voucher / CN number<input id="fv"></label>
 <label class="w">Description<input id="fn" required></label><label>Staff / supplier<input id="fs"></label><label>Amount (₦)<input id="fa" type="number" step="0.01" required></label>
 <label>Type<select id="ft">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Retirement status<select id="fr"><option value="">Not applicable</option>${RST.map(t=>`<option>${t}</option>`).join('')}</select></label>
 <label class="w">Comment<input id="fk"></label>
 <div class="w srow"><button class="btn pri" type="submit">Save expense</button><button class="btn" type="button" id="cn">Cancel</button><span class="sub" id="msg"></span></div></form></div></div>`;
 document.getElementById('cn').onclick=()=>h.innerHTML='';
 document.getElementById('f').onsubmit=async e=>{e.preventDefault();const g=i=>document.getElementById(i).value.trim();const d=g('fd');
  const row={p:g('fp'),d,m:(+d.slice(0,4)-2000)*100+ +d.slice(5,7),l:g('fl'),c:catOf(g('fl')),v:g('fv'),n:g('fn'),s:g('fs'),a:+g('fa'),t:g('ft'),r:g('fr'),o:'Added in tracker',k:g('fk'),ts:Date.now()};
  if(!CAN_WRITE){document.getElementById('msg').textContent='Only Finance can add expenses.';return}
  try{const {error}=await SB.from('fin_expenses').insert({project_name:row.p,expense_date:row.d||null,budget_line:row.l||null,category:row.c||null,voucher_ref:row.v||null,description:row.n,payee:row.s||null,amount:row.a,expense_type:row.t,retirement_status:row.r||null,source:'Finance entry',comment:row.k||null});if(error)throw error;h.innerHTML='';toast('Expense saved');await loadAll()}catch(err){document.getElementById('msg').textContent='Not saved: '+(err.message||'your role cannot add expenses')}};
};
document.getElementById('csvBtn').onclick=async()=>{const F=filt();const cols=['p','d','m','l','v','n','s','a','t','r','o','k'];const csv=[['Project','Date','Month','Line','Voucher','Description','Supplier','Amount','Type','Retirement','Source','Comment'].join(',')].concat(F.map(r=>cols.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))).join('\n');
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rahama_expenses.csv';a.click();toast('CSV ready')}catch(e){toast('Download failed')}};
function render(light){document.getElementById('ttl').textContent={dash:'Expense dashboard',ledger:'Expense list',confirm:'FMS payments to confirm',budget:'Budgets and cash',notes:'Data notes'}[st.view];
 document.getElementById('sub').textContent=st.proj.join(' · ')+' · '+ML(st.from)+' to '+ML(st.to);
 drawNav();if(!light||true){drawSlicers()}const qv=st.view==='confirm';document.getElementById('slicers').style.display=qv?'none':'';['csvBtn','resetBtn'].forEach(id=>document.getElementById(id).style.display=qv?'none':'');
 if(qv)document.getElementById('sub').textContent='Payments marked paid in the FMS, waiting for Finance';view();
 const q=document.getElementById('q');if(q&&light&&document.activeElement===document.body){}
}
// ---------- boot
setMonths();render();
(async()=>{
 const gate=m=>{document.body.innerHTML='<div style="max-width:420px;margin:90px auto;padding:28px;font-family:system-ui;text-align:center"><h2>RAHAMA Expense Tracker</h2><p>'+m+'</p><p><a href="index.html">Back to FMS</a></p></div>'};
 try{
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return gate('Please sign in through the FMS first, then open the tracker from the menu.');
  try{const u=JSON.parse(localStorage.getItem('pms_user')||'null');document.getElementById('who').textContent=(u&&u.name)||session.user.email||''}catch(e){document.getElementById('who').textContent=session.user.email||''}
  const w=await SB.rpc('fin_is_finance');CAN_WRITE=w.data===true;
  const addBtn=document.getElementById('addBtn');if(addBtn&&!CAN_WRITE)addBtn.style.display='none';
  document.querySelectorAll('[data-e]').forEach(b=>{if(!CAN_WRITE)b.style.display='none'});
  await loadAll();
  if(!BASE.length&&!Object.keys(SET).length)gate('No data to show. This page is for Finance only.');
 }catch(e){gate('Could not load the tracker: '+esc(e.message||e))}
})();
